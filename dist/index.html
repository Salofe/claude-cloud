<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Solar Prospector</title>
<meta name="description" content="Mine asteroids, upgrade your ship, trade between planets and rule the Solar System.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root {
  --bg: #070b1c; --panel: rgba(10, 17, 40, 0.92); --panel2: rgba(18, 28, 60, 0.9); --line: rgba(61, 232, 255, 0.22);
  --cyan: #3de8ff; --gold: #ffd24a; --good: #6dffb0; --bad: #ff4d6d; --warn: #ffb347; --txt: #dbe6ff; --dim: #8394bd;
  --ft: 'Rajdhani', 'Segoe UI', system-ui, sans-serif; --fh: 'Orbitron', 'Arial Black', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--txt); font-family: var(--ft); font-size: 15px; user-select: none; -webkit-user-select: none; touch-action: none; }
canvas#c { position: fixed; inset: 0; display: block; }
.hidden { display: none !important; }
b { color: #fff; }
.cr { color: var(--gold) !important; }
.badt { color: var(--bad) !important; }
.dim { color: var(--dim); }
small { color: var(--dim); }
button { font-family: var(--ft); cursor: pointer; }

/* ---------- botones ---------- */
.btn { background: linear-gradient(180deg, #1b2a55, #111b3b); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: 15px; letter-spacing: .3px; transition: .12s; }
.btn:hover:not(:disabled) { border-color: var(--cyan); box-shadow: 0 0 12px rgba(61,232,255,.35); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, #25d3f0, #0e8fb8); color: #03121f; border-color: #7af2ff; }
.btn.danger { background: linear-gradient(180deg, #ff5d7a, #b82643); color: #fff; border-color: #ff9aab; }
.btn.ore { background: linear-gradient(180deg, #ffd24a, #c98a10); color: #231500; border-color: #ffe79a; }
.btn.big { padding: 12px 18px; font-size: 17px; width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: grayscale(.4); }
.x { background: none; border: 1px solid var(--line); color: var(--txt); border-radius: 8px; width: 34px; height: 34px; font-size: 16px; }
.x:hover { border-color: var(--cyan); }
.chip { display: inline-block; border: 1px solid var(--c, var(--line)); color: var(--c, var(--txt)); border-radius: 20px; padding: 2px 9px; font-size: 12px; font-weight: 700; margin: 2px 4px 2px 0; }
.chip.good { --c: var(--good); } .chip.warn { --c: var(--warn); } .chip.bad { --c: var(--bad); } .chip.ore { --c: var(--gold); }

/* ---------- título ---------- */
#title { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(7,11,28,0) 30%, rgba(7,11,28,.7)); }
.tbox { text-align: center; padding: 20px; max-width: 640px; width: 100%; }
#title h1 { font-family: var(--fh); font-weight: 900; font-size: clamp(30px, 7.5vw, 62px); line-height: 1; white-space: nowrap; margin: 0; color: var(--cyan); text-shadow: 0 0 30px rgba(61,232,255,.6), 0 0 2px #fff; letter-spacing: 2px; }
#title h1 span { display: block; color: #fff; }
.tag { font-size: clamp(15px, 3.5vw, 21px); color: var(--gold); letter-spacing: 3px; text-transform: uppercase; font-weight: 700; margin: 14px 0 30px; }
.tbox .tbtns { display: flex; flex-direction: column; gap: 10px; max-width: 320px; margin: 0 auto; }
.foot { color: var(--dim); font-size: 13px; margin-top: 26px; }

/* ---------- HUD ---------- */
.topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: linear-gradient(180deg, rgba(5,9,24,.95), rgba(5,9,24,.75)); border-bottom: 1px solid var(--line); z-index: 10; padding-top: max(8px, env(safe-area-inset-top)); }
.stat { display: flex; flex-direction: column; min-width: 0; }
.stat .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); white-space: nowrap; }
.stat .lbl em { font-style: normal; }
.stat .lbl .sh { display: none; }
.stat .lbl small { color: var(--txt); font-weight: 700; margin-left: 4px; text-transform: none; }
.stat b { font-size: 19px; font-family: var(--fh); font-weight: 600; letter-spacing: .5px; }
.stat.cr b { color: var(--gold); }
.stat.bar { width: 130px; }
.stat.infl b { color: #ffc857; }
.meter { height: 8px; background: rgba(255,255,255,.08); border-radius: 5px; overflow: hidden; margin-top: 4px; border: 1px solid rgba(255,255,255,.06); }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, #ffb347, #ffd24a); border-radius: 5px; transition: width .25s; }
.meter.hp i { background: linear-gradient(90deg, #36d17b, #6dffb0); }
.meter.cargo i { background: linear-gradient(90deg, #1c9fd6, #3de8ff); }
.meter.gold i { background: linear-gradient(90deg, #ff9d2a, #ffd24a); }
.meter.low i { background: linear-gradient(90deg, #b82643, #ff4d6d); animation: pulse 1s infinite; }
.meter.full i { background: linear-gradient(90deg, #ff9d2a, #ffd24a); }
.meter.big { height: 14px; }
@keyframes pulse { 50% { opacity: .5; } }
.topbar .tbtns { margin-left: auto; display: flex; gap: 6px; }
.topbar .tbtns button { background: rgba(255,255,255,.04); border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 6px 10px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
.topbar .tbtns button:hover { border-color: var(--cyan); }
#objective { position: fixed; top: 70px; left: 14px; width: 250px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 8px; padding: 9px 12px; z-index: 5; display: flex; flex-direction: column; gap: 1px; pointer-events: none; }
#objective small { font-size: 10px; letter-spacing: 1.5px; color: var(--gold); }
#objective b { font-size: 16px; }
#objective span { font-size: 13px; color: var(--dim); }
#objective em { font-size: 12px; color: var(--good); font-style: normal; font-weight: 700; }
#objective.flash { animation: flash .9s; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(255,210,74,.9); } 100% { box-shadow: 0 0 0 20px rgba(255,210,74,0); } }
#ticker { position: fixed; bottom: 0; left: 0; right: 0; height: 26px; background: rgba(5,9,24,.88); border-top: 1px solid var(--line); overflow: hidden; z-index: 5; font-size: 13px; line-height: 26px; white-space: nowrap; padding-bottom: env(safe-area-inset-bottom); }
#tickerIn { display: inline-block; padding-left: 100%; animation: tick 70s linear infinite; }
#tickerIn span { margin: 0 6px; }
#tickerIn i { color: var(--cyan); font-style: normal; font-weight: 700; font-size: 11px; }
#tickerIn .sep { color: var(--gold); }
@keyframes tick { to { transform: translateX(-100%); } }

/* ---------- mapa ---------- */
#mapTools { position: fixed; left: 14px; bottom: 40px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
#mapTools button { width: 40px; height: 40px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); color: var(--cyan); font-size: 19px; }
#mapTools button:hover { border-color: var(--cyan); }
.panel { position: fixed; right: 14px; top: 70px; width: 340px; max-height: calc(100% - 110px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; z-index: 6; box-shadow: 0 10px 40px rgba(0,0,0,.5); backdrop-filter: blur(6px); animation: slidein .2s ease-out; }
@keyframes slidein { from { transform: translateX(20px); opacity: 0; } }
.lp-head { display: flex; justify-content: space-between; align-items: flex-start; }
.lp-head h3 { margin: 0; font-family: var(--fh); font-size: 22px; letter-spacing: 1px; color: #fff; }
.chips { margin: 8px 0; }
.desc { color: #b8c6e8; margin: 6px 0 10px; line-height: 1.35; }
.sub { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--cyan); margin: 12px 0 6px; font-weight: 700; }
.ores { display: flex; flex-wrap: wrap; gap: 5px; }
.ore { border: 1px solid var(--c); color: var(--c); border-radius: 6px; padding: 2px 7px; font-size: 13px; font-weight: 700; background: rgba(0,0,0,.25); }
.ore b { color: #fff; }
.warnline { color: var(--warn); font-size: 13px; margin-top: 6px; }
.evs { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.ev { background: rgba(255,200,87,.08); border: 1px solid rgba(255,200,87,.3); border-radius: 8px; padding: 6px 9px; font-size: 14px; }
.travel { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 14px 0 10px; }
.travel div { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); border-radius: 8px; padding: 6px 9px; display: flex; flex-direction: column; }
.travel small { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
.travel b { font-size: 17px; }
.lp-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.here { text-align: center; color: var(--cyan); font-weight: 700; margin-top: 8px; font-size: 13px; letter-spacing: 1px; }
#travelBanner { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--cyan); border-radius: 30px; padding: 8px 22px; font-size: 16px; z-index: 6; box-shadow: 0 0 20px rgba(61,232,255,.3); white-space: nowrap; }

/* ---------- minería ---------- */
.minebox { position: fixed; top: 70px; right: 14px; width: 210px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; z-index: 5; }
.minebox .mname { font-family: var(--fh); font-size: 14px; color: var(--gold); margin-bottom: 3px; }
#mineInfo { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
.crow { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.crow i { width: 9px; height: 9px; border-radius: 2px; transform: rotate(45deg); }
.crow b { margin-left: auto; }
.minebtns { position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; z-index: 5; }
.hint { font-size: 13px; color: var(--dim); }
#touchUI { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
#joyZone { position: absolute; left: 0; bottom: 0; width: 55%; height: 65%; pointer-events: auto; }
#joyBase { position: absolute; width: 110px; height: 110px; border-radius: 50%; border: 2px solid rgba(61,232,255,.35); background: rgba(61,232,255,.06); opacity: 0; pointer-events: none; }
#joyBase.on { opacity: 1; }
#joyKnob { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%; background: rgba(61,232,255,.5); box-shadow: 0 0 16px rgba(61,232,255,.6); }
#fireBtn { position: absolute; right: 26px; bottom: 90px; width: 96px; height: 96px; border-radius: 50%; background: radial-gradient(circle, rgba(255,210,74,.5), rgba(255,140,40,.25)); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-family: var(--fh); font-size: 13px; color: #fff; pointer-events: auto; text-shadow: 0 0 6px #000; }
#fireBtn.on { background: radial-gradient(circle, rgba(255,240,150,.8), rgba(255,160,40,.5)); transform: scale(.95); }

/* ---------- combate ---------- */
#battleUI { position: fixed; bottom: 40px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 5; pointer-events: none; }
#battleUI .bt-btns { display: flex; gap: 10px; pointer-events: auto; }
.bt-title { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); font-family: var(--fh); color: var(--bad); letter-spacing: 3px; font-size: 18px; text-shadow: 0 0 12px rgba(255,77,109,.7); animation: pulse 1.2s infinite; }

/* ---------- modal ---------- */
#modal { position: fixed; inset: 0; background: rgba(3,6,16,.6); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 16px; backdrop-filter: blur(3px); }
.mbox { background: var(--panel); border: 1px solid var(--cyan); border-radius: 14px; padding: 22px 24px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 0 40px rgba(61,232,255,.25); animation: pop .22s ease-out; max-height: 90vh; overflow-y: auto; }
.mbox.danger { border-color: var(--bad); box-shadow: 0 0 40px rgba(255,77,109,.3); }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }
.micon { font-size: 44px; line-height: 1; margin-bottom: 6px; }
.mbox h2 { font-family: var(--fh); margin: 4px 0 10px; font-size: 21px; color: #fff; letter-spacing: 1px; }
.mbody { color: #c4d0ee; line-height: 1.45; font-size: 16px; }
.mbtns { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.fleet { margin-bottom: 8px; }

/* ---------- hoja ---------- */
.sheet { position: fixed; inset: 60px 0 26px 0; margin: 0 auto; max-width: 900px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; z-index: 20; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.6); animation: pop .2s ease-out; backdrop-filter: blur(8px); }
.sh-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sh-head h2 { margin: 0; font-family: var(--fh); font-size: 19px; letter-spacing: 1px; }
.sh-head h2 small { font-family: var(--ft); font-size: 14px; margin-left: 6px; }
.sh-body { padding: 12px 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.sheet.dock .sh-body { overflow: hidden; }
.st-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-size: 14px; }
.st-fac { color: var(--c); font-weight: 700; }
.st-cr { color: var(--gold); font-weight: 700; }
.tabs { display: flex; gap: 4px; margin: 10px 0; overflow-x: auto; flex-shrink: 0; }
.tab { background: rgba(255,255,255,.04); border: 1px solid transparent; color: var(--dim); border-radius: 8px; padding: 7px 12px; font-size: 15px; font-weight: 700; white-space: nowrap; }
.tab.on { color: #fff; border-color: var(--cyan); background: rgba(61,232,255,.1); }
.tab .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
.tabbody { overflow-y: auto; flex: 1; min-height: 0; padding-right: 4px; }
.empty { text-align: center; color: var(--dim); padding: 30px 10px; }
.empty.small { padding: 8px; font-size: 14px; }

.mkt-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.mkt { display: flex; flex-direction: column; }
.mrow { display: grid; grid-template-columns: 1.6fr 1fr .6fr 1.3fr 1fr 1.3fr; align-items: center; gap: 6px; padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,.05); }
.mrow.two { grid-template-columns: 1fr auto auto; }
.mrow.mh { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
.mname { display: flex; align-items: center; gap: 7px; font-weight: 700; flex-wrap: wrap; }
.mname small { font-size: 11px; font-weight: 500; }
.sw { width: 10px; height: 10px; border-radius: 2px; transform: rotate(45deg); flex-shrink: 0; }
.price { font-weight: 700; }
.up { color: var(--good); font-style: normal; font-size: 11px; }
.dn { color: var(--bad); font-style: normal; font-size: 11px; }
.evi { font-style: normal; color: var(--gold); }
.bb { display: flex; gap: 3px; }
.bb button, .mini { background: rgba(61,232,255,.08); border: 1px solid var(--line); color: var(--txt); border-radius: 6px; padding: 4px 7px; font-size: 13px; font-weight: 700; min-width: 30px; }
.bb button:hover, .mini:hover { border-color: var(--cyan); background: rgba(61,232,255,.18); }
.bb button.all { color: var(--cyan); }

.yard-top { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
#yardShip { border-radius: 10px; border: 1px solid var(--line); max-width: 100%; }
.yard-stats { flex: 1; min-width: 220px; font-size: 14px; line-height: 1.6; }
.yard-stats h4 { margin: 0 0 4px; font-family: var(--fh); font-size: 16px; }
.upgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
.upg { background: var(--panel2); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.upg.maxed { border-color: rgba(255,210,74,.4); }
.uh { display: flex; align-items: center; gap: 7px; }
.uicon { color: var(--cyan); font-size: 16px; width: 20px; text-align: center; }
.pips { display: inline-flex; gap: 3px; margin-left: auto; }
.pips i { width: 12px; height: 5px; border-radius: 2px; background: rgba(255,255,255,.12); }
.pips i.on { background: var(--cyan); box-shadow: 0 0 5px var(--cyan); }
.un { font-size: 14px; color: var(--dim); }
.ud { font-size: 13px; color: #b8c6e8; min-height: 18px; }
.upg .btn { margin-top: 4px; padding: 6px 10px; font-size: 14px; }

.svc { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.svcard { background: var(--panel2); border-radius: 10px; padding: 14px; border: 1px solid rgba(255,255,255,.07); }
.svcard h4 { margin: 0 0 8px; font-size: 18px; }
.svcard .btn { margin: 4px 4px 0 0; }

.contract { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel2); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
.contract.ready { border-color: var(--good); box-shadow: 0 0 12px rgba(109,255,176,.2); }
.contract small { display: block; margin-top: 2px; }

.inv p { color: #c4d0ee; }
.invlv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.ivc { background: var(--panel2); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px; text-align: center; }
.ivc.own { border-color: var(--gold); background: rgba(255,210,74,.08); }
.ivc.next { border-color: var(--cyan); }
.ivc em { font-style: normal; font-weight: 700; color: var(--gold); margin-top: 4px; }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.srow { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 14px; }
.srow b { margin-left: auto; }
.srow .pips { margin-left: 8px; }
.inf-big { text-align: center; margin-bottom: 10px; }
.inf-big > div:first-child { display: flex; align-items: baseline; justify-content: center; gap: 8px; }
.inf-big b { font-family: var(--fh); font-size: 44px; color: var(--gold); }
.inf-big .rank { font-family: var(--fh); color: var(--cyan); margin-top: 6px; letter-spacing: 1px; }
.fac { display: grid; grid-template-columns: 180px 1fr 40px; gap: 10px; align-items: center; padding: 5px 0; font-weight: 700; }
.fac b { text-align: right; }
.repbar { height: 10px; background: rgba(255,255,255,.06); border-radius: 5px; position: relative; overflow: hidden; }
.repbar i { position: absolute; top: 0; bottom: 0; }
.repbar em { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.4); }
.news { display: grid; grid-template-columns: 58px 26px 1fr; gap: 6px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 14px; color: #c4d0ee; }
.news i { color: var(--cyan); font-style: normal; font-weight: 700; font-size: 12px; }
.menu { display: flex; flex-direction: column; gap: 10px; max-width: 340px; margin: 20px auto; width: 100%; }
.help h4 { margin: 14px 0 4px; color: var(--cyan); font-size: 17px; }
.help p { margin: 0; color: #c4d0ee; line-height: 1.45; }

/* ---------- banner de eventos y toasts ---------- */
#eventBanner { position: fixed; top: 64px; left: 50%; transform: translate(-50%, calc(-100% - 90px)); visibility: hidden; width: min(560px, calc(100% - 24px)); background: linear-gradient(180deg, rgba(40,28,6,.96), rgba(20,14,4,.96)); border: 1px solid var(--gold); border-radius: 12px; padding: 12px 16px; z-index: 25; display: flex; gap: 12px; align-items: center; transition: transform .45s cubic-bezier(.2,1.3,.4,1), visibility .45s; box-shadow: 0 0 30px rgba(255,210,74,.3); pointer-events: none; }
#eventBanner.show { transform: translate(-50%, 0); visibility: visible; }
#eventBanner .eicon { font-size: 36px; }
#eventBanner small { color: var(--gold); letter-spacing: 1.5px; font-size: 10px; font-weight: 700; }
#eventBanner b { display: block; font-size: 18px; font-family: var(--fh); font-weight: 600; }
#eventBanner p { margin: 2px 0 0; font-size: 14px; color: #e8dcc0; }
#toasts { position: fixed; bottom: 44px; right: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 40; pointer-events: none; align-items: flex-end; }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--cyan); border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: 15px; animation: slidein .2s ease-out; transition: opacity .4s, transform .4s; max-width: 320px; }
.toast.good { border-left-color: var(--good); }
.toast.bad { border-left-color: var(--bad); }
.toast.out { opacity: 0; transform: translateX(20px); }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .topbar { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 4px 10px; padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top)); }
  .topbar .tbtns { grid-column: 2 / 5; justify-content: flex-end; }

// ---------- noise ----------
function hash2(x, y, s) {

// ---------- backdrop (pre-rendered, tileable nebula) ----------
const BD = 512;

function makeBackdrop() {
  const c = document.createElement('canvas'); c.width = BD; c.height = BD;
  const x = c.getContext('2d');
  const img = x.createImageData(BD, BD);
  const P = 4;
  for (let j = 0; j < BD; j++) for (let i = 0; i < BD; i++) {

    const teal = Math.pow(clamp((n2 - 0.5) * 2.8, 0, 1), 1.7);
    const pink = Math.pow(clamp((n3 - 0.58) * 3, 0, 1), 2);

    col = mixc(col, [16, 78, 110], teal * 0.7);
    col = mixc(col, [120, 30, 90], pink * 0.5);

    img.data[k] = col[0]; img.data[k + 1] = col[1]; img.data[k + 2] = col[2]; img.data[k + 3] = 255;
  }

  for (let i = 0; i < 900; i++) {
    x.globalAlpha = 0.15 + r() * 0.45;

}
function makeStars(n, w, h, seed) {

  const out = [];
  for (let i = 0; i < n; i++) out.push({ x: r() * w, y: r() * h, z: 0.25 + r() * 0.75, t: r() * TAU, c: r() });

}
const STARS = makeStars(260, 2000, 2000, 7);

function drawSpaceBg(ctx, W, H, camX, camY, t, tint) {
  if (!backdrop) makeBackdrop();

  const ox = -(((camX * 0.06) % tw) + tw) % tw, oy = -(((camY * 0.06) % tw) + tw) % tw;
  ctx.imageSmoothingEnabled = true;
  for (let x = ox; x < W; x += tw) for (let y = oy; y < H; y += tw) ctx.drawImage(backdrop, x, y, tw, tw);
  if (tint) { ctx.globalAlpha = 0.35; ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  // vignette
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,6,0.55)');

    for (let ox2 = 0; ox2 < W; ox2 += 2000) for (let oy2 = 0; oy2 < H; oy2 += 2000) {

const TEX = {};
const TW = 256, TH = 128;
function planetTex(loc) {
  if (!loc.tex) return null;
  if (TEX[loc.id]) return TEX[loc.id];
  const c = document.createElement('canvas'); c.width = TW; c.height = TH;
  const x = c.getContext('2d');
  const img = x.createImageData(TW, TH);
  const seed = loc.id.length * 13 + loc.id.charCodeAt(0);
  const L = hexRgb(loc.col[0]), D = hexRgb(loc.col[1]);
  const P = 6;

  for (let j = 0; j < TH; j++) for (let i = 0; i < TW; i++) {
    const u = i / TW * P, v = j / TH * P / 2;
    const lat = Math.abs(j / TH - 0.5) * 2; // 0 equator .. 1 pole
    const n = fbm(u, v, seed, P, 5);
    let col;
    switch (loc.tex) {
      case 'earth': {
        const land = fbm(u * 0.8, v * 0.8, seed + 5, P * 0.8, 5);
        if (land > 0.575) col = ramp([[0, [78, 150, 70]], [0.5, [120, 150, 70]], [1, [170, 140, 95]]], (land - 0.575) * 4 + (n - 0.5));
        else col = ramp([[0, [10, 40, 110]], [1, [40, 120, 200]]], land * 1.8);
        if (lat > 0.82 + n * 0.1) col = [235, 242, 250];
        break;
      }
      case 'moon': {
        const maria = fbm(u * 0.6, v * 0.6, seed + 9, P * 0.6, 4);
        col = ramp([[0, [70, 70, 78]], [1, [215, 215, 220]]], n * 0.9 + 0.15);
        if (maria < 0.42) col = mixc(col, [70, 72, 82], 0.6);
        break;
      }
      case 'rock': col = mixc(D, L, clamp((n - 0.3) * 1.6, 0, 1)); break;
      case 'mars': {
        const dark = fbm(u * 0.7, v * 0.7, seed + 3, P * 0.7, 4);
        col = ramp([[0, [120, 40, 20]], [0.5, [205, 95, 55]], [1, [240, 150, 100]]], n);
        if (dark < 0.4) col = mixc(col, [90, 35, 25], 0.55);
        if (lat > 0.88) col = [245, 235, 230];
        break;
      }
      case 'venus': {
        const sw = Math.sin(v * 5 + fbm(u, v, seed + 2, P, 4) * 7);
        col = ramp([[0, [168, 121, 59]], [0.5, [230, 200, 140]], [1, [250, 235, 200]]], 0.5 + sw * 0.25 + (n - 0.5) * 0.5);
        break;
      }
      case 'jupiter': case 'saturn': {
        const turb = fbm(u * 1.5, v * 3, seed + 7, P * 1.5, 4);
        const band = Math.sin((j / TH) * (loc.tex === 'jupiter' ? 22 : 16) + turb * 3.2);
        const stops = loc.tex === 'jupiter'
          ? [[0, [140, 80, 50]], [0.35, [205, 150, 100]], [0.6, [240, 220, 190]], [1, [250, 240, 225]]]
          : [[0, [170, 140, 80]], [0.5, [230, 205, 150]], [1, [250, 240, 205]]];
        col = ramp(stops, 0.5 + band * 0.4 + (n - 0.5) * 0.3);
        break;
      }
      case 'europa': {
        const ridge = Math.abs(fbm(u * 1.3, v * 1.3, seed + 4, P * 1.3, 5) - 0.5);
        col = ramp([[0, [200, 185, 160]], [1, [250, 245, 235]]], n);
        if (ridge < 0.025) col = [150, 95, 60];
        break;
      }
      case 'titan': col = ramp([[0, [170, 95, 30]], [1, [245, 180, 90]]], 0.35 + Math.sin(j / TH * 8 + n * 3) * 0.12 + n * 0.4); break;
      case 'pluto': {
        const heart = fbm(u * 0.7, v * 0.7, seed + 8, P * 0.7, 4);
        col = ramp([[0, [110, 70, 55]], [1, [220, 195, 170]]], n);
        if (heart > 0.58) col = mixc(col, [250, 240, 230], 0.75);
        break;
      }
      default: col = mixc(D, L, n);
    }
    const k = (j * TW + i) * 4;
    img.data[k] = col[0]; img.data[k + 1] = col[1]; img.data[k + 2] = col[2]; img.data[k + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  if (loc.tex === 'rock' || loc.tex === 'moon') {
    let s = seed; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 26; i++) {
      const cx = r() * TW, cy = 10 + r() * (TH - 20), cr = 2 + r() * r() * 12;
      x.fillStyle = 'rgba(0,0,0,0.28)'; x.beginPath(); x.ellipse(cx, cy, cr, cr * 0.9, 0, 0, TAU); x.fill();

    x.fillStyle = 'rgba(190,80,50,0.85)'; x.beginPath(); x.ellipse(TW * 0.3, TH * 0.64, 13, 7, 0, 0, TAU); x.fill();

}

function drawPlanet(ctx, x, y, r, loc, lightAng, t) {

const ENGINE_COL = ['#ffb347', '#5fd0ff', '#b58bff', '#9ff3ff', '#ff6bd6'];

function drawPlayerShip(ctx, lv, x, y, ang, s, thrust, t) {
  const Hd = HULLS[clamp(lv.hull, 1, 5) - 1];
  const E = lv.engine || 1, W = lv.weapons || 1, Lz = lv.laser || 1;
  const ecol = ENGINE_COL[E - 1];
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  const nEng = E >= 4 ? 3 : E >= 2 ? 2 : 1;
  const engY = i => (i - (nEng - 1) / 2) * (Hd.tw * 1.25);
  // flames
  if (thrust > 0) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < nEng; i++) {
      const oy = engY(i);
      const fl = (12 + E * 4 + lv.hull * 2) * thrust * (0.85 + 0.25 * Math.sin(t * 45 + i * 2));
      const g = ctx.createLinearGradient(Hd.tail, 0, Hd.tail - fl, 0);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, ecol); g.addColorStop(1, 'rgba(0,0,0,0)');

      ctx.moveTo(Hd.tail + 1, oy - fw); ctx.quadraticCurveTo(Hd.tail - fl * 0.5, oy - fw * 0.8, Hd.tail - fl, oy);
      ctx.quadraticCurveTo(Hd.tail - fl * 0.5, oy + fw * 0.8, Hd.tail + 1, oy + fw); ctx.fill();

  }

    polyPath(ctx, Hd.wing, -sy);
    const wg = ctx.createLinearGradient(0, 0, 0, Hd.wing[1][1] * -sy);
    wg.addColorStop(0, '#95a2bd'); wg.addColorStop(1, '#4c5770');
    ctx.fillStyle = wg; ctx.fill();
    ctx.strokeStyle = '#1b2235'; ctx.lineWidth = 1; ctx.stroke();
    // leading edge accent
    ctx.strokeStyle = '#3de8ff'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(Hd.wing[0][0], Hd.wing[0][1] * -sy); ctx.lineTo(Hd.wing[1][0], Hd.wing[1][1] * -sy); ctx.stroke();
    // panel line on wing
    ctx.strokeStyle = 'rgba(20,28,48,0.5)'; ctx.lineWidth = 0.8;
    const mx = (Hd.wing[0][0] + Hd.wing[3][0]) / 2, my = (Hd.wing[0][1] + Hd.wing[3][1]) / 2;
    ctx.beginPath(); ctx.moveTo(mx, my * -sy); ctx.lineTo((Hd.wing[1][0] + Hd.wing[2][0]) / 2, Hd.wing[1][1] * -sy * 0.92); ctx.stroke();
    // nav lights
    const blink = (Math.sin(t * 5 + (sy > 0 ? 0 : 1.6)) > 0.2);
    const tip = [(Hd.wing[1][0] + Hd.wing[2][0]) / 2, Hd.wing[1][1] * -sy];
    ctx.fillStyle = sy < 0 ? '#ff4d6d' : '#6dff9e';
    ctx.beginPath(); ctx.arc(tip[0], tip[1], 1.3, 0, TAU); ctx.fill();
    if (blink) glow(ctx, tip[0], tip[1], 6, sy < 0 ? '#ff4d6d' : '#6dff9e', 0.9);
    if (Hd.canard) {
      polyPath(ctx, Hd.canard, -sy);
      ctx.fillStyle = '#7d8aa6'; ctx.fill(); ctx.strokeStyle = '#1b2235'; ctx.lineWidth = 1; ctx.stroke();
    }
    // cargo pods
    for (const [px, py, pw, ph] of Hd.pods) {
      const yy = py * -sy;
      const pg = ctx.createLinearGradient(0, yy - ph / 2, 0, yy + ph / 2);
      pg.addColorStop(0, '#d7deeb'); pg.addColorStop(1, '#7d8aa3');
      ctx.fillStyle = pg;
      roundRect(ctx, px - pw / 2, yy - ph / 2, pw, ph, 2); ctx.fill();
      ctx.strokeStyle = '#1b2235'; ctx.lineWidth = 0.8; ctx.stroke();
      ctx.fillStyle = '#ffb347'; ctx.fillRect(px - pw / 2 + 2, yy - 0.7, pw - 4, 1.4);

  ctx.fillStyle = sg; ctx.fillRect(Hd.tail + 3, -1.1, Hd.ck[0] - Hd.ck[1] - Hd.tail - 3, 2.2);
  ctx.globalCompositeOperation = 'source-over';

    ctx.strokeStyle = '#1b2235'; ctx.lineWidth = 1; ctx.stroke();

  ctx.strokeStyle = '#1b2235'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.ellipse(cx + crx * 0.25, -cry * 0.4, crx * 0.35, cry * 0.22, -0.15, 0, TAU); ctx.fill();
  // turrets
  const tur = W - 1;
  for (let i = 0; i < tur; i++) {
    const tx = Hd.ck[0] - Hd.ck[1] - 6 - i * ((Hd.ck[0] - Hd.tail) / 5.5), ty = (i % 2 ? 1 : -1) * Math.abs(top) * 0.45;
    ctx.fillStyle = '#4a546c'; ctx.beginPath(); ctx.arc(tx, ty, 3, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff934a'; ctx.beginPath(); ctx.arc(tx, ty, 1.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b3246'; ctx.fillRect(tx, ty - 0.8, 7, 1.6);
  }

  const lc = laserColor(Lz);
  ctx.fillStyle = '#39425a'; ctx.fillRect(Hd.hull[0][0] - 5, -1.8 - Lz * 0.2, 5, 3.6 + Lz * 0.4);

}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
}

// ---------- enemy ships ----------
function drawEnemyShip(ctx, type, x, y, ang, s, t) {
  const e = ENEMIES[type];
  const mil = e.military;
  const main = mil ? PAL.military : PAL.enemyMid, dark = mil ? PAL.militaryDark : PAL.enemyDark, lit = mil ? '#d8f0a8' : PAL.enemy;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s * e.size, s * e.size);
  // llama
  ctx.globalCompositeOperation = 'lighter';
  const fl = 10 + 3 * Math.sin(t * 30);
  ctx.fillStyle = mil ? '#9fe0ff' : '#ff6a3a';
  ctx.beginPath(); ctx.moveTo(-14, -3); ctx.lineTo(-14 - fl, 0); ctx.lineTo(-14, 3); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = dark;
  ctx.beginPath();
  ctx.moveTo(6, 0); ctx.lineTo(-10, -16); ctx.lineTo(-16, -16); ctx.lineTo(-8, 0); ctx.lineTo(-16, 16); ctx.lineTo(-10, 16);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = main;
  ctx.beginPath();
  ctx.moveTo(20, 0); ctx.lineTo(-4, -7); ctx.lineTo(-15, -5); ctx.lineTo(-15, 5); ctx.lineTo(-4, 7);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = dark; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = lit;
  ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(4, -2.5); ctx.lineTo(4, 2.5); ctx.fill();
  if (type === 'frigate' || type === 'carrier') {
    ctx.fillStyle = dark;
    ctx.fillRect(-12, -11, 12, 4); ctx.fillRect(-12, 7, 12, 4);
    ctx.fillStyle = lit;
    ctx.fillRect(-2, -10, 3, 2); ctx.fillRect(-2, 8, 3, 2);
  }
  if (type === 'carrier') {
    ctx.fillStyle = main;
    roundRect(ctx, -10, -4, 16, 8, 2); ctx.fill();
    ctx.fillStyle = '#ffd24a'; ctx.fillRect(-6, -1, 8, 2);
  }
  ctx.restore();
}

// ---------- asteroids ----------
function makeRockShape(n, jag) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU;
    pts.push([Math.cos(a), Math.sin(a), 1 - jag + Math.random() * jag * 2]);
  }
  return pts;
}
function drawRock(ctx, a, t, scanLv) {
  const ore = ITEMS[a.ore];
  ctx.save();
  ctx.translate(a.x, a.y); ctx.rotate(a.rot);
  if (a.rich) glow(ctx, 0, 0, a.r * 2.2, ore.c + '66', 0.5 + 0.25 * Math.sin(t * 3 + a.x));
  const g = ctx.createRadialGradient(-a.r * 0.3, -a.r * 0.3, a.r * 0.1, 0, 0, a.r * 1.1);
  g.addColorStop(0, a.cold ? '#8d9bb8' : '#8a7e72');
  g.addColorStop(1, a.cold ? '#2a3348' : '#2e2924');
  ctx.fillStyle = g;
  ctx.beginPath();
  a.shape.forEach((p, i) => {
    const px = p[0] * a.r * p[2], py = p[1] * a.r * p[2];
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  });
  ctx.closePath(); ctx.fill();
  if (a.hit > 0) { ctx.fillStyle = 'rgba(255,240,220,0.22)'; ctx.fill(); }
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1.5; ctx.stroke();
  // vetas de mineral
  ctx.fillStyle = ore.c;
  for (const v of a.veins) {
    ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.arc(v[0] * a.r, v[1] * a.r, v[2] * a.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // cráteres
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  for (const c of a.craters) { ctx.beginPath(); ctx.arc(c[0] * a.r, c[1] * a.r, c[2] * a.r, 0, TAU); ctx.fill(); }
  ctx.restore();
  if (scanLv >= 2 && a.rich) {
    ctx.strokeStyle = ore.c; ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t * 4);
    ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(a.x, a.y, a.r + 8, 0, TAU); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
}

function drawOreChunk(ctx, c, t) {
  const col = ITEMS[c.ore].c;
  glow(ctx, c.x, c.y, 18, col + 'aa', 0.7);
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot + t); ctx.scale(1.45, 1.45);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(4, 0); ctx.lineTo(0, 5); ctx.lineTo(-4, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(1.5, -1); ctx.lineTo(-1.5, -1); ctx.fill();

}

// ---------- station icon ----------
function drawStationIcon(ctx, x, y, s, col, t) {

  ctx.fillStyle = '#5a6a8a';

// ---------- particles ----------
class Particles {
  constructor() { this.list = []; }
  add(x, y, vx, vy, life, col, size, glowy) { this.list.push({ x, y, vx, vy, life, max: life, col, size, glowy }); }
  burst(x, y, n, col, spd, life, size) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, v = spd * (0.3 + Math.random() * 0.7);
      this.add(x, y, Math.cos(a) * v, Math.sin(a) * v, life * (0.5 + Math.random() * 0.5), col, size * (0.5 + Math.random()), true);
    }
  }
  update(dt) {
    for (const p of this.list) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy *= 0.98; p.life -= dt; }
    this.list = this.list.filter(p => p.life > 0);
    if (this.list.length > 900) this.list.splice(0, this.list.length - 900);
  }
  draw(ctx) {
    ctx.globalCompositeOperation = 'lighter';
    for (const p of this.list) {
      const k = p.life / p.max;
      ctx.globalAlpha = k;
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + k * 0.6), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
}

'use strict';
// ============ AUDIO SINTETIZADO ============
let AC = null, master = null, muted = false;
try { muted = localStorage.getItem('sp_muted') === '1'; } catch (e) {}
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.45; master.connect(AC.destination);
    startAmbient();
  } catch (e) { AC = null; }
}
function setMuted(m) {
  muted = m; try { localStorage.setItem('sp_muted', m ? '1' : '0'); } catch (e) {}
  if (master) master.gain.value = m ? 0 : 0.45;
}
function tone(freq, dur, type, vol, slide, delay) {
  if (!AC) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, filt, delay) {
  if (!AC) return;
  const t = AC.currentTime + (delay || 0);
  const buf = AC.createBuffer(1, Math.floor(AC.sampleRate * dur), AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filt || 1200;
  const g = AC.createGain(); g.gain.value = vol || 0.3;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
function sfx(name) {
  if (!AC) return;
  switch (name) {
    case 'click': tone(880, 0.06, 'square', 0.05); break;
    case 'pickup': tone(1200 + Math.random() * 300, 0.08, 'sine', 0.08, 1800); break;
    case 'break': noise(0.25, 0.25, 900); tone(140, 0.2, 'triangle', 0.12, 60); break;
    case 'boom': noise(0.7, 0.5, 600); tone(90, 0.6, 'sawtooth', 0.15, 30); break;
    case 'hit': noise(0.08, 0.15, 3000); break;
    case 'shoot': tone(700, 0.08, 'square', 0.04, 300); break;
    case 'eshoot': tone(420, 0.1, 'sawtooth', 0.035, 180); break;
    case 'shield': tone(300, 0.15, 'sine', 0.08, 600); break;
    case 'cash': tone(1318, 0.08, 'square', 0.06); tone(1760, 0.18, 'square', 0.06, null, 0.08); break;
    case 'upgrade': [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'triangle', 0.1, null, i * 0.07)); break;
    case 'alarm': tone(660, 0.18, 'square', 0.07); tone(440, 0.18, 'square', 0.07, null, 0.2); tone(660, 0.18, 'square', 0.07, null, 0.4); break;
    case 'warp': tone(120, 0.9, 'sawtooth', 0.06, 900); noise(0.9, 0.08, 2000); break;
    case 'event': tone(392, 0.2, 'triangle', 0.08); tone(523, 0.3, 'triangle', 0.08, null, 0.18); break;
    case 'win': [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.3, 'triangle', 0.1, null, i * 0.1)); break;
    case 'lose': [392, 330, 262, 196].forEach((f, i) => tone(f, 0.35, 'sawtooth', 0.06, null, i * 0.15)); break;
    case 'bump': tone(80, 0.15, 'sine', 0.2, 40); break;
    case 'full': tone(300, 0.12, 'square', 0.05); tone(220, 0.15, 'square', 0.05, null, 0.12); break;
  }
}

// ---------- derived stats ----------

function cargoUsed() { let n = 0; for (const k in S.cargo) n += S.cargo[k]; return n; }
function cargoFree() { return ship.cargoMax - cargoUsed(); }
function addCargo(k, n) { S.cargo[k] = (S.cargo[k] || 0) + n; if (S.cargo[k] <= 0) delete S.cargo[k]; }

// ---------- orbital positions ----------
function locPos(loc, day) {
  if (typeof loc === 'string') loc = LOC[loc];
  if (loc.follow) {
    const f = LOC[loc.follow];
    const a = f.a0 + day / f.period * TAU + loc.offset;
    return { x: Math.cos(a) * f.r, y: Math.sin(a) * f.r };
  }
  const a = loc.a0 + day / loc.period * TAU;
  if (loc.parent) {
    const p = locPos(LOC[loc.parent], day);
    return { x: p.x + Math.cos(a) * loc.r, y: p.y + Math.sin(a) * loc.r };
  }
  return { x: Math.cos(a) * loc.r, y: Math.sin(a) * loc.r };
}
function locDist(a, b, day) {
  const p = locPos(a, day), q = locPos(b, day);
  return Math.hypot(p.x - q.x, p.y - q.y);
}
function travelInfo(to, from) {
  from = from || S.loc;
  const d = Math.max(8, locDist(from, to, S.day));
  const fuel = Math.ceil(d * 0.1 * ship.mass / ship.eff * fuelEventMult());
  const days = Math.max(1, Math.round(d / (22 * ship.speed)));
  const danger = routeDanger(from, to);
  return { d, fuel, days, danger };
}
function fuelEventMult() { let m = 1; for (const e of S.events) if (e.fuelCost) m *= e.fuelCost; return m; }

function locDanger(id) {
  if (!has(U.BELT)) return 0;
  let d = LOC[id].danger || 0;
  for (const e of S.events) if (e.danger) for (const x of e.danger) if (x.loc === id) d += x.add;
  return clamp(d, 0, 0.95);
}
function routeDanger(a, b) {
  const base = Math.max(locDanger(a), locDanger(b)) * 0.8 + (locDanger(a) + locDanger(b)) * 0.1;
  return clamp(base * (1 - ship.avoid), 0, 0.9);
}

// ---------- market ----------
function eventPriceMult(locId, item) {
  let m = 1;
  for (const e of S.events) if (e.price) for (const p of e.price) if ((p.loc === locId || p.loc === '*') && p.item === item) m *= p.m;
  return m;
}
function basePrice(locId, item) {
  const l = LOC[locId];
  const mult = l.market && l.market[item];
  if (mult == null) return null;
  return ITEMS[item].b * mult * (1 + (S.drift[locId][item] || 0)) * (S.sat[locId][item] || 1) * eventPriceMult(locId, item);
}
function sellPrice(locId, item) { const p = basePrice(locId, item); return p == null ? null : Math.max(1, Math.round(p * 0.93)); }
function buyPrice(locId, item) {
  const l = LOC[locId]; const mult = l.market && l.market[item];
  if (mult == null || mult > 1.0 || ITEMS[item].ore) return null;
  return Math.max(2, Math.round(basePrice(locId, item) * 1.07));
}
function fuelPrice(locId) {
  let p = LOC[locId].fuel || 6; for (const e of S.events) if (e.fuelPrice) p *= e.fuelPrice; return Math.max(1, Math.round(p * 10) / 10);
}
function marketClosed(locId) { return S.events.some(e => e.closed && e.closed.includes(locId)); }

function earn(n) {
  S.credits += n; S.stats.earned += n;
  checkUnlocks();
}
function doSell(locId, item, n) {
  n = Math.min(n, S.cargo[item] || 0);
  let total = 0;
  for (let i = 0; i < n; i++) {
    total += sellPrice(locId, item);
    S.sat[locId][item] = Math.max(0.4, S.sat[locId][item] * (ITEMS[item].ore ? 0.992 : 0.982));
  }
  addCargo(item, -n);
  S.stats.traded += n;
  const l = LOC[locId];
  if (n > 0) {
    if (l.faction) {
      let gain = total / 3000;
      for (const e of S.events) if (e.relief && e.relief.loc === locId && e.relief.item === item) gain += n * 0.35;
      if (item === 'arms') for (const e of S.events) if (e.war && e.war.includes(l.faction)) {
        const other = e.war.find(f => f !== l.faction); repChange(other, -n * 0.15, true); gain += n * 0.2;
      }
      repChange(l.faction, gain, true);
    }
    if (l.black) for (const f in FACTIONS) if (f !== 'piratas') repChange(f, -n * 0.02, true);
  }
  earn(total);
  return total;
}
function doBuy(locId, item, n) {
  n = Math.min(n, cargoFree());
  let total = 0, bought = 0;
  for (let i = 0; i < n; i++) {
    const p = buyPrice(locId, item);
    if (p == null || S.credits - total < p) break;
    total += p; bought++;
    S.sat[locId][item] = Math.min(1.6, S.sat[locId][item] * 1.012);

}
function repChange(f, d, silent) {

  if (!silent && Math.abs(d) >= 1) toast(`${FACTIONS[f].n}: ${d > 0 ? '+' : ''}${Math.round(d)} reputation`, d > 0 ? 'good' : 'bad');
  return S.rep[f] - before;
}

// Docking: auto-sell ore, refuel, repair
function dockAtStation() {
  const id = S.loc, l = LOC[id];
  const r = { sold: [], total: 0, fuel: 0, fuelCost: 0, repair: 0, repairCost: 0 };
  if (!marketClosed(id)) {
    for (const k of ORES) if (S.cargo[k]) {
      const n = S.cargo[k]; const got = doSell(id, k, n);
      r.sold.push([k, n, got]); r.total += got;
    }
  }
  if (has(U.MAP)) {
    const fp = fuelPrice(id);
    const need = Math.floor(ship.fuelMax - S.fuel);
    const can = Math.min(need, Math.floor(S.credits / fp));
    if (can > 0) { S.fuel += can; S.credits -= Math.ceil(can * fp); r.fuel = can; r.fuelCost = Math.ceil(can * fp); }
  }
  const hneed = Math.ceil(ship.hpMax - S.hull);
  if (hneed > 0) {
    const rp = l.repair || 3;
    const can = Math.min(hneed, Math.floor(S.credits / rp));
    if (can > 0) { S.hull = Math.min(ship.hpMax, S.hull + can); S.credits -= Math.ceil(can * rp); r.repair = can; r.repairCost = Math.ceil(can * rp); }
  }
  S.stats.docks++;
  if (has(U.TRADE) && (!S.contracts[id] || !S.nextContracts[id])) genContracts(id);

    S.drift[id][k] = clamp(S.drift[id][k] * 0.96 + rand(-0.035, 0.035), -0.25, 0.25);
  }
  for (const id in S.depl) S.depl[id] = Math.max(0, S.depl[id] - 0.06);
  const inc = dailyIncome();
  if (inc) earn(inc);
  if (has(U.TRADE)) {
    const ended = S.events.filter(e => e.end <= S.day);
    for (const e of ended) addNews('🕊️', `Over: ${e.title}`, '#8fa3c7');
    S.events = S.events.filter(e => e.end > S.day);
    if (S.day >= S.nextEvent) {
      if (S.events.length < 3) spawnEvent();
      S.nextEvent = S.day + randi(9, 17);
    }
    for (const id in S.nextContracts) if (S.day >= S.nextContracts[id]) genContracts(id);
    for (const c of [...S.active]) if (S.day > c.deadline) {
      S.active = S.active.filter(x => x !== c);
      if (c.faction) repChange(c.faction, -4, true);
      addNews('❌', `Contract expired. Reputation −4`, '#ff6b7d');
      toast('A contract expired', 'bad');
    }
  }
  if (S.day % 3 === 0) save();
}

function addNews(icon, html, col) {
  S.news.unshift({ day: S.day, icon, html, col });
  if (S.news.length > 60) S.news.length = 60;
  if (typeof updateTicker === 'function') updateTicker();
}

'use strict';
// ============ SCENE: SOLAR SYSTEM MAP ============
const BELT = []; const KUIPER = [];
(function () {
  let s = 3; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const cols = ['#c9b8a0', '#a89a88', '#d9c6a8', '#8f8577', '#b7a58c'];
  for (let i = 0; i < 900; i++) BELT.push({ a: r() * TAU, r: 238 + (r() + r() + r() - 1.5) * 34, s: 0.6 + r() * 1.6, sp: 0.9 + r() * 0.2, c: cols[Math.floor(r() * cols.length)] });
  for (let i = 0; i < 600; i++) KUIPER.push({ a: r() * TAU, r: 585 + (r() + r() - 1) * 60, s: 0.6 + r() * 1.5, sp: 0.95 + r() * 0.1, c: r() > 0.5 ? '#a9c2ff' : '#d0dcff' });
})();

const MapScene = {
  cam: { x: 0, y: 0, z: 1 }, camT: null, sel: null, travel: null, t: 0, hover: null, drag: null, trail: new Particles(),
  enter() {
    this.focus(S.loc, true);
    showMapUI(true);
    selectLoc(this.sel || S.loc);
  },
  exit() { showMapUI(false); },
  focus(id, instant) {
    const p = locPos(id, S.day);
    const z = clamp(Math.min(W, H) / 2 / (Math.hypot(p.x, p.y) * 0.5 + 120), 0.45, 2.4);
    const t = { x: p.x * 0.6, y: p.y * 0.6, z };
    if (instant) Object.assign(this.cam, t); else this.camT = t;
  },
  zoomAll() {
    let m = 0; for (const l of NODES) if (locOpen(l.id)) { const p = locPos(l.id, S.day); m = Math.max(m, Math.hypot(p.x, p.y)); }
    this.camT = { x: 0, y: 0, z: Math.min(W, H) / 2 / (m + 70) };
  },
  w2s(x, y) { return { x: (x - this.cam.x) * this.cam.z + W / 2, y: (y - this.cam.y) * this.cam.z + H / 2 }; },
  s2w(x, y) { return { x: (x - W / 2) / this.cam.z + this.cam.x, y: (y - H / 2) / this.cam.z + this.cam.y }; },
  pr(loc) { return loc.size * clamp(this.cam.z * 1.5, 1, 3.4); },
  spos(loc, day) {
    if (typeof loc === 'string') loc = LOC[loc];
    if (day == null) day = S.day + (this.travel ? this.travel.frac : 0);
    if (loc.parent) {
      const par = LOC[loc.parent];
      const pp = this.spos(par, day);
      const a = loc.a0 + day / loc.period * TAU;
      const d = Math.max(loc.r * this.cam.z, this.pr(par) + this.pr(loc) + 14);
      return { x: pp.x + Math.cos(a) * d, y: pp.y + Math.sin(a) * d };
    }
    const p = locPos(loc, day);
    return this.w2s(p.x, p.y);
  },
  routeCurve(a, b) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const sun = this.w2s(0, 0);
    let nx = -(b.y - a.y), ny = b.x - a.x; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
    if ((mx - sun.x) * nx + (my - sun.y) * ny < 0) { nx = -nx; ny = -ny; }

  },
  bez(q, t) { const u = 1 - t; return { x: u * u * q.a.x + 2 * u * t * q.c.x + t * t * q.b.x, y: u * u * q.a.y + 2 * u * t * q.c.y + t * t * q.b.y }; },
  update(dt) {
    this.t += dt;
    this.trail.update(dt);
    const tr = this.travel;
    if (tr && !tr.paused) {
      tr.el += dt;
      const p = clamp(tr.el / tr.dur, 0, 1);
      const dayNow = Math.floor(p * tr.days);
      while (tr.dayDone < dayNow) { tr.dayDone++; tickDay(); }
      tr.frac = p * tr.days - dayNow;
      if (tr.enc && !tr.encDone && p >= tr.enc.at) { tr.encDone = true; tr.paused = true; runEncounter(tr.enc, () => { tr.paused = false; }); }

      if (tr.shipPos) {

  startTravel(to) {

    this.travel = { from: S.loc, to, days: info.days, dur, el: 0, dayDone: 0, frac: 0, enc, encDone: false, storm };

    const p = locPos(S.loc, S.day), q = locPos(to, S.day);

  arrive() {

  draw(ctx) {

      ctx.fillStyle = isSel ? '#ffffff' : '#cfe0ff';
      ctx.fillText(label, p.x, ly + 0.5);
      ctx.globalAlpha = 1;
      if (open) {

        if (icons) { ctx.font = '12px sans-serif'; ctx.fillText(icons, p.x, p.y - r - 10); }

    }
    ctx.textBaseline = 'alphabetic';
    // player ship
    if (tr) {
      const q = this.routeCurve(this.spos(tr.from), this.spos(tr.to));
      const p = clamp(tr.el / tr.dur, 0, 1), e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      const sp = this.bez(q, e), sp2 = this.bez(q, Math.min(1, e + 0.01));

      this.trail.draw(ctx);

    }
  },
  pick(x, y) {
    let best = null, bd = 1e9;
    for (const l of NODES) {
      const p = this.spos(l);
      const d = Math.hypot(p.x - x, p.y - y);
      const hit = Math.max(22, this.pr(l) + 14);
      if (d < hit && d < bd) { bd = d; best = l.id; }
    }
    return best;
  },
  onDown(x, y) { this.drag = { x, y, cx: this.cam.x, cy: this.cam.y, moved: false }; },
  onMove(x, y, down) {
    if (down && this.drag) {
      const dx = x - this.drag.x, dy = y - this.drag.y;
      if (Math.hypot(dx, dy) > 6) this.drag.moved = true;
      if (this.drag.moved && !this.travel) { this.camT = null; this.cam.x = this.drag.cx - dx / this.cam.z; this.cam.y = this.drag.cy - dy / this.cam.z; }

  },
  onUp(x, y) {

    }

  onWheel(dy, x, y) {

    this.cam.z = clamp(this.cam.z * Math.pow(1.0015, -dy), 0.35, 3.5);
    const after = this.s2w(x, y);
