}

// ---------- HUD ----------
function hudTick(dt) {
  if (!S) return;
  const d = S.credits - shownCredits;
  if (Math.abs(d) < 1) shownCredits = S.credits;
  else shownCredits += d * Math.min(1, dt * 6) + Math.sign(d) * Math.min(Math.abs(d), dt * 40);
  $('hCr').textContent = fmt(shownCredits);
  $('hCr').parentElement.classList.toggle('up', d > 1);
  const inc = totalIncome();
  $('hRate').textContent = inc > 0 ? `+${fmt(inc)}/s` : '';
}
function updateHUD() {
  if (!S) return;
  for (const el of document.querySelectorAll('[data-need]')) el.classList.toggle('locked', S.unlock < +el.dataset.need);
  $('hDay').textContent = S.day;
  $('hFuel').style.width = (S.fuel / ship.fuelMax * 100) + '%';
  $('hFuelT').textContent = `${Math.floor(S.fuel)}/${ship.fuelMax}`;
  $('hHull').style.width = (S.hull / ship.hpMax * 100) + '%';
  $('hHullT').textContent = `${fmt(Math.ceil(S.hull))}/${fmt(ship.hpMax)}`;
  $('hCargo').style.width = (cargoUsed() / ship.cargoMax * 100) + '%';
  $('hCargoT').textContent = `${fmt(cargoUsed())}/${fmt(ship.cargoMax)}`;
  const inf = influence();
  $('hInfl').textContent = inf;
  $('hRank').textContent = rankName(inf);
  $('hFuel').parentElement.classList.toggle('low', S.fuel < ship.fuelMax * 0.2);
  $('hHull').parentElement.classList.toggle('low', S.hull < ship.hpMax * 0.3);
  $('hCargo').parentElement.classList.toggle('full', cargoFree() <= 0);
  const nu = nextUnlock();
  const o = $('objective');
  if (nu) {
    const prev = UNLOCKS[S.unlock].at, pct = clamp((S.stats.earned - prev) / (nu.at - prev), 0, 1);
    o.innerHTML = `<small>NEXT UNLOCK</small><b>${nu.icon} ${nu.title}</b><div class="meter gold"><i style="width:${pct * 100}%"></i></div><span>${fmt(S.stats.earned)} / ${fmt(nu.at)} cr earned</span>`;
  } else if (!S.won) {
    o.innerHTML = `<small>FINAL GOAL</small><b>👑 Reach 100 influence</b><div class="meter gold"><i style="width:${Math.min(100, inf)}%"></i></div><span>Influence ${inf}/100 · invest & upgrade outposts</span>`;
  } else o.innerHTML = `<small>SOLAR SOVEREIGN</small><b>👑 You rule the system</b><span>Keep growing your empire.</span>`;
  if (!S.won && has(U.SATURN) && inf >= 100 && !isBlocking()) victory();
  if (pendingUnlocks.length && $('modal').classList.contains('hidden') && !(scene === MineScene && (MineScene.inCombat || MineScene.space)) && !(MapScene.travel)) showUnlock(pendingUnlocks.shift());
}
function showUnlock(i) {
  const u = UNLOCKS[i];
  sfx('win');
  const upg = u.upg.length ? `<div class="unl-upg">${u.upg.map(k => `<span class="chip ore">${UPG[k].icon} ${UPG[k].n}</span>`).join('')}</div><small>New upgrades available at any station.</small>` : '';
  showModal({ icon: u.icon, title: u.title, cls: 'unlock', html: `<div class="unl-tag">NEW!</div><p>${u.text}</p>${upg}`,
    buttons: [{ label: 'Awesome!', cls: 'primary', fn: () => { if (!$('sheet').classList.contains('hidden') && LOC[S.loc].station) renderDock(); updateHUD(); } }] });
  const el = $('objective'); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function victory() {
  S.won = true; save();
  sfx('win');
  showModal({ icon: '👑', title: 'You rule the Solar System!', html: `In <b>${S.day} days</b> you went from chipping rocks on the Moon to the most powerful force in the system.<br><br>
    Ore mined: <b>${fmt(S.stats.mined)}</b><br>Total earnings: <b>${fmt(S.stats.earned)} cr</b><br>Battles won: <b>${S.stats.won}</b><br>Contracts: <b>${S.stats.contracts}</b><br><br>Keep playing and grow your empire.`,
    buttons: [{ label: 'Keep playing', cls: 'primary', fn: () => {} }] });
}

// ---------- map panel ----------
function selectLoc(id) {
  MapScene.sel = id;
  const l = LOC[id];
  const p = $('locPanel');
  const here = id === S.loc;
  let html = `<div class="lp-head"><div><h3>${l.n}</h3><small>${[l.station, l.field && l.field.n].filter(Boolean).join(' · ')}</small></div><button class="x" onclick="hideLocPanel()">✕</button></div>`;
  if (!locOpen(id)) {
    const u = UNLOCKS[l.tier];
    html += `<div class="locked-box">🔒 Unlocks at <b>${fmt(u.at)} cr</b> lifetime earnings<br><small>${u.title}</small></div><p class="desc">${l.desc}</p>`;
    p.innerHTML = html; p.classList.remove('hidden'); return;
  }
  html += `<p class="desc">${l.desc}</p><div class="chips">`;
  if (l.field) html += '<span class="chip ore">⛏ Mining</span>';
  if (l.station) html += `<span class="chip" style="--c:${l.faction ? FACTIONS[l.faction].c : '#fff'}">🛰 ${l.station}</span>`;
  const dg = locDanger(id);
  if (has(U.BELT)) html += dg < 0.1 ? '<span class="chip good">Safe</span>' : dg < 0.3 ? '<span class="chip warn">Some pirates</span>' : '<span class="chip bad">☠ Dangerous</span>';
  html += '</div>';
  const evs = S.events.filter(e => e.locs && e.locs.includes(id));
  if (evs.length) html += `<div class="evs">${evs.map(e => `<div class="ev">${e.icon} <b>${e.title}</b> <small>(${e.end - S.day}d)</small></div>`).join('')}</div>`;
  if (l.field) {
    const ores = Object.keys(l.field.ores).sort((a, b) => l.field.ores[b] - l.field.ores[a]);
    html += `<div class="ores">${ores.map(o => `<span class="ore" style="--c:${ITEMS[o].c}">${ITEMS[o].n}</span>`).join('')}</div>`;
    if (l.field.hazard === 'heat') html += `<div class="warnline">🔥 Extreme heat — damages your hull unless you have shields.</div>`;
  }
  if (l.market && !here && cargoUsed()) {
    const v = oreValueAt(id);
    if (v) html += `<div class="valline">Your ore sells for <b class="cr">${fmt(v)} cr</b> here${LOC[S.loc].market ? ` <small>(${fmt(oreValueAt(S.loc))} at ${LOC[S.loc].n})</small>` : ''}</div>`;
  }
  if (l.market && has(U.TRADE) && !here) {
    const hot = Object.keys(l.market).map(k => ({ k, m: priceRatio(id, k) })).filter(x => x.m >= 1.45).sort((a, b) => b.m - a.m).slice(0, 4);
    if (hot.length) html += `<div class="sub">Pays well for</div><div class="ores">${hot.map(x => `<span class="ore" style="--c:${ITEMS[x.k].c}">${ITEMS[x.k].n} <b>×${x.m.toFixed(1)}</b></span>`).join('')}</div>`;
  }
  if (has(U.TRADE)) {
    const pw = [];
    if (l.market && !l.depot) pw.push(`<button class="btn small-btn" ${S.credits >= POWERS.boom.cost() ? '' : 'disabled'} onclick="doPower('boom','${id}')">🏗️ Fund a boom (ore ×1.9) · ${fmt(POWERS.boom.cost())}</button>`);
    if (has(U.BELT) && (LOC[id].danger || 0) >= 0.1) pw.push(`<button class="btn small-btn" ${S.credits >= POWERS.purge.cost() ? '' : 'disabled'} onclick="doPower('purge','${id}')">🛡️ Clear pirates (30 days) · ${fmt(POWERS.purge.cost())}</button>`);
    if (pw.length) html += `<div class="sub">⚡ Your power</div><div class="powers">${pw.join('')}</div>`;
  }
  if (here) {
    html += `<div class="lp-actions">`;
    if (l.station) html += `<button class="btn primary big" onclick="openDock()">🛰 Dock at ${l.station}</button>`;
    if (l.field) html += `<button class="btn ore big" onclick="enterMine()">⛏ Mine ${l.field.n}</button>`;
    if (!l.station) {
      const stations = NODES.filter(x => x.station && locOpen(x.id));
      const reachable = stations.some(x => travelInfo(x.id).fuel <= S.fuel);
      if (!reachable) html += `<button class="btn danger big" onclick="towShip('You ran out of fuel.')">🚨 Call a tug</button>`;
    }
    html += `</div>`;
  } else {
    const info = travelInfo(id);
    const ok = info.fuel <= S.fuel;
    html += `<div class="travel">
      <div><small>Fuel</small><b class="${ok ? '' : 'badt'}">${info.fuel} <small>/ ${Math.floor(S.fuel)}</small></b></div>
      <div><small>Time</small><b>${info.days} day${info.days > 1 ? 's' : ''}</b></div>
      ${has(U.BELT) ? `<div><small>Ambush risk</small><b class="${info.danger > 0.3 ? 'badt' : ''}">${Math.round(info.danger * 100)}%</b></div>` : ''}</div>
      <button class="btn primary big" ${ok ? '' : 'disabled'} onclick="MapScene.startTravel('${id}')">${ok ? '🚀 Fly here' : '⛽ Not enough fuel — upgrade your tank or wait for a closer orbit'}</button>`;
  }
  p.innerHTML = html;
  p.classList.remove('hidden');
}

    </div>`;
  }
  let sellbox = '';
  const oreN = ORES.reduce((n, k) => n + (S.cargo[k] || 0), 0);

    sellbox = `<div class="sellbox">
      <div class="sb-cargo"><small>ORE IN CARGO</small><span>${ORES.filter(k => S.cargo[k]).map(k => `<i class="sw" style="background:${ITEMS[k].c}"></i>${fmt(S.cargo[k])} ${ITEMS[k].n}`).join(' &nbsp; ')}</span></div>

function upgDelta(k, a, b) {

  switch (k) {
    case 'hull': return `New ship: <b>${UPG.hull.names[b - 1]}</b><br>Base cargo ${ar(UPG.hull.cargo[a - 1], UPG.hull.cargo[b - 1])} · Armor ${ar(UPG.hull.hp[a - 1], UPG.hull.hp[b - 1])}`;
    case 'laser': return `Mining power ${ar(fmt(at(a, () => ship.laserDps)), fmt(at(b, () => ship.laserDps)))}`;
    case 'magnet': return `Range ${ar(at(a, () => ship.magnet), at(b, () => ship.magnet))}${at(b, () => ship.drones) > at(a, () => ship.drones) ? ' · <b>+1 drone</b>' : ` · drones ${at(a, () => ship.drones)}`}`;
    case 'cargo': return `Cargo ${ar(at(a, () => ship.cargoMax), at(b, () => ship.cargoMax))}`;
    case 'refinery': return `All ore value ${ar('×' + at(a, () => ship.refinery).toFixed(2), '×' + at(b, () => ship.refinery).toFixed(2))}`;
    case 'engine': return `Speed ${ar('×' + at(a, () => ship.speed).toFixed(2), '×' + at(b, () => ship.speed).toFixed(2))} · Warp ${at(b, () => ship.warpTime).toFixed(1)}s`;
    case 'tank': return `Fuel ${ar(at(a, () => ship.fuelMax), at(b, () => ship.fuelMax))}`;
    case 'shield': return `Shield ${ar(fmt(at(a, () => ship.shieldMax)), fmt(at(b, () => ship.shieldMax)))}`;
    case 'weapons': return `Firepower ${ar(fmt(at(a, () => ship.weaponDps)), fmt(at(b, () => ship.weaponDps)))}`;
    case 'scanner': return `Ambush avoidance ${ar(Math.round(at(a, () => ship.avoid) * 100) + '%', Math.round(at(b, () => ship.avoid) * 100) + '%')}`;
  }
}
function affordableLevels(k) {

}

function drawShipPreview(id, lv, t) {
  const c = $(id); if (!c) return;
  const x = c.getContext('2d');
  const w = c.width, h = c.height;
  x.clearRect(0, 0, w, h);
  const g = x.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w / 2);
  g.addColorStop(0, '#16224a'); g.addColorStop(1, '#070b1c');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.strokeStyle = 'rgba(61,232,255,0.1)';
  for (let i = 0; i < w; i += 20) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, h); x.stroke(); }
  for (let i = 0; i < h; i += 20) { x.beginPath(); x.moveTo(0, i); x.lineTo(w, i); x.stroke(); }
  const Hd = HULLS[lv.hull - 1];
  const ex = Hd.hull[0][0] - Hd.tail + 28, ey = Math.abs(Hd.wing[1][1]) * 2 + 8;
  const sc = Math.min(w * 0.78 / ex, h * 0.8 / ey);
  const cx = (Hd.hull[0][0] + Hd.tail - 22) / 2;
  drawPlayerShip(x, lv, w / 2 - cx * sc, h / 2 + Math.sin(t * 1.5) * 3, 0, sc, 0.7 + 0.3 * Math.sin(t * 3), t);
}

  let h = '<p class="hint">Spend your fortune on projects that change the Solar System forever. Each one also adds influence.</p><div class="projs">';
  for (const p of PROJECTS) {
    const done = built(p.id), open = projectOpen(p), can = open && !done && S.credits >= p.cost;
    const pct = Math.min(100, S.credits / p.cost * 100);
    h += `<div class="proj ${done ? 'done' : ''} ${open ? '' : 'locked'} ${can ? 'can' : ''}">
      <div class="pj-icon">${open ? p.icon : '🔒'}</div>
      <div class="pj-main"><b>${p.n}</b>${p.loc ? `<small>${LOC[p.loc].n}</small>` : ''}<p>${open ? p.d : `Unlocks with: ${UNLOCKS[p.stage].title}`}</p>
        <div class="pj-fx">⚡ ${p.fx} · +${p.infl} influence</div>
        ${done ? '<div class="pj-done">✔ BUILT</div>' : open ? `<div class="pj-bar"><i style="width:${pct}%"></i></div><button class="btn ${can ? 'primary' : ''}" ${can ? '' : 'disabled'} onclick="doProject('${p.id}')">${can ? 'Build' : 'Need'} · ${fmt(p.cost)} cr</button>` : ''}
      </div></div>`;
  }
  h += '</div>';
  if (has(U.TRADE)) h += `<div class="sub">System powers</div><p class="hint">Select a planet on the Star Map to fund a boom or hire mercenaries there. End wars and plagues from the Empire panel.</p>`;
  openSheet('🌌 Megaprojects', h);
}
function doProject(id) {
  if (!buildProject(id)) return;
  const p = PROJ[id];
  sfx('win');
  closeSheet(true);
  showModal({ icon: p.icon, title: `${p.n} complete!`, cls: 'unlock', html: `<div class="unl-tag">MEGAPROJECT</div><p>${p.d}</p><p><b class="cr">⚡ ${p.fx}</b></p><small>+${p.infl} influence</small>`,
    buttons: [{ label: 'Behold!', cls: 'primary', fn: () => { if (scene === MapScene && !MapScene.travel) { showMapUI(true); if (p.loc) { selectLoc(p.loc); MapScene.focus(p.loc); } else MapScene.zoomAll(); } } }] });
}
function doPower(kind, arg) {
  if (!usePower(kind, arg)) { toast('Not enough credits', 'bad'); return; }
  sfx('win'); toast('Done. The system bends to your will.', 'good');
  if (!$('sheet').classList.contains('hidden')) openFactions(); else if (MapScene.sel) selectLoc(MapScene.sel);
  updateHUD();
}
function openNews() {
  sfx('click');
  openSheet('📰 System News', S.news.map(n => `<div class="news"><i>DAY ${n.day}</i><span>${n.icon}</span><div>${n.html}</div></div>`).join(''));
}
function openMenu() {
  sfx('click');
  openSheet('☰ Menu', `<div class="menu">
    <button class="btn primary big" onclick="closeSheet()">Resume</button>
    <button class="btn big" onclick="openHelp()">How to play</button>
    <button class="btn big danger" onclick="confirmNew()">New game</button></div>`);
}
function confirmNew() {
  closeSheet(true);
  showModal({ icon: '⚠️', title: 'Start a new game?', html: 'Your current progress will be lost.', buttons: [
    { label: 'Yes, start over', cls: 'danger', fn: () => { pendingUnlocks = []; newGame(); save(); shownCredits = 0; setScene(MineScene, 'luna'); updateHUD(); updateTicker(); } },
    { label: 'Cancel', fn: () => {} }] });
}
function openHelp() {
  openSheet('📖 How to play', `<div class="help">
    <h4>⛏ Mine</h4><p>Fly with <b>WASD</b> or arrows, <b>hold the mouse</b> to fire your laser (or Space). Big rocks break into smaller ones and drop glowing ore. On mobile: drag on the left, hold LASER. Glowing veins give double ore.</p>
    <h4>🛰 Dock</h4><p>The station is at the <b>bottom</b> of every field. Fly back down into the docking zone to sell your ore, refuel and repair. Rocks get richer the <b>higher</b> you fly.</p>
    <h4>🤖 Drones</h4><p>Build an outpost in each field and buy drones. They earn credits every second — even while you're offline.</p>
    <h4>⚔ Pirates</h4><p>In dangerous zones pirates attack. <b>Hold the mouse</b> to fire your guns. Destroyed ships drop credits.</p>
    <h4>🔓 Unlock</h4><p>The more you earn, the more of the Solar System opens up: the star map, new planets, pirates, trading, events and finally influence.</p>
    <h4>🗺 Travel</h4><p>Planets orbit the Sun, so distances change every day. Farther places pay more and are more dangerous.</p>
    <h4>👑 Win</h4><p>Invest in stations to earn influence. Reach <b>100 influence</b> to rule the Solar System.</p></div>`);
}

// ---- main.js ----
'use strict';
// ============ MOTOR PRINCIPAL ============
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let scene = null;
const keys = new Set();
const mouse = { x: 0, y: 0, down: false, onUI: false };
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
let touchFire = false;
const joy = { active: false, dx: 0, dy: 0, id: null, ox: 0, oy: 0 };

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
resize();

function setScene(sc, arg) {
  if (scene && scene.exit) scene.exit();
  scene = sc;
  if (sc && sc.enter) sc.enter(arg);
  mouse.down = false; touchFire = false;
}

// ---------- entrada ----------
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  keys.add(e.code);
  audioInit();
  if (e.code === 'Space' && scene === MineScene) e.preventDefault();
  if (e.code === 'Escape') {
    if (!$('sheet').classList.contains('hidden')) closeSheet();
    else if (scene === MineScene && !isBlocking()) MineScene.leave();
  }
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); mouse.down = false; });

canvas.addEventListener('mousedown', e => { audioInit(); mouse.down = true; mouse.onUI = false; mouse.x = e.clientX; mouse.y = e.clientY; if (scene && scene.onDown && !isBlocking()) scene.onDown(e.clientX, e.clientY); });
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.onUI = e.target !== canvas; if (scene && scene.onMove && !isBlocking()) scene.onMove(e.clientX, e.clientY, mouse.down); });
window.addEventListener('mouseup', e => { if (mouse.down && scene && scene.onUp && !isBlocking()) scene.onUp(e.clientX, e.clientY); mouse.down = false; });
canvas.addEventListener('wheel', e => { e.preventDefault(); if (scene && scene.onWheel && !isBlocking()) scene.onWheel(e.deltaY, e.clientX, e.clientY); }, { passive: false });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// táctil en canvas (mapa: arrastrar/pellizcar)
let pinch = null;
canvas.addEventListener('touchstart', e => {
  audioInit();
  if (scene === MineScene) return;
  e.preventDefault();
  if (e.touches.length === 2) {
    const [a, b] = e.touches;
    pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) };
    if (scene.drag) scene.drag.moved = true;
  } else if (e.touches.length === 1 && scene && scene.onDown && !isBlocking()) {
    const t = e.touches[0]; mouse.down = true; scene.onDown(t.clientX, t.clientY);
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (scene === MineScene) return;
  e.preventDefault();
  if (e.touches.length === 2 && pinch && scene.onPinch) {
    const [a, b] = e.touches;
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    scene.onPinch(d / pinch.d, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
    pinch.d = d;
  } else if (e.touches.length === 1 && scene && scene.onMove) {
    const t = e.touches[0]; scene.onMove(t.clientX, t.clientY, true);
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  if (scene === MineScene) return;
  e.preventDefault();
  if (e.touches.length === 0) {
    const t = e.changedTouches[0];
    if (!pinch && scene && scene.onUp && !isBlocking()) scene.onUp(t.clientX, t.clientY);
    pinch = null; mouse.down = false;
  }
}, { passive: false });

// joystick + botón láser (minería en móvil)
function setupTouchControls() {
  const zone = $('joyZone'), knob = $('joyKnob'), base = $('joyBase'), fire = $('fireBtn');
  zone.addEventListener('touchstart', e => {
    e.preventDefault(); audioInit();
    const t = e.changedTouches[0];
    joy.id = t.identifier; joy.active = true; joy.ox = t.clientX; joy.oy = t.clientY;
    base.style.left = (t.clientX - 55) + 'px'; base.style.top = (t.clientY - 55) + 'px'; base.classList.add('on');
    knob.style.transform = 'translate(0,0)';
  }, { passive: false });
  zone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === joy.id) {
      let dx = t.clientX - joy.ox, dy = t.clientY - joy.oy;
      const l = Math.hypot(dx, dy), m = 45;
      if (l > m) { dx *= m / l; dy *= m / l; }
      joy.dx = dx / m; joy.dy = dy / m;
      knob.style.transform = `translate(${dx}px,${dy}px)`;
    }
  }, { passive: false });
  const end = e => { for (const t of e.changedTouches) if (t.identifier === joy.id) { joy.active = false; joy.dx = joy.dy = 0; base.classList.remove('on'); } };
  zone.addEventListener('touchend', end); zone.addEventListener('touchcancel', end);
  fire.addEventListener('touchstart', e => { e.preventDefault(); touchFire = true; fire.classList.add('on'); }, { passive: false });
  const fe = e => { e.preventDefault(); touchFire = false; fire.classList.remove('on'); };
  fire.addEventListener('touchend', fe); fire.addEventListener('touchcancel', fe);
}

// ---------- bucle ----------
let last = performance.now(), hudT = 0, saveT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (scene) {
    if (!isBlocking() || scene === MapScene || scene === TitleScene) scene.update(dt);
    scene.draw(ctx);
  }
  if (S && scene !== TitleScene) { incomeTick(dt); hudTick(dt); }
  hudT += dt;
  if (hudT > 0.3 && S && scene !== TitleScene) { hudT = 0; updateHUD(); if ((saveT += 0.3) > 10) { saveT = 0; save(); } }
  requestAnimationFrame(frame);
}

// ---------- pantalla de título ----------
const TitleScene = {
  t: 0,
  enter() {
    $('title').classList.remove('hidden'); $('hud').classList.add('hidden');
    const sv = hasSave();
    $('cont').classList.toggle('hidden', !sv);
    $('newg').textContent = sv ? 'New game' : '▶ PLAY';
    $('newg').classList.toggle('primary', !sv);
  },
  exit() { $('title').classList.add('hidden'); $('hud').classList.remove('hidden'); },
  update(dt) { this.t += dt; },
  draw(ctx) {
    const t = this.t;
    drawSpaceBg(ctx, W, H, t * 8, t * 3, t);
    const cx = W * 0.5, cy = H * 0.55, z = Math.min(W, H) / 1250;
    drawSun(ctx, cx, cy, 16 * z * 2, t);
    const day = t * 6;
    for (const l of LOCS) {
      if (l.parent || l.follow) continue;
      ctx.strokeStyle = 'rgba(120,160,255,0.1)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(cx, cy, l.r * z * 1.7, l.r * z * 0.75, 0, 0, TAU); ctx.stroke();
      const a = l.a0 + day / l.period * TAU * 3;
      const px = cx + Math.cos(a) * l.r * z * 1.7, py = cy + Math.sin(a) * l.r * z * 0.75;
      if (l.id === 'kuiper') continue;
      drawPlanet(ctx, px, py, Math.max(3, l.size * z * 2.2), l, Math.atan2(cy - py, cx - px), t);
    }
    // nave que cruza
    const sx = ((t * 70) % (W + 400)) - 200, sy = H * 0.32 + Math.sin(t * 0.8) * 20;
    drawPlayerShip(ctx, { hull: 4, engine: 4, weapons: 3, laser: 3 }, sx, sy, 0.05, 1.1, 1, t);
  },
};

function startGame(cont) {
  audioInit();
  if (cont) S = loadSave();
  if (!S) { newGame(); save(); }
  shownCredits = S.credits;
  pendingUnlocks = [];
  if (cont && has(U.MAP)) setScene(MapScene);
  else setScene(MineScene, cont ? (LOC[S.loc].field ? S.loc : 'luna') : 'luna');
  if (!cont) S.loc = 'luna';
  updateHUD(); updateTicker();
  if (cont) {
    const off = offlineGains();
    if (off) setTimeout(() => showModal({ icon: '🤖', title: 'Welcome back!', html: `While you were away (${fmtTime(off.secs)}) your drones earned<br><b class="cr big-num">+${fmt(off.g)} cr</b>`, buttons: [{ label: 'Collect', cls: 'primary', fn: () => {} }] }), 300);
  }
}

// ---------- inicio ----------
function init() {
  setupTouchControls();
  $('bShip').onclick = openShip; $('bProj').onclick = openProjects; $('bFac').onclick = openFactions; $('bNews').onclick = openNews; $('bMenu').onclick = openMenu;
  const snd = $('bSnd');
  snd.textContent = muted ? '🔇' : '🔊';
  snd.onclick = () => { audioInit(); setMuted(!muted); snd.textContent = muted ? '🔇' : '🔊'; };
  $('zIn').onclick = () => MapScene.onWheel(-300, W / 2, H / 2);
  $('zOut').onclick = () => MapScene.onWheel(300, W / 2, H / 2);
  $('zHome').onclick = () => MapScene.focus(S.loc);
  $('zAll').onclick = () => MapScene.zoomAll();
  $('btnWarp').onclick = () => { if (MineScene.space && !MineScene.warp) { MineScene.warp = { t: 0 }; sfx('warp'); } };
  $('btnContinue').onclick = () => MineScene.finishSpace(true);
  $('newg').onclick = () => { if (hasSave()) { showModal({ icon: '⚠️', title: 'Start a new game?', html: 'Your saved game will be overwritten.', buttons: [{ label: 'Start over', cls: 'danger', fn: () => { S = null; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} startGame(false); } }, { label: 'Cancel', fn: () => {} }] }); } else startGame(false); };
  $('cont').onclick = () => startGame(true);
  $('howto').onclick = () => { openHelp(); };
  const params = new URLSearchParams(location.search);
  if (params.has('thumb')) return thumbMode(params.get('thumb'));
  setScene(TitleScene);
  requestAnimationFrame(frame);
}

// ---------- modo miniatura (portada del juego) ----------
function thumbMode(kind) {
  document.body.classList.add('thumb');
  newGame();
  S.lv = { hull: 4, laser: 26, magnet: 10, cargo: 5, refinery: 5, engine: 14, tank: 3, shield: 10, weapons: 18, scanner: 3 };
  $('title').classList.add('hidden'); $('hud').classList.add('hidden');
  const t = 12.3;
  drawSpaceBg(ctx, W, H, 120, 80, t, '#141a44');
  drawPlanet(ctx, W * 0.83, H * 0.26, H * 0.36, LOC.saturno, Math.PI * 0.85, t);
  drawSun(ctx, -W * 0.02, H * 0.95, 70, t);
  MineScene.loc = LOC.saturno;
  const rocks = [];
  const mk = (x, y, tier, ore, rich) => { const r = { x, y, r: [0, 20, 34, 56][tier] * 1.5, tier, ore, rich, rot: rand(0, TAU), hit: 0, shape: makeRockShape(9 + tier * 2, 0.22),
    veins: Array.from({ length: 3 + tier * 2 }, () => { const a = rand(0, TAU), d = rand(0, 0.6); return [Math.cos(a) * d, Math.sin(a) * d, rand(0.07, 0.16)]; }),
    craters: Array.from({ length: tier }, () => { const a = rand(0, TAU), d = rand(0, 0.5); return [Math.cos(a) * d, Math.sin(a) * d, rand(0.1, 0.2)]; }) }; rocks.push(r); return r; };
  const big = mk(W * 0.64, H * 0.6, 3, 'iridium', true);
  mk(W * 0.86, H * 0.78, 2, 'platinum', false); mk(W * 0.5, H * 0.86, 1, 'ice', false); mk(W * 0.92, H * 0.5, 1, 'he3', true); mk(W * 0.24, H * 0.92, 2, 'nickel', false); mk(W * 0.72, H * 0.14, 1, 'exotic', true);
  for (const r of rocks) drawRock(ctx, r, t, 3);
  const sx = W * 0.3, sy = H * 0.62;
  const ang = Math.atan2(big.y - sy, big.x - sx);
  // láser
  const col = laserColor(4), nx = sx + Math.cos(ang) * 90 * Math.min(1, W / 1024), ny = sy + Math.sin(ang) * 90 * Math.min(1, W / 1024);
  const hx = big.x - Math.cos(ang) * big.r * 0.8, hy = big.y - Math.sin(ang) * big.r * 0.8;
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = col; ctx.globalAlpha = 0.4; ctx.lineWidth = 16;
  ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.globalAlpha = 1; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  glow(ctx, hx, hy, 60, col, 1);
  const P = new Particles();
  for (let i = 0; i < 60; i++) { const a = ang + Math.PI + rand(-1.2, 1.2), v = rand(10, 80); P.add(hx + Math.cos(a) * v, hy + Math.sin(a) * v, 0, 0, rand(0.3, 1), Math.random() < 0.5 ? ITEMS.iridium.c : col, rand(1.5, 4)); }
  P.draw(ctx);
  for (let i = 0; i < 7; i++) drawOreChunk(ctx, { x: sx + 60 + i * 38 + rand(-10, 10), y: sy + 70 + Math.sin(i) * 26, ore: pick(['iridium', 'platinum', 'he3']), rot: i }, 0);
  // piratas a lo lejos
  drawEnemyShip(ctx, 'corsair', W * 0.95, H * 0.93, Math.PI * 1.1, 1.3, t);
  drawEnemyShip(ctx, 'raider', W * 0.88, H * 0.97, Math.PI * 1.05, 1.1, t);
  drawPlayerShip(ctx, shipLv(), sx, sy, ang, 3.0 * Math.min(1, W / 1280 * 1.25), 1, t);
  // título
  if (kind !== 'clean') {
    const s = Math.min(W / 1280, H / 720);
    ctx.textAlign = 'left';
    ctx.font = `900 ${Math.round(92 * s)}px Orbitron, 'Arial Black', sans-serif`;
    ctx.shadowColor = '#3de8ff'; ctx.shadowBlur = 30 * s;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('SOLAR', 60 * s, 130 * s);
    ctx.fillStyle = '#3de8ff';
    ctx.fillText('PROSPECTOR', 60 * s, 225 * s);
    ctx.shadowBlur = 0;
    ctx.font = `600 ${Math.round(30 * s)}px Rajdhani, sans-serif`;
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('MINE · TRADE · RULE THE SOLAR SYSTEM', 64 * s, 275 * s);
  }
  document.body.dataset.ready = '1';
}

function fmtTime(s) { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : m ? `${m}m` : `${s}s`; }
document.addEventListener('visibilitychange', () => { if (!S) return; if (document.hidden) save(); else { const off = offlineGains(); if (off && off.g > 0) toast(`🤖 Drones earned +${fmt(off.g)} cr while you were away`, 'good'); } });
window.addEventListener('load', init);
</script>
