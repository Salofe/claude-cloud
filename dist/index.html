// ============ TRAVEL ENCOUNTERS ============
function buildFleet(danger, bias) {
  let budget = 0.5 + danger * 3.5 + S.day / 120 + ship.power * 0.45 + (bias || 0);
  budget *= rand(0.75, 1.2);
  const fleet = [];
  const order = ['carrier', 'frigate', 'corsair', 'raider'];
  while (budget > 0.6 && fleet.length < 5) {
    const opts = order.filter(k => ENEMIES[k].pow <= budget);
    if (!opts.length) break;
    const k = Math.random() < 0.6 ? opts[0] : pick(opts);
    fleet.push(k); budget -= ENEMIES[k].pow;
  }
  if (!fleet.length) fleet.push('raider');
  return fleet;
}
function fleetPower(f) { return f.reduce((a, k) => a + ENEMIES[k].pow, 0) * (1 + S.day / 400); }

function runEncounter(enc, done) {
  if (enc.kind === 'hostile') return pirateEncounter(enc.danger, done);
  if (enc.kind === 'patrol') return patrolEncounter(enc.war, done);
  const opts = ['derelict', 'comet', 'meteor', 'derelict', 'comet'];
  if (has(U.BELT)) opts.push('distress', 'distress');
  if (has(U.TRADE)) opts.push('trader');
  const k = pick(opts);
  const trap = has(U.BELT);
  if (k === 'derelict') {
    showModal({ icon: '🛰️', title: 'Drifting wreck', html: 'Your sensors spot an abandoned freighter. It might have cargo on board…' + (trap ? ' or it might be bait.' : ''),
      buttons: [
        { label: 'Salvage it', cls: 'primary', fn: () => {
          if (trap && Math.random() < 0.22 - ship.avoid * 0.3) { toast('It was a trap!', 'bad'); sfx('alarm'); return pirateEncounter(enc.danger + 0.1, done); }
          const pool = has(U.TRADE) ? ITEM_KEYS : ORES.slice(0, 5);
          const it = pick(pool); const n = Math.min(cargoFree(), randi(3, 6 + S.lv.hull * 3));
          if (n > 0) { addCargo(it, n); toast(`+${n} ${ITEMS[it].n}`, 'good'); sfx('pickup'); } else toast('Cargo hold full — nothing to take', 'bad');
          done();
        } },
        { label: 'Ignore', fn: done },
      ] });
  } else if (k === 'distress') {
    const fac = pick(['tierra', 'marte', 'cinturon', 'exterior']);
    showModal({ icon: '🆘', title: 'Distress signal', html: `A <b style="color:${FACTIONS[fac].c}">${FACTIONS[fac].n}</b> ship's life support is failing. Helping costs 5 fuel.`,
      buttons: [
        { label: 'Help (−5 ⛽)', cls: 'primary', disabled: S.fuel < 5, fn: () => {
          S.fuel -= 5;
          if (Math.random() < 0.18) { toast('Pirate ambush!', 'bad'); sfx('alarm'); return pirateEncounter(enc.danger + 0.15, done); }
          const cr = randi(150, 400) + S.day * 4; repChange(fac, 6); earn(cr);
          toast(`They pay you ${fmt(cr)} cr for the rescue`, 'good'); sfx('cash'); done();
        } },
        { label: 'Ignore', fn: () => { repChange(fac, -1, true); done(); } },
      ] });
  } else if (k === 'trader') {
    const items = Object.keys(S.cargo);
    if (!items.length) return done();
    const it = pick(items); const n = S.cargo[it]; const price = Math.round(ITEMS[it].b * rand(1.15, 1.45));
    showModal({ icon: '🧑‍🚀', title: 'Wandering trader', html: `An independent trader offers to buy your <b>${n} ${ITEMS[it].n}</b> for <b>${price} cr</b> each.`,
      buttons: [
        { label: `Sell (${fmt(n * price)} cr)`, cls: 'primary', fn: () => { addCargo(it, -n); earn(n * price); sfx('cash'); done(); } },
        { label: 'No thanks', fn: done },
      ] });
  } else if (k === 'meteor') {
    const dmg = Math.max(0, randi(4, 12) - ship.shieldMax * 0.2);
    S.hull = Math.max(1, S.hull - dmg);
    showModal({ icon: '☄️', title: 'Micrometeor shower', html: dmg > 0 ? `You fly through a dust cloud. Your hull takes <b>${Math.round(dmg)}</b> damage.` : 'Your shields deflect every impact. Not a scratch!',
      buttons: [{ label: 'Continue', cls: 'primary', fn: done }] });
    sfx('hit');
  } else {
    const n = Math.min(cargoFree(), randi(6, 14));
    showModal({ icon: '☄️', title: 'Comet on your path', html: `A small comet crosses your route. You can harvest <b>${n} Ice</b> for free.`,
      buttons: [
        { label: 'Harvest ice', cls: 'primary', disabled: n <= 0, fn: () => { addCargo('ice', n); toast(`+${n} Ice`, 'good'); sfx('pickup'); done(); } },
        { label: 'Keep flying', fn: done },
      ] });
  }
}

function pirateEncounter(danger, done) {
  const fleet = buildFleet(danger);
  const fp = fleetPower(fleet);
  const bribe = Math.round((120 * fp + S.credits * 0.06) / 10) * 10;
  const friendly = S.rep.piratas >= 35;
  const flee = clamp(ship.flee - fp * 0.02, 0.1, 0.85);
  const threat = fp / Math.max(0.5, ship.power);
  const tl = threat < 0.6 ? ['Low', '#6dffb0', 'You should win easily.'] : threat < 1.2 ? ['Medium', '#ffc857', 'A fair fight.'] : threat < 2 ? ['High', '#ff934a', 'You will probably lose.'] : ['Extreme', '#ff4d6d', 'Run or pay!'];
  sfx('alarm');
  const btns = [];
  if (friendly) btns.push({ label: 'Hail the Syndicate', cls: 'primary', fn: () => { toast('They recognize you and let you pass', 'good'); done(); } });
  btns.push({ label: '⚔ Fight', cls: friendly ? '' : 'danger', fn: () => startBattle(fleet, false, done) });
  btns.push({ label: `Run (${Math.round(flee * 100)}%)`, fn: () => {
    if (Math.random() < flee) { toast('You escaped!', 'good'); sfx('warp'); done(); }
    else { toast('Escape failed', 'bad'); startBattle(fleet, true, done); }
  } });
  btns.push({ label: `Pay them off (${fmt(bribe)} cr)`, disabled: S.credits < bribe, fn: () => { S.credits -= bribe; repChange('piratas', 2, true); toast('The pirates take your money', 'good'); done(); } });
  showModal({ icon: '☠️', title: 'Pirate ambush!', danger: true,
    html: `<div class="fleet">${fleet.map(k => `<span class="chip bad">${ENEMIES[k].n}</span>`).join('')}</div>
    <div class="threat">Threat: <b style="color:${tl[1]}">${tl[0]}</b> — ${tl[2]}</div>
    <small>Battles are automatic. Hull, shields, weapons and drones decide the fight.</small>`,
    buttons: btns });
}

function patrolEncounter(war, done) {
  const fac = war.war.find(f => FACTIONS[f].locs.includes(MapScene.travel ? MapScene.travel.to : S.loc)) || war.war[0];
  const arms = S.cargo.arms || 0;
  sfx('alarm');
  if (!arms || S.rep[fac] >= 25) {
    showModal({ icon: '🛡️', title: 'Military patrol', html: `A <b style="color:${FACTIONS[fac].c}">${FACTIONS[fac].n}</b> patrol scans your ship and waves you through.`, buttons: [{ label: 'Continue', cls: 'primary', fn: done }] });
    return;
  }
  showModal({ icon: '🛡️', title: 'Military patrol', danger: true, html: `The <b style="color:${FACTIONS[fac].c}">${FACTIONS[fac].n}</b> finds <b>${arms} Weapons</b> in your hold and demands you hand them over.`,
    buttons: [
      { label: 'Hand them over', cls: 'primary', fn: () => { addCargo('arms', -arms); toast('Weapons confiscated', 'bad'); done(); } },
      { label: '⚔ Resist', cls: 'danger', fn: () => { repChange(fac, -12); startBattle(['patrol', ...(S.day > 60 ? ['patrol'] : [])], false, done); } },
    ] });
}

// ---- mining.js ----
'use strict';
// ============ ESCENA: MINERÍA ============
const MW = 2100, MH = 2100;
const mineScale = () => 1.35 - (S.lv.hull - 1) * 0.08;
const shipR = () => shipLen(S.lv) * mineScale();
const MineScene = {
  t: 0, loc: null, rocks: [], chunks: [], drones: [], parts: new Particles(), cam: { x: 0, y: 0 }, shake: 0,
  p: null, dayTimer: 0, ambush: null, laserOn: false, laserHit: null, fullWarn: 0, broken: 0, collected: {}, heatWarn: 0, floaters: [],
  enter(locId) {
    this.loc = LOC[locId || this.loc.id];
    if (locId) this.setup();
    showMineUI(true);
  },
  exit() { showMineUI(false); laserSound(false); },
  setup() {
    const f = this.loc.field;
    this.rocks = []; this.chunks = []; this.parts = new Particles(); this.floaters = [];
    this.p = { x: MW / 2, y: MH - 300, vx: 0, vy: -40, a: -Math.PI / 2, shield: ship.shieldMax, shT: 0 };
    this.cam = { x: this.p.x, y: this.p.y };
    this.dayTimer = 0; this.broken = 0; this.collected = {};
    const depl = S.depl[this.loc.id] || 0;
    const rich = S.events.some(e => e.rich === this.loc.id);
    const n = Math.round(f.count * (1 - depl * 0.55) * (rich ? 1.2 : 1));
    for (let i = 0; i < n; i++) {
      let x, y;
      if (i < 3) { const a = -Math.PI / 2 + (i - 1) * 0.7; x = this.p.x + Math.cos(a) * rand(260, 380); y = this.p.y + Math.sin(a) * rand(260, 380); }
      else do { x = rand(150, MW - 150); y = rand(150, MH - 150); } while (Math.hypot(x - this.p.x, y - this.p.y) < 300);
      this.spawnRock(x, y, pick([3, 3, 2, 2, 1]) === 1 ? 2 : 3, null, rich);
    }
    this.drones = [];
    for (let i = 0; i < ship.drones; i++) this.drones.push({ x: this.p.x, y: this.p.y, vx: 0, vy: 0, tgt: null, carry: null, a: i });
    // emboscada
    this.ambush = null;
    const dg = locDanger(this.loc.id) * (1 - ship.avoid);
    if (Math.random() < dg * 0.7) this.ambush = { at: rand(22, 55), warned: false };
    this.heatWarn = 0;
  },
  spawnRock(x, y, tier, ore, rich) {
    const f = this.loc.field;
    if (!ore) {
      const tot = Object.values(f.ores).reduce((a, b) => a + b, 0);
      let r = Math.random() * tot; ore = Object.keys(f.ores)[0];
      for (const k in f.ores) { r -= f.ores[k]; if (r <= 0) { ore = k; break; } }
    }
    const R = [0, 20, 34, 56][tier] * rand(0.9, 1.15);
    const isRich = Math.random() < (rich ? 0.3 : 0.1);
    const nv = 2 + Math.floor(tier * 1.5);
    const rock = {
      x, y, vx: rand(-18, 18), vy: rand(-18, 18), rot: rand(0, TAU), vr: rand(-0.4, 0.4), r: R, tier, ore, rich: isRich,
      hp: R * 0.7 * ITEMS[ore].h, maxhp: R * 0.7 * ITEMS[ore].h, hit: 0, cold: f.cold,
      shape: makeRockShape(9 + tier * 2, 0.22),
      veins: Array.from({ length: nv }, () => { const a = rand(0, TAU), d = rand(0, 0.6); return [Math.cos(a) * d, Math.sin(a) * d, rand(0.07, 0.16)]; }),
      craters: Array.from({ length: tier }, () => { const a = rand(0, TAU), d = rand(0, 0.5); return [Math.cos(a) * d, Math.sin(a) * d, rand(0.1, 0.2)]; }),
    };
    this.rocks.push(rock);
    return rock;
  },
  breakRock(r) {
    this.rocks = this.rocks.filter(x => x !== r);
    this.parts.burst(r.x, r.y, 14 + r.tier * 8, '#c9b8a6', 120 + r.tier * 40, 0.8, 2.5);
    this.parts.burst(r.x, r.y, 6 + r.tier * 3, ITEMS[r.ore].c, 90, 1, 2.5);
    sfx('break'); this.shake = Math.max(this.shake, r.tier * 3);
    if (r.tier > 1) {
      for (let i = 0; i < 2; i++) {
        const c = this.spawnRock(r.x + rand(-10, 10), r.y + rand(-10, 10), r.tier - 1, r.ore);
        const a = rand(0, TAU); c.vx = r.vx + Math.cos(a) * 50; c.vy = r.vy + Math.sin(a) * 50; c.rich = r.rich;
      }
      if (Math.random() < 0.5) this.dropChunk(r.x, r.y, r.ore);
    } else {
      const n = randi(1, 2) + (r.rich ? 2 : 0);
      for (let i = 0; i < n; i++) this.dropChunk(r.x, r.y, r.ore);
    }
    S.hints.laser = 1;
    if (r.tier === 3) { this.broken++; S.depl[this.loc.id] = Math.min(1, (S.depl[this.loc.id] || 0) + 0.02); }
  },
  dropChunk(x, y, ore) {
    const a = rand(0, TAU), v = rand(20, 60);
    this.chunks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, ore, rot: rand(0, TAU), life: 45 });
  },
  collect(c) {
    if (cargoFree() <= 0) return false;
    addCargo(c.ore, 1); S.stats.mined++;
    this.collected[c.ore] = (this.collected[c.ore] || 0) + 1;
    this.floaters.push({ x: this.p.x, y: this.p.y - 20, txt: '+1 ' + ITEMS[c.ore].n, col: ITEMS[c.ore].c, life: 1.1 });
    sfx('pickup');
    return true;
  },
  update(dt) {
    this.t += dt;
    const p = this.p;
    // --- entrada ---
    let ax = 0, ay = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp')) ay -= 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) ay += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) ax -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) ax += 1;
    if (joy.active) { ax = joy.dx; ay = joy.dy; }
    const al = Math.hypot(ax, ay);
    if (al > 1) { ax /= al; ay /= al; }
    const acc = 520 * ship.thrust / Math.pow(ship.mass, 0.35);
    p.vx += ax * acc * dt; p.vy += ay * acc * dt;
    const drag = Math.pow(0.4, dt);
    p.vx *= drag; p.vy *= drag;
    const maxV = 340 * ship.thrust;
    const v = Math.hypot(p.vx, p.vy);
    if (v > maxV) { p.vx *= maxV / v; p.vy *= maxV / v; }
    p.x = clamp(p.x + p.vx * dt, 40, MW - 40); p.y = clamp(p.y + p.vy * dt, 40, MH - 40);
    this.thrusting = Math.hypot(ax, ay);
    // --- apuntar / láser ---
    let aim = null;
    const wm = { x: mouse.x - W / 2 + this.cam.x, y: mouse.y - H / 2 + this.cam.y };
    let firing = false;
    if (touchFire) {
      let best = null, bd = ship.laserRange + 40;
      for (const r of this.rocks) { const d = Math.hypot(r.x - p.x, r.y - p.y) - r.r; if (d < bd) { bd = d; best = r; } }
      if (best) { aim = Math.atan2(best.y - p.y, best.x - p.x); firing = true; }
    } else if (mouse.down && !mouse.onUI) { aim = Math.atan2(wm.y - p.y, wm.x - p.x); firing = true; }
    if (keys.has('Space')) { firing = true; if (aim == null) aim = p.a; }
    const targetA = aim != null ? aim : (al > 0.1 ? Math.atan2(ay, ax) : p.a);
    let da = ((targetA - p.a + Math.PI) % TAU + TAU) % TAU - Math.PI;
    p.a += da * Math.min(1, dt * 10);
    this.laserHit = null;
    if (firing) {
      const dir = aim != null ? aim : p.a;
      const dx = Math.cos(dir), dy = Math.sin(dir);
      let best = null, bt = ship.laserRange;
      for (const r of this.rocks) {
        const ox = r.x - p.x, oy = r.y - p.y;
        const proj = ox * dx + oy * dy;
        if (proj < 0) continue;
        const perp2 = ox * ox + oy * oy - proj * proj;
        const rr = r.r * 0.9;
        if (perp2 > rr * rr) continue;
        const tHit = proj - Math.sqrt(rr * rr - perp2);
        if (tHit < bt) { bt = tHit; best = r; }
      }
      const hx = p.x + dx * bt, hy = p.y + dy * bt;
      this.laserHit = { x: hx, y: hy, dir, rock: best };
      if (best) {
        best.hp -= ship.laserDps * dt; best.hit = 0.05;
        if (Math.random() < dt * 30) this.parts.add(hx, hy, -dx * 80 + rand(-60, 60), -dy * 80 + rand(-60, 60), 0.4, Math.random() < 0.5 ? ITEMS[best.ore].c : laserColor(S.lv.laser), 2, true);
        if (best.hp <= 0) this.breakRock(best);
      }
    }
    if (firing !== this.laserOn) { this.laserOn = firing; laserSound(firing, S.lv.laser); }
    // --- rocas ---
    for (const r of this.rocks) {
      r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vr * dt; r.hit = Math.max(0, r.hit - dt);
      if (r.x < r.r || r.x > MW - r.r) r.vx *= -1;
      if (r.y < r.r || r.y > MH - r.r) r.vy *= -1;
      r.x = clamp(r.x, r.r, MW - r.r); r.y = clamp(r.y, r.r, MH - r.r);
      // colisión con nave
      const dx = p.x - r.x, dy = p.y - r.y, d = Math.hypot(dx, dy), md = r.r + shipR() * 0.4;
      if (d < md && d > 0) {
        const nx = dx / d, ny = dy / d;
        p.x = r.x + nx * md; p.y = r.y + ny * md;
        const rel = (p.vx - r.vx) * nx + (p.vy - r.vy) * ny;
        if (rel < 0) {
          p.vx -= 1.6 * rel * nx; p.vy -= 1.6 * rel * ny;
          r.vx += rel * nx * 0.2 / r.tier; r.vy += rel * ny * 0.2 / r.tier;
          if (-rel > 140) { this.damage((-rel - 120) * 0.05); sfx('bump'); this.shake = 6; }
        }
      }
    }
    // --- fragmentos ---
    const cfree = cargoFree();
    for (const c of this.chunks) {
      c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= Math.pow(0.5, dt); c.vy *= Math.pow(0.5, dt); c.life -= dt;
      const dx = p.x - c.x, dy = p.y - c.y, d = Math.hypot(dx, dy);
      if (d < ship.magnet && cfree > 0) { const f = 600 * (1 - d / ship.magnet) + 120; c.vx += dx / d * f * dt; c.vy += dy / d * f * dt; }
      if (d < 22) { if (this.collect(c)) c.dead = true; else if (this.fullWarn <= 0) { this.fullWarn = 3; sfx('full'); } }
      if (c.life <= 0) c.dead = true;
    }
    this.fullWarn -= dt;
    this.chunks = this.chunks.filter(c => !c.dead);
    // --- drones recolectores ---
    for (const dr of this.drones) {
      if (dr.tgt && (dr.tgt.dead || !this.chunks.includes(dr.tgt))) dr.tgt = null;
      if (!dr.tgt && !dr.carry && cargoFree() > 0) {
        let best = null, bd = 900;
        for (const c of this.chunks) { if (this.drones.some(o => o !== dr && o.tgt === c)) continue; const d = Math.hypot(c.x - dr.x, c.y - dr.y); if (d < bd) { bd = d; best = c; } }
        dr.tgt = best;
      }
      let tx, ty;
      if (dr.carry) { tx = p.x; ty = p.y; }
      else if (dr.tgt) { tx = dr.tgt.x; ty = dr.tgt.y; }
      else { const a = this.t * 1.5 + dr.a * TAU / Math.max(1, this.drones.length); tx = p.x + Math.cos(a) * 45; ty = p.y + Math.sin(a) * 45; }
      const dx = tx - dr.x, dy = ty - dr.y, d = Math.hypot(dx, dy) || 1;
      const sp = 380;
      dr.vx = lerp(dr.vx, dx / d * Math.min(sp, d * 6), dt * 6); dr.vy = lerp(dr.vy, dy / d * Math.min(sp, d * 6), dt * 6);
      dr.x += dr.vx * dt; dr.y += dr.vy * dt;
      if (dr.tgt && d < 12) { dr.carry = dr.tgt; dr.tgt.dead = true; this.chunks = this.chunks.filter(c => c !== dr.carry); dr.tgt = null; }
      if (dr.carry && d < 20) { if (!this.collect(dr.carry)) this.chunks.push(Object.assign(dr.carry, { dead: false, x: dr.x, y: dr.y, vx: 0, vy: 0 })); dr.carry = null; }
    }
    // --- escudo + peligros ---
    p.shT -= dt;
    if (p.shT <= 0) p.shield = Math.min(ship.shieldMax, p.shield + (4 + S.lv.shield * 2) * dt);
    if (this.loc.field.hazard === 'heat') {
      this.damage(1.1 * dt, true);
      this.heatWarn += dt;
    }
    // --- emboscada ---
    if (this.ambush) {
      this.ambush.at -= dt;
      if (!this.ambush.warned && this.ambush.at < 4) { this.ambush.warned = true; toast('⚠ Hostile ships incoming!', 'bad'); sfx('alarm'); }
      if (this.ambush.at <= 0) {
        this.ambush = null; laserSound(false); this.laserOn = false; mouse.down = false; touchFire = false;
        pirateEncounter(locDanger(this.loc.id), () => {});
        return;
      }
    }
    // --- tiempo ---
    this.dayTimer += dt;
    if (this.dayTimer > 40) { this.dayTimer = 0; tickDay(); updateHUD(); }
    // respawn lento de rocas si quedan pocas
    if (this.rocks.length < 4 && Math.random() < dt * 0.1) {
      const a = rand(0, TAU); this.spawnRock(clamp(p.x + Math.cos(a) * 900, 150, MW - 150), clamp(p.y + Math.sin(a) * 900, 150, MH - 150), 3);
    }
    this.parts.update(dt);
    for (const f of this.floaters) { f.y -= 30 * dt; f.life -= dt; }
    this.floaters = this.floaters.filter(f => f.life > 0);
    // cámara
    const k = 1 - Math.pow(0.001, dt);
    this.cam.x = lerp(this.cam.x, p.x + p.vx * 0.3, k); this.cam.y = lerp(this.cam.y, p.y + p.vy * 0.3, k);
    this.shake = Math.max(0, this.shake - dt * 20);
    // estela
    if (this.thrusting > 0.1 && Math.random() < dt * 40) {
      const bx = p.x - Math.cos(p.a) * shipR() * 0.75, by = p.y - Math.sin(p.a) * shipR() * 0.75;
      this.parts.add(bx, by, -Math.cos(p.a) * 60 + rand(-15, 15), -Math.sin(p.a) * 60 + rand(-15, 15), 0.45, '#ff9b4a', 2.5);
    }
    this.coach();
    updateMineHUD();
  },
  coach() {
    const h = S.hints;
    if (!h.move) { this.moved = (this.moved || 0) + Math.hypot(this.p.vx, this.p.vy) * 0.016; if (this.moved > 120) h.move = 1; }
    let msg = '';
    if (!h.move) msg = isTouch ? 'Drag anywhere on the left side to fly' : 'Fly with <b>WASD</b> or the <b>arrow keys</b>';
    else if (!h.laser) msg = isTouch ? 'Hold <b>LASER</b> — it aims at the nearest rock' : 'Hold the <b>mouse button</b> to fire your mining laser at a rock';
    else if (S.stats.mined < 4) msg = 'Fly close to the glowing crystals to scoop them up';
    if (cargoFree() <= 0) msg = '';
    coach(msg);
  },
  damage(n, heat) {
    const p = this.p;
    if (p.shield > 0) { const a = Math.min(p.shield, n); p.shield -= a; n -= a; if (!heat) p.shT = 2; }
    if (n > 0) {
      S.hull -= n;
      if (S.hull <= 0) {
        S.hull = 0; laserSound(false); this.laserOn = false;
        towShip('Your hull collapsed in the mining field.');
      }
    }
  },
  draw(ctx) {
    const t = this.t;
    const sx = (Math.random() - 0.5) * this.shake, sy = (Math.random() - 0.5) * this.shake;
    const cx = this.cam.x - W / 2 + sx, cy = this.cam.y - H / 2 + sy;
    drawSpaceBg(ctx, W, H, cx, cy, t, this.loc.cold ? '#0c1838' : this.loc.field.hazard === 'heat' ? '#2a1408' : null);
    // cuerpo celeste de fondo
    const bgLoc = this.loc.id === 'kuiper' ? LOC.pluton : this.loc.parent ? LOC[this.loc.parent] : this.loc.follow ? LOC[this.loc.follow] : this.loc;
    const bx = W * 0.78 - cx * 0.04, by = H * 0.3 - cy * 0.04;
    ctx.globalAlpha = 0.8; drawPlanet(ctx, bx, by, Math.min(W, H) * (bgLoc.size > 12 ? 0.26 : 0.15), bgLoc, Math.atan2(-by, -bx - W), t); ctx.globalAlpha = 1;
    if (this.loc.field.hazard === 'heat') drawSun(ctx, -cx * 0.02 - 40, H * 0.5 - cy * 0.02, 120, t);
    ctx.save();
    ctx.translate(-cx, -cy);
    // bordes del campo
    ctx.strokeStyle = 'rgba(61,232,255,0.15)'; ctx.setLineDash([10, 12]); ctx.lineWidth = 2;
    ctx.strokeRect(20, 20, MW - 40, MH - 40); ctx.setLineDash([]);
    // imán
    const p = this.p;
    if (cargoFree() > 0) {
      ctx.strokeStyle = 'rgba(61,232,255,0.07)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, ship.magnet, 0, TAU); ctx.stroke();
    }
    for (const r of this.rocks) if (r.x > cx - 100 && r.x < cx + W + 100 && r.y > cy - 100 && r.y < cy + H + 100) drawRock(ctx, r, t, S.lv.scanner);
    for (const c of this.chunks) drawOreChunk(ctx, c, t);
    // láser
    if (this.laserHit) {
      const L = this.laserHit, col = laserColor(S.lv.laser);
      const nx = p.x + Math.cos(L.dir) * shipR() * 0.9, ny = p.y + Math.sin(L.dir) * shipR() * 0.9;
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = col; ctx.globalAlpha = 0.35; ctx.lineWidth = 7 + S.lv.laser + Math.sin(t * 50) * 2;
      ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(L.x, L.y); ctx.stroke();
      ctx.globalAlpha = 1; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(L.x, L.y); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      glow(ctx, L.x, L.y, L.rock ? 26 : 10, col, 0.9);
    }
    // drones
    for (const dr of this.drones) {
      glow(ctx, dr.x, dr.y, 10, '#3de8ff88', 0.8);
      ctx.fillStyle = '#d4dcea'; ctx.beginPath(); ctx.arc(dr.x, dr.y, 4, 0, TAU); ctx.fill();
      ctx.fillStyle = '#3de8ff'; ctx.beginPath(); ctx.arc(dr.x, dr.y, 1.8, 0, TAU); ctx.fill();
      if (dr.carry) { ctx.fillStyle = ITEMS[dr.carry.ore].c; ctx.fillRect(dr.x - 2, dr.y + 4, 4, 4); }
    }
    this.parts.draw(ctx);
    drawPlayerShip(ctx, S.lv, p.x, p.y, p.a, mineScale(), this.thrusting, t);
    if (ship.shieldMax > 0 && p.shT > 1.5) {
      ctx.strokeStyle = `rgba(61,232,255,${(p.shT - 1.5) * 1.5})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, shipR() + 8, 0, TAU); ctx.stroke();
    }
    // textos flotantes
    ctx.font = '600 13px Rajdhani, sans-serif'; ctx.textAlign = 'center';
    for (const f of this.floaters) { ctx.globalAlpha = Math.min(1, f.life * 2); ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y); }
    ctx.globalAlpha = 1;
    ctx.restore();
    // miras
    if (!isTouch && !mouse.onUI) {
      ctx.strokeStyle = 'rgba(61,232,255,0.8)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 9, 0, TAU);
      ctx.moveTo(mouse.x - 14, mouse.y); ctx.lineTo(mouse.x - 5, mouse.y); ctx.moveTo(mouse.x + 5, mouse.y); ctx.lineTo(mouse.x + 14, mouse.y);
      ctx.moveTo(mouse.x, mouse.y - 14); ctx.lineTo(mouse.x, mouse.y - 5); ctx.moveTo(mouse.x, mouse.y + 5); ctx.lineTo(mouse.x, mouse.y + 14);
      ctx.stroke();
    }
    // minimapa
    const mm = 110, mx = W - mm - 14, my = H - mm - (isTouch ? 205 : 40);
    ctx.fillStyle = 'rgba(8,14,34,0.75)'; ctx.strokeStyle = 'rgba(61,232,255,0.35)'; ctx.lineWidth = 1;
    ctx.fillRect(mx, my, mm, mm); ctx.strokeRect(mx, my, mm, mm);
    for (const r of this.rocks) { ctx.fillStyle = r.rich && S.lv.scanner >= 2 ? ITEMS[r.ore].c : 'rgba(200,190,170,0.7)'; ctx.fillRect(mx + r.x / MW * mm - 1, my + r.y / MH * mm - 1, r.tier + 0.5, r.tier + 0.5); }
    ctx.fillStyle = '#3de8ff'; ctx.fillRect(mx + p.x / MW * mm - 2, my + p.y / MH * mm - 2, 4, 4);
    if (this.loc.field.hazard === 'heat' && ship.shieldMax <= 0) {
      ctx.fillStyle = `rgba(255,120,40,${0.08 + 0.05 * Math.sin(t * 4)})`; ctx.fillRect(0, 0, W, H);
    }
  },
  leave(toMap) {
    laserSound(false);
    const got = Object.entries(this.collected);
    if (got.length) addNews('⛏️', `Mined at ${this.loc.field.n}: ${got.map(([k, n]) => `${n} ${ITEMS[k].n}`).join(', ')}`, '#ffd24a');
    this.collected = {};
    save();
    if (!toMap && LOC[S.loc].station) openDock();
    else setScene(MapScene);
  },
};

function towShip(reason) {
  const lost = {};
  for (const k in S.cargo) { const n = Math.ceil(S.cargo[k] * 0.6); lost[k] = n; addCargo(k, -n); }
  const markets = NODES.filter(l => l.station && !l.black && locOpen(l.id));
  let best = markets[0], bd = 1e9;
  for (const l of markets) { const d = locDist(S.loc, l.id, S.day); if (d < bd) { bd = d; best = l; } }
  const fee = Math.round(Math.min(S.credits, 200 + S.credits * 0.1));
  S.credits -= fee; S.loc = best.id; S.hull = Math.max(S.hull, Math.round(ship.hpMax * 0.25));
  S.fuel = Math.max(S.fuel, 10);
  for (let i = 0; i < 3; i++) tickDay();
  sfx('lose');
  showModal({ icon: '🚨', title: 'Towed to safety', danger: true, html: `${reason}<br>A tug brings you to <b>${best.station}</b>. You lost part of your cargo and paid a <b>${fmt(fee)} cr</b> rescue fee.`,
    buttons: [{ label: 'Continue', cls: 'primary', fn: () => { save(); openDock(); } }] });
}

// ---- battle.js ----
'use strict';
// ============ ESCENA: COMBATE AUTOMÁTICO ============
const BattleScene = {
  t: 0, parts: new Particles(), shots: [], ended: false, speed: 1, prev: null, done: null, log: [],
  start(fleet, enemyFirst, done) {
    this.prev = scene; this.done = done; this.t = 0; this.ended = false; this.speed = 1; this.shots = []; this.parts = new Particles(); this.log = [];
    this.fleetKeys = fleet;
    this.pl = { hp: S.hull, max: ship.hpMax, sp: ship.shieldMax, spMax: ship.shieldMax, dps: ship.weaponDps, cd: enemyFirst ? 1.2 : 0.4, shT: 0, x: 0, y: 0, hitT: 0, dead: false,
      guns: Math.max(1, S.lv.weapons), evade: 0.04 + S.lv.engine * 0.03, retreatT: 0 };
    this.en = fleet.map((k, i) => {
      const e = ENEMIES[k]; const sc = 1 + S.day / 400;
      return { k, n: e.n, hp: e.hp * sc, max: e.hp * sc, sp: e.sp * sc, spMax: e.sp * sc, dps: e.dps * sc, cd: enemyFirst ? rand(0.1, 0.5) : rand(0.6, 1.4), shT: 0, idx: i, hitT: 0, dead: false, bob: rand(0, TAU), evade: 0.06 };
    });
    this.drones = Array.from({ length: ship.drones }, (_, i) => ({ a: i * TAU / Math.max(1, ship.drones), cd: rand(0.3, 1) }));
    setScene(this);
  },
  enter() { showBattleUI(true); sfx('alarm'); },
  exit() { showBattleUI(false); },
  layout() {
    const pl = this.pl;
    pl.x = W * (W < 700 ? 0.22 : 0.26); pl.y = H * 0.52;
    const alive = this.en;
    alive.forEach((e, i) => {
      const n = alive.length;
      e.x = W * (W < 700 ? 0.75 : 0.72) + (i % 2) * 50 * (W < 700 ? 0.6 : 1);
      e.y = H * 0.52 + (i - (n - 1) / 2) * Math.min(95, H * 0.6 / n);
    });
  },
  fire(from, to, dmg, col, isPl) {
    const sx = from.x + (isPl ? 30 : -25), sy = from.y + rand(-6, 6);
    this.shots.push({ x: sx, y: sy, sx, sy, tx: to.x + rand(-8, 8), ty: to.y + rand(-8, 8), t: 0, dur: 0.35, dmg, col, to, isPl });
    sfx(isPl ? 'shoot' : 'eshoot');
  },
  applyHit(target, dmg, isPl) {
    if (target.dead) return;
    if (Math.random() < target.evade) { this.floatTxt(target.x, target.y - 30, 'MISS', '#9fb6ff'); return; }
    target.shT = 2.5;
    if (target.sp > 0) {
      const a = Math.min(target.sp, dmg); target.sp -= a; dmg -= a;
      this.parts.burst(target.x, target.y, 6, '#3de8ff', 80, 0.4, 2);
      target.shieldFlash = 0.3; sfx('shield');
    }
    if (dmg > 0) {
      target.hp -= dmg; target.hitT = 0.12;
      this.parts.burst(target.x + rand(-10, 10), target.y + rand(-8, 8), 8, isPl ? '#ffb347' : '#ff934a', 110, 0.5, 2.5);
      sfx('hit');
    }
    this.floatTxt(target.x, target.y - 30, Math.round(dmg > 0 ? dmg : 0) || 'shield', dmg > 0 ? '#ffffff' : '#3de8ff');
    if (target.hp <= 0) {
      target.dead = true; target.hp = 0;
      this.parts.burst(target.x, target.y, 50, '#ffb347', 260, 1.1, 4);
      this.parts.burst(target.x, target.y, 25, '#ffffff', 180, 0.6, 3);
      sfx('boom'); this.shake = 10;
    }
  },
  floats: [],
  floatTxt(x, y, txt, col) { this.floats.push({ x: x + rand(-15, 15), y, txt, col, life: 0.9 }); },
  update(dt) {
    this.layout();
    this.t += dt;
    const sdt = dt * this.speed;
    this.parts.update(sdt);
    for (const f of this.floats) { f.y -= 40 * sdt; f.life -= sdt; }
    this.floats = this.floats.filter(f => f.life > 0);
    this.shake = Math.max(0, (this.shake || 0) - dt * 25);
    for (const s of this.shots) {
      s.t += sdt;
      const k = Math.min(1, s.t / s.dur);
      s.x = lerp(s.sx, s.tx, k); s.y = lerp(s.sy, s.ty, k);
      if (k >= 1 && !s.done) { s.done = true; this.applyHit(s.to, s.dmg, !s.isPl); }
    }
    this.shots = this.shots.filter(s => !s.done);
    if (this.ended) return;
    const pl = this.pl, alive = this.en.filter(e => !e.dead);
    if (!alive.length) return this.finish(true);
    if (pl.hp <= 0) { pl.dead = true; return this.finish(false); }
    // escudos
    for (const u of [pl, ...alive]) {
      u.shT -= sdt; u.hitT -= sdt; if (u.shieldFlash) u.shieldFlash -= sdt;
      if (u.shT <= 0 && u.spMax > 0) u.sp = Math.min(u.spMax, u.sp + u.spMax * 0.12 * sdt);
    }
    // jugador dispara al más débil
    pl.cd -= sdt;
    if (pl.cd <= 0) {
      const tgt = alive.reduce((a, b) => (b.hp + b.sp < a.hp + a.sp ? b : a));
      const period = 0.7;
      const per = UPG.weapons.dps[S.lv.weapons - 1] * period / pl.guns;
      for (let g = 0; g < pl.guns; g++) setTimeout(() => { if (!this.ended && !tgt.dead) this.fire(pl, tgt, per * rand(0.85, 1.15), '#3de8ff', true); }, g * 90 / this.speed);
      pl.cd = period;
    }
    // drones
    for (const d of this.drones) {
      d.a += sdt * 2; d.cd -= sdt;
      d.x = pl.x + Math.cos(d.a) * 48; d.y = pl.y + Math.sin(d.a) * 30;
      if (d.cd <= 0) { d.cd = 0.8; const tgt = pick(alive); this.fire(d, tgt, 2.5 * 0.8, '#6dffb0', true); }
    }
    // enemigos
    for (const e of alive) {
      e.cd -= sdt;
      if (e.cd <= 0) { const period = rand(0.8, 1.2); this.fire(e, pl, e.dps * period * rand(0.85, 1.15), '#ff4d6d', false); e.cd = period; }
    }
  },
  retreat() {
    if (this.ended) return;
    const chance = clamp(ship.flee * 0.8, 0.1, 0.8);
    if (Math.random() < chance) { toast('Retreat successful!', 'good'); sfx('warp'); this.finish(null); }
    else { toast('Retreat failed', 'bad'); this.pl.cd += 1; document.getElementById('btnRetreat').disabled = true; setTimeout(() => { const b = document.getElementById('btnRetreat'); if (b) b.disabled = false; }, 2500); }
  },
  finish(win) {
    this.ended = true;
    S.hull = Math.max(0, Math.round(this.pl.hp));
    setTimeout(() => this.result(win), win === null ? 300 : 1200);
  },
  result(win) {
    const done = this.done;
    const back = () => { setScene(this.prev || MapScene); };
    if (win === true) {
      S.stats.won++;
      const loot = Math.round(this.fleetKeys.reduce((a, k) => a + ENEMIES[k].loot, 0) * rand(0.8, 1.2) * (1 + S.day / 300));
      const military = this.fleetKeys.includes('patrol');
      let salv = '';
      if (!military) {
        const it = pick(['arms', 'tech', 'meds', 'luxury', 'platinum', 'he3']);
        const n = Math.min(cargoFree(), randi(1, 2 + this.fleetKeys.length * 2));
        if (n > 0) { addCargo(it, n); salv = `<br>You salvage <b>${n} ${ITEMS[it].n}</b> from the wreckage.`; }
        repChange('piratas', -3, true);
        const near = LOC[S.loc].faction && LOC[S.loc].faction !== 'piratas' ? LOC[S.loc].faction : 'cinturon';
        repChange(near, 1 + this.fleetKeys.length, true);
        for (const c of S.active) if (c.type === 'bounty') { c.progress++; }
        for (const c of [...S.active]) if (c.type === 'bounty' && c.progress >= c.kills) completeContract(c);
      }
      sfx('win');
      addNews('🏆', `Defeated ${this.fleetKeys.length} ${military ? 'military' : 'pirate'} ship${this.fleetKeys.length > 1 ? 's' : ''}. Loot: ${fmt(loot)} cr`, '#6dffb0');
      earn(loot);
      showModal({ icon: '🏆', title: 'Victory!', html: `You destroyed the enemy fleet.<br>Loot: <b class="cr">${fmt(loot)} cr</b>${salv}<br>Hull: ${S.hull}/${ship.hpMax}`,
        buttons: [{ label: 'Continue', cls: 'primary', fn: () => { back(); updateHUD(); done && done(); } }] });
    } else if (win === null) {
      back(); done && done();
    } else {
      S.stats.lost++;
      if (MapScene.travel) { MapScene.travel = null; document.getElementById('travelBanner').classList.add('hidden'); }
      setScene(MapScene);
      towShip('Your ship was disabled in battle.');
    }
    save();
  },
  draw(ctx) {
    this.layout();
    const t = this.t;
    ctx.save();
    if (this.shake) ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
    drawSpaceBg(ctx, W, H, t * 40, 0, t, '#1c0b1e');
    const bl = LOC[(this.prev === MineScene && MineScene.loc) ? MineScene.loc.id : S.loc];
    const bgl = bl.parent ? LOC[bl.parent] : bl.follow ? LOC[bl.follow] : bl;
    if (bgl.id !== 'kuiper') { const pr = Math.min(W, H) * 0.55; drawPlanet(ctx, W * 0.5, H + pr * 0.55, pr, bgl, -Math.PI / 2, t); }
    // líneas de velocidad
    ctx.strokeStyle = 'rgba(160,190,255,0.15)'; ctx.lineWidth = 1;
    for (let i = 0; i < 30; i++) {
      const y = (i * 97.3) % H, x = W - ((t * 400 + i * 173) % (W + 200));
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 60, y); ctx.stroke();
    }
    const pl = this.pl;
    const sc = W < 700 ? 1 : 1.7;
    if (!pl.dead) {
      drawPlayerShip(ctx, S.lv, pl.x, pl.y + Math.sin(t * 2) * 4, 0, sc * (1.4 - S.lv.hull * 0.08), 0.7, t);
      if (pl.shieldFlash > 0) { ctx.strokeStyle = `rgba(61,232,255,${pl.shieldFlash * 3})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(pl.x, pl.y, 50 * sc, 0, TAU); ctx.stroke(); }
      this.bars(ctx, pl.x, pl.y - 62 * sc, pl);
    }
    for (const d of this.drones) if (d.x) { glow(ctx, d.x, d.y, 9, '#6dffb088', 0.8); ctx.fillStyle = '#d4dcea'; ctx.beginPath(); ctx.arc(d.x, d.y, 3.5, 0, TAU); ctx.fill(); }
    for (const e of this.en) {
      if (e.dead) continue;
      const y = e.y + Math.sin(t * 2 + e.bob) * 5;
      drawEnemyShip(ctx, e.k, e.x, y, Math.PI, sc, t);
      if (e.hitT > 0) glow(ctx, e.x, y, 30, '#ffffff', 0.4);
      if (e.shieldFlash > 0) { ctx.strokeStyle = `rgba(255,120,150,${e.shieldFlash * 3})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, y, 30 * sc * ENEMIES[e.k].size, 0, TAU); ctx.stroke(); }
      this.bars(ctx, e.x, y - 34 * sc * ENEMIES[e.k].size, e);
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const s of this.shots) {
      const a = Math.atan2(s.ty - s.sy, s.tx - s.sx);
      ctx.strokeStyle = s.col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - Math.cos(a) * 16, s.y - Math.sin(a) * 16); ctx.stroke();
      glow(ctx, s.x, s.y, 8, s.col, 0.8);
    }
    ctx.globalCompositeOperation = 'source-over';
    this.parts.draw(ctx);
    ctx.font = '700 15px Rajdhani, sans-serif'; ctx.textAlign = 'center';
    for (const f of this.floats) { ctx.globalAlpha = Math.min(1, f.life * 2); ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y); }
    ctx.globalAlpha = 1;
    ctx.restore();
  },
  bars(ctx, x, y, u) {
    const w = 60;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - w / 2 - 1, y - 1, w + 2, 10);
    ctx.fillStyle = u === this.pl ? '#6dffb0' : '#ff4d6d'; ctx.fillRect(x - w / 2, y, w * clamp(u.hp / u.max, 0, 1), 4);
    if (u.spMax > 0) { ctx.fillStyle = '#3de8ff'; ctx.fillRect(x - w / 2, y + 5, w * clamp(u.sp / u.spMax, 0, 1), 3); }
    if (u.n) { ctx.font = '600 11px Rajdhani, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,200,210,0.85)'; ctx.fillText(u.n, x, y - 4); }
  },
};
function startBattle(fleet, enemyFirst, done) { BattleScene.start(fleet, enemyFirst, done); }

// ---- ui.js ----
'use strict';
// ============ INTERFACE (DOM) ============
const $ = id => document.getElementById(id);
const isBlocking = () => !$('modal').classList.contains('hidden') || !$('sheet').classList.contains('hidden');
let dockTab = 'upg', lastDock = null, shownCredits = 0;

function toast(msg, cls) {
  const el = document.createElement('div');
  el.className = 'toast ' + (cls || '');
  el.innerHTML = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.classList.add('out'), 2600);
  setTimeout(() => el.remove(), 3100);
}
function coach(msg) {
  const el = $('coach');
  if (!msg) { el.classList.remove('show'); return; }
  if (el._m !== msg) { el.innerHTML = msg; el._m = msg; }
  el.classList.add('show');
}

function showModal(o) {
  const m = $('modal');
  m.innerHTML = `<div class="mbox ${o.danger ? 'danger' : ''} ${o.cls || ''}">
    ${o.icon ? `<div class="micon">${o.icon}</div>` : ''}
    <h2>${o.title}</h2><div class="mbody">${o.html || ''}</div>
    <div class="mbtns"></div></div>`;
  const bx = m.querySelector('.mbtns');
  o.buttons.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls || '');
    el.innerHTML = b.label; el.disabled = !!b.disabled;
    el.onclick = () => { sfx('click'); closeModal(); b.fn && b.fn(); updateHUD(); };
    bx.appendChild(el);
  });
  m.classList.remove('hidden');
  if (o.after) o.after(m);
}
function closeModal() { $('modal').classList.add('hidden'); }

function showEventBanner(ev) {
  const b = $('eventBanner');
  b.innerHTML = `<span class="eicon">${ev.icon}</span><div><small>SYSTEM NEWS · DAY ${S.day}</small><b>${ev.title}</b><p>${ev.text}</p></div>`;
  b.classList.add('show');
  sfx('event');
  clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('show'), 6500);
}
function updateTicker() {
  const el = $('tickerIn'); if (!el || !S) return;
  el.innerHTML = S.news.slice(0, 8).map(n => `<span><i>DAY ${n.day}</i> ${n.icon} ${n.html.replace(/<[^>]+>/g, '')}</span>`).join('<span class="sep">◆</span>');
}

// ---------- HUD ----------
function hudTick(dt) {
  if (!S) return;
  const d = S.credits - shownCredits;
  if (Math.abs(d) < 1) shownCredits = S.credits;
  else shownCredits += d * Math.min(1, dt * 6) + Math.sign(d) * Math.min(Math.abs(d), dt * 40);
  $('hCr').textContent = fmt(shownCredits);
  $('hCr').parentElement.classList.toggle('up', d > 1);
}
function updateHUD() {
  if (!S) return;
  for (const el of document.querySelectorAll('[data-need]')) el.classList.toggle('locked', S.unlock < +el.dataset.need);
  $('hDay').textContent = S.day;
  $('hFuel').style.width = (S.fuel / ship.fuelMax * 100) + '%';
  $('hFuelT').textContent = `${Math.floor(S.fuel)}/${ship.fuelMax}`;
  $('hHull').style.width = (S.hull / ship.hpMax * 100) + '%';
  $('hHullT').textContent = `${Math.ceil(S.hull)}/${ship.hpMax}`;
  $('hCargo').style.width = (cargoUsed() / ship.cargoMax * 100) + '%';
  $('hCargoT').textContent = `${cargoUsed()}/${ship.cargoMax}`;
  const inf = influence();
  $('hInfl').textContent = inf;
  $('hRank').textContent = rankName(inf);
  $('hFuel').parentElement.classList.toggle('low', S.fuel < ship.fuelMax * 0.2);
  $('hHull').parentElement.classList.toggle('low', S.hull < ship.hpMax * 0.3);
  $('hCargo').parentElement.classList.toggle('full', cargoFree() <= 0);
  const nu = nextUnlock();
  const o = $('objective');
  if (nu) {
    const prev = UNLOCKS[S.unlock].at, pct = clamp((S.stats.earned - prev) / (nu.at - prev), 0, 1);
    o.innerHTML = `<small>NEXT UNLOCK</small><b>${nu.icon} ${nu.title}</b><div class="meter gold"><i style="width:${pct * 100}%"></i></div><span>${fmt(S.stats.earned)} / ${fmt(nu.at)} cr earned</span>`;
  } else if (!S.won) {
    o.innerHTML = `<small>FINAL GOAL</small><b>👑 Reach 100 influence</b><div class="meter gold"><i style="width:${Math.min(100, inf)}%"></i></div><span>Influence ${inf}/100 · invest in stations</span>`;
  } else o.innerHTML = `<small>SOLAR SOVEREIGN</small><b>👑 You rule the system</b><span>Keep growing your empire.</span>`;
  if (!S.won && has(U.SATURN) && inf >= 100 && !isBlocking()) victory();
  if (pendingUnlocks.length && $('modal').classList.contains('hidden') && scene !== BattleScene && !(MapScene.travel)) showUnlock(pendingUnlocks.shift());
}
function showUnlock(i) {
  const u = UNLOCKS[i];
  sfx('win');
  const upg = u.upg.length ? `<div class="unl-upg">${u.upg.map(k => `<span class="chip ore">${UPG[k].icon} ${UPG[k].n}</span>`).join('')}</div><small>New upgrades available at any station.</small>` : '';
  showModal({ icon: u.icon, title: u.title, cls: 'unlock', html: `<div class="unl-tag">NEW!</div><p>${u.text}</p>${upg}`,
    buttons: [{ label: 'Awesome!', cls: 'primary', fn: () => { if (!$('sheet').classList.contains('hidden') && LOC[S.loc].station) renderDock(); updateHUD(); } }] });
  const el = $('objective'); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function victory() {
  S.won = true; save();

  }

  html += '</div>';

  if (evs.length) html += `<div class="evs">${evs.map(e => `<div class="ev">${e.icon} <b>${e.title}</b> <small>(${e.end - S.day}d)</small></div>`).join('')}</div>`;

  }

  }
  if (here) {
    html += `<div class="lp-actions">`;
    if (l.station) html += `<button class="btn primary big" onclick="openDock()">🛰 Dock at ${l.station}</button>`;
    if (l.field) html += `<button class="btn ore big" onclick="enterMine()">⛏ Mine ${l.field.n}</button>`;
    if (!l.station) {
      const stations = NODES.filter(x => x.station && locOpen(x.id));
      const reachable = stations.some(x => travelInfo(x.id).fuel <= S.fuel);
      if (!reachable) html += `<button class="btn danger big" onclick="towShip('You ran out of fuel.')">🚨 Call a tug</button>`;
    }
    html += `</div>`;
  } else {

      <div><small>Fuel</small><b class="${ok ? '' : 'badt'}">${info.fuel} <small>/ ${Math.floor(S.fuel)}</small></b></div>
      <div><small>Time</small><b>${info.days} day${info.days > 1 ? 's' : ''}</b></div>

  p.innerHTML = html;
  p.classList.remove('hidden');
}

function countUp(el, v) {

}

function upgDelta(k, a, b) {
  const u = UPG[k], i = a - 1, j = b - 1;
  const ar = (x, y, unit) => `${x}${unit || ''} → <b>${y}${unit || ''}</b>`;
  switch (k) {
    case 'hull': return `New ship: <b>${u.names[j]}</b><br>Cargo ${ar(u.cargo[i], u.cargo[j])} · Armor ${ar(u.hp[i], u.hp[j])}`;
    case 'laser': return `Mining power ${ar(u.dps[i], u.dps[j])} · Range ${ar(u.range[i], u.range[j])}`;
    case 'engine': return `Speed ${ar('×' + u.speed[i], '×' + u.speed[j])} · Fuel use ${ar(Math.round(100 / u.eff[i]) + '%', Math.round(100 / u.eff[j]) + '%')}`;
    case 'tank': return `Fuel ${ar(u.fuel[i], u.fuel[j])}`;
    case 'shield': return `Shield ${ar(u.sp[i], u.sp[j])}`;
    case 'weapons': return `Firepower ${ar(u.dps[i], u.dps[j])}`;
    case 'drones': return `Magnet ${ar(u.magnet[i], u.magnet[j])} · Drones ${ar(u.count[i], u.count[j])}`;
    case 'scanner': return `Ambush avoidance ${ar(Math.round(u.avoid[i] * 100), Math.round(u.avoid[j] * 100), '%')}`;
  }
}
function drawShipPreview(id, lv, t) {
  const c = $(id); if (!c) return;
  const x = c.getContext('2d');
  const w = c.width, h = c.height;
  x.clearRect(0, 0, w, h);
  const g = x.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w / 2);
  g.addColorStop(0, '#16224a'); g.addColorStop(1, '#070b1c');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.strokeStyle = 'rgba(61,232,255,0.1)';
  for (let i = 0; i < w; i += 20) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, h); x.stroke(); }
  for (let i = 0; i < h; i += 20) { x.beginPath(); x.moveTo(0, i); x.lineTo(w, i); x.stroke(); }
  const Hd = HULLS[lv.hull - 1];
  const ex = Hd.hull[0][0] - Hd.tail + 28, ey = Math.abs(Hd.wing[1][1]) * 2 + 8;
  const sc = Math.min(w * 0.78 / ex, h * 0.8 / ey);
  const cx = (Hd.hull[0][0] + Hd.tail - 22) / 2;
  drawPlayerShip(x, lv, w / 2 - cx * sc, h / 2 + Math.sin(t * 1.5) * 3, 0, sc, 0.7 + 0.3 * Math.sin(t * 3), t);
}

}

  let upg = '';
  for (const k of UPG_KEYS) if (upgOpen(k)) upg += `<div class="srow"><span>${UPG[k].icon} ${UPG[k].n}</span><b>${UPG[k].names[S.lv[k] - 1]}</b><span class="pips">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= S.lv[k] ? 'on' : ''}"></i>`).join('')}</span></div>`;
  openSheet(`🚀 ${S.shipName} <small>${UPG.hull.names[S.lv.hull - 1]} class</small>`, `<div class="yard-top"><canvas id="shipView" width="420" height="190"></canvas></div>
    <div class="cols"><div><div class="sub">Systems</div>${upg}</div><div><div class="sub">Cargo hold ${cargoUsed()}/${ship.cargoMax}</div>${rows || '<div class="empty small">Empty</div>'}
    <div class="sub">Stats</div><div class="srow"><span>Ore mined</span><b>${fmt(S.stats.mined)}</b></div><div class="srow"><span>Lifetime earnings</span><b>${fmt(S.stats.earned)} cr</b></div>
    ${has(U.BELT) ? `<div class="srow"><span>Battles won / lost</span><b>${S.stats.won} / ${S.stats.lost}</b></div>` : ''}${has(U.TRADE) ? `<div class="srow"><span>Contracts</span><b>${S.stats.contracts}</b></div>` : ''}</div></div>`);
  const t0 = performance.now();
  const anim = () => { if (!$('sheet').classList.contains('hidden') && $('shipView')) { drawShipPreview('shipView', S.lv, (performance.now() - t0) / 1000); requestAnimationFrame(anim); } };
  anim();
}
function jettison(k) { addCargo(k, -S.cargo[k]); sfx('click'); openShip(); }

function openFactions() {
  sfx('click');
  const inf = influence();
  let h = `<div class="inf-big"><div><small>INFLUENCE</small><b>${inf}</b><span>/ 100</span></div><div class="meter big gold"><i style="width:${Math.min(100, inf)}%"></i></div><div class="rank">${rankName(inf)}</div></div>`;
  h += '<div class="sub">Faction reputation</div>';
  for (const f in FACTIONS) {
    const r = S.rep[f];
    h += `<div class="fac"><span style="color:${FACTIONS[f].c}">${FACTIONS[f].n}</span><div class="repbar"><i style="left:50%;width:${Math.abs(r) / 2}%;${r < 0 ? `left:${50 - Math.abs(r) / 2}%;background:#ff4d6d` : `background:${FACTIONS[f].c}`}"></i><em></em></div><b>${Math.round(r)}</b></div>`;
  }
  h += '<div class="sub">Your investments</div>';
  const inv = Object.keys(S.invest);
  if (!inv.length) h += '<div class="empty small">No investments yet — use the Invest tab when docked.</div>';
  for (const id of inv) h += `<div class="srow"><span>${LOC[id].station}</span><b>${INVEST.names[S.invest[id] - 1]}</b><span class="pips">${[1, 2, 3].map(i => `<i class="${i <= S.invest[id] ? 'on' : ''}"></i>`).join('')}</span></div>`;
  h += `<p class="hint">Passive income: <b>${fmt(dailyIncome())} cr/day</b>. Influence comes from investments, good reputation and battle victories.</p>`;
  h += '<div class="sub">Active events</div>' + (S.events.length ? S.events.map(e => `<div class="ev">${e.icon} <b>${e.title}</b> <small>— ${e.text} (${e.end - S.day}d)</small></div>`).join('') : '<div class="empty small">The system is calm… for now.</div>');
  openSheet('🏛 Factions & Influence', h);
}
function openNews() {
  sfx('click');
  openSheet('📰 System News', S.news.map(n => `<div class="news"><i>DAY ${n.day}</i><span>${n.icon}</span><div>${n.html}</div></div>`).join(''));
}
function openMenu() {
  sfx('click');
  openSheet('☰ Menu', `<div class="menu">
    <button class="btn primary big" onclick="closeSheet()">Resume</button>
    <button class="btn big" onclick="openHelp()">How to play</button>
    <button class="btn big danger" onclick="confirmNew()">New game</button></div>`);
}
function confirmNew() {
  closeSheet(true);
  showModal({ icon: '⚠️', title: 'Start a new game?', html: 'Your current progress will be lost.', buttons: [
    { label: 'Yes, start over', cls: 'danger', fn: () => { pendingUnlocks = []; newGame(); save(); shownCredits = 0; setScene(MineScene, 'luna'); updateHUD(); updateTicker(); } },
    { label: 'Cancel', fn: () => {} }] });
}
function openHelp() {
  openSheet('📖 How to play', `<div class="help">
    <h4>⛏ Mine</h4><p>Fly with <b>WASD</b> or arrows, <b>hold the mouse</b> to fire your laser (or Space). Big rocks break into smaller ones and drop glowing ore. On mobile: drag on the left, hold LASER. Glowing veins give double ore.</p>
    <h4>🛰 Dock</h4><p>Docking sells your ore, refuels and repairs automatically. Spend your credits on upgrades — a new hull is a whole new ship.</p>
    <h4>🔓 Unlock</h4><p>The more you earn, the more of the Solar System opens up: the star map, new planets, pirates, trading, events and finally influence.</p>
    <h4>🗺 Travel</h4><p>Planets orbit the Sun, so distances change every day. Farther places pay more and are more dangerous.</p>
    <h4>👑 Win</h4><p>Invest in stations to earn influence. Reach <b>100 influence</b> to rule the Solar System.</p></div>`);
}

// ---- main.js ----
'use strict';
// ============ MOTOR PRINCIPAL ============
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let scene = null;
const keys = new Set();
const mouse = { x: 0, y: 0, down: false, onUI: false };
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
let touchFire = false;
const joy = { active: false, dx: 0, dy: 0, id: null, ox: 0, oy: 0 };

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
resize();

function setScene(sc, arg) {
  if (scene && scene.exit) scene.exit();
  scene = sc;
  if (sc && sc.enter) sc.enter(arg);
  mouse.down = false; touchFire = false;
}

// ---------- entrada ----------
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  keys.add(e.code);
  audioInit();
  if (e.code === 'Space' && scene === MineScene) e.preventDefault();
  if (e.code === 'Escape') {
    if (!$('sheet').classList.contains('hidden')) closeSheet();
    else if (scene === MineScene && !isBlocking()) MineScene.leave();
  }
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); mouse.down = false; });

canvas.addEventListener('mousedown', e => { audioInit(); mouse.down = true; mouse.onUI = false; mouse.x = e.clientX; mouse.y = e.clientY; if (scene && scene.onDown && !isBlocking()) scene.onDown(e.clientX, e.clientY); });
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.onUI = e.target !== canvas; if (scene && scene.onMove && !isBlocking()) scene.onMove(e.clientX, e.clientY, mouse.down); });
window.addEventListener('mouseup', e => { if (mouse.down && scene && scene.onUp && !isBlocking()) scene.onUp(e.clientX, e.clientY); mouse.down = false; });
canvas.addEventListener('wheel', e => { e.preventDefault(); if (scene && scene.onWheel && !isBlocking()) scene.onWheel(e.deltaY, e.clientX, e.clientY); }, { passive: false });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// táctil en canvas (mapa: arrastrar/pellizcar)
let pinch = null;
canvas.addEventListener('touchstart', e => {
  audioInit();
  if (scene === MineScene) return;
  e.preventDefault();
  if (e.touches.length === 2) {
    const [a, b] = e.touches;
    pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) };
    if (scene.drag) scene.drag.moved = true;
  } else if (e.touches.length === 1 && scene && scene.onDown && !isBlocking()) {
    const t = e.touches[0]; mouse.down = true; scene.onDown(t.clientX, t.clientY);
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (scene === MineScene) return;
  e.preventDefault();
  if (e.touches.length === 2 && pinch && scene.onPinch) {
    const [a, b] = e.touches;
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    scene.onPinch(d / pinch.d, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
    pinch.d = d;
  } else if (e.touches.length === 1 && scene && scene.onMove) {
    const t = e.touches[0]; scene.onMove(t.clientX, t.clientY, true);
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  if (scene === MineScene) return;
  e.preventDefault();
  if (e.touches.length === 0) {
    const t = e.changedTouches[0];
    if (!pinch && scene && scene.onUp && !isBlocking()) scene.onUp(t.clientX, t.clientY);
    pinch = null; mouse.down = false;
  }
}, { passive: false });

// joystick + botón láser (minería en móvil)
function setupTouchControls() {
  const zone = $('joyZone'), knob = $('joyKnob'), base = $('joyBase'), fire = $('fireBtn');
  zone.addEventListener('touchstart', e => {
    e.preventDefault(); audioInit();
    const t = e.changedTouches[0];
    joy.id = t.identifier; joy.active = true; joy.ox = t.clientX; joy.oy = t.clientY;
    base.style.left = (t.clientX - 55) + 'px'; base.style.top = (t.clientY - 55) + 'px'; base.classList.add('on');
    knob.style.transform = 'translate(0,0)';
  }, { passive: false });
  zone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === joy.id) {
      let dx = t.clientX - joy.ox, dy = t.clientY - joy.oy;
      const l = Math.hypot(dx, dy), m = 45;
      if (l > m) { dx *= m / l; dy *= m / l; }
      joy.dx = dx / m; joy.dy = dy / m;
      knob.style.transform = `translate(${dx}px,${dy}px)`;
    }
  }, { passive: false });
  const end = e => { for (const t of e.changedTouches) if (t.identifier === joy.id) { joy.active = false; joy.dx = joy.dy = 0; base.classList.remove('on'); } };
  zone.addEventListener('touchend', end); zone.addEventListener('touchcancel', end);
  fire.addEventListener('touchstart', e => { e.preventDefault(); touchFire = true; fire.classList.add('on'); }, { passive: false });
  const fe = e => { e.preventDefault(); touchFire = false; fire.classList.remove('on'); };
  fire.addEventListener('touchend', fe); fire.addEventListener('touchcancel', fe);
}

// ---------- bucle ----------
let last = performance.now(), hudT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (scene) {
    if (!isBlocking() || scene === BattleScene || scene === MapScene || scene === TitleScene) scene.update(dt);
    scene.draw(ctx);
  }
  if (S && scene !== TitleScene) hudTick(dt);
  hudT += dt;
  if (hudT > 0.3 && S && scene !== TitleScene) { hudT = 0; updateHUD(); }
  requestAnimationFrame(frame);
}

// ---------- pantalla de título ----------
const TitleScene = {
  t: 0,
  enter() {
    $('title').classList.remove('hidden'); $('hud').classList.add('hidden');
    const sv = hasSave();
    $('cont').classList.toggle('hidden', !sv);
    $('newg').textContent = sv ? 'New game' : '▶ PLAY';
    $('newg').classList.toggle('primary', !sv);
  },
  exit() { $('title').classList.add('hidden'); $('hud').classList.remove('hidden'); },
  update(dt) { this.t += dt; },
  draw(ctx) {
    const t = this.t;
    drawSpaceBg(ctx, W, H, t * 8, t * 3, t);
    const cx = W * 0.5, cy = H * 0.55, z = Math.min(W, H) / 1250;
    drawSun(ctx, cx, cy, 16 * z * 2, t);
    const day = t * 6;
    for (const l of LOCS) {
      if (l.parent || l.follow) continue;
      ctx.strokeStyle = 'rgba(120,160,255,0.1)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(cx, cy, l.r * z * 1.7, l.r * z * 0.75, 0, 0, TAU); ctx.stroke();
      const a = l.a0 + day / l.period * TAU * 3;
      const px = cx + Math.cos(a) * l.r * z * 1.7, py = cy + Math.sin(a) * l.r * z * 0.75;
      if (l.id === 'kuiper') continue;
      drawPlanet(ctx, px, py, Math.max(3, l.size * z * 2.2), l, Math.atan2(cy - py, cx - px), t);
    }
    // nave que cruza
    const sx = ((t * 70) % (W + 400)) - 200, sy = H * 0.32 + Math.sin(t * 0.8) * 20;
    drawPlayerShip(ctx, { hull: 4, engine: 4, weapons: 3, laser: 3 }, sx, sy, 0.05, 1.1, 1, t);
  },
};

function startGame(cont) {
  audioInit();
  if (cont) S = loadSave();
  if (!S) { newGame(); save(); }
  shownCredits = S.credits;
  pendingUnlocks = [];
  if (cont && has(U.MAP)) setScene(MapScene);
  else setScene(MineScene, cont ? (LOC[S.loc].field ? S.loc : 'luna') : 'luna');
  if (!cont) S.loc = 'luna';
  updateHUD(); updateTicker();
}

// ---------- inicio ----------
function init() {
  setupTouchControls();
  $('bShip').onclick = openShip; $('bFac').onclick = openFactions; $('bNews').onclick = openNews; $('bMenu').onclick = openMenu;
  const snd = $('bSnd');
  snd.textContent = muted ? '🔇' : '🔊';
  snd.onclick = () => { audioInit(); setMuted(!muted); snd.textContent = muted ? '🔇' : '🔊'; };
  $('zIn').onclick = () => MapScene.onWheel(-300, W / 2, H / 2);
  $('zOut').onclick = () => MapScene.onWheel(300, W / 2, H / 2);
  $('zHome').onclick = () => MapScene.focus(S.loc);
  $('zAll').onclick = () => MapScene.zoomAll();
  $('btnDock').onclick = () => MineScene.leave();
  $('btnMap').onclick = () => MineScene.leave(true);
  $('btnSpeed').onclick = () => { BattleScene.speed = BattleScene.speed === 1 ? 2 : BattleScene.speed === 2 ? 4 : 1; $('btnSpeed').textContent = 'Speed ×' + BattleScene.speed; };
  $('btnRetreat').onclick = () => BattleScene.retreat();
  $('newg').onclick = () => { if (hasSave()) { showModal({ icon: '⚠️', title: 'Start a new game?', html: 'Your saved game will be overwritten.', buttons: [{ label: 'Start over', cls: 'danger', fn: () => { S = null; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} startGame(false); } }, { label: 'Cancel', fn: () => {} }] }); } else startGame(false); };
  $('cont').onclick = () => startGame(true);
  $('howto').onclick = () => { openHelp(); };
  for (const el of document.querySelectorAll('.ui')) {
    el.addEventListener('mouseenter', () => mouse.onUI = true);
    el.addEventListener('mouseleave', () => mouse.onUI = false);
  }
  const params = new URLSearchParams(location.search);
  if (params.has('thumb')) return thumbMode(params.get('thumb'));
  setScene(TitleScene);
  requestAnimationFrame(frame);
}

// ---------- modo miniatura (portada del juego) ----------
function thumbMode(kind) {
  document.body.classList.add('thumb');
  newGame();
  S.lv = { hull: 4, laser: 4, engine: 4, tank: 3, shield: 3, weapons: 3, drones: 3, scanner: 3 };
  $('title').classList.add('hidden'); $('hud').classList.add('hidden');
  const t = 12.3;
  drawSpaceBg(ctx, W, H, 120, 80, t, '#141a44');
  drawPlanet(ctx, W * 0.83, H * 0.26, H * 0.36, LOC.saturno, Math.PI * 0.85, t);
  drawSun(ctx, -W * 0.02, H * 0.95, 70, t);
  MineScene.loc = LOC.saturno;
  const rocks = [];
  const mk = (x, y, tier, ore, rich) => { const r = { x, y, r: [0, 20, 34, 56][tier] * 1.5, tier, ore, rich, rot: rand(0, TAU), hit: 0, shape: makeRockShape(9 + tier * 2, 0.22),
    veins: Array.from({ length: 3 + tier * 2 }, () => { const a = rand(0, TAU), d = rand(0, 0.6); return [Math.cos(a) * d, Math.sin(a) * d, rand(0.07, 0.16)]; }),
    craters: Array.from({ length: tier }, () => { const a = rand(0, TAU), d = rand(0, 0.5); return [Math.cos(a) * d, Math.sin(a) * d, rand(0.1, 0.2)]; }) }; rocks.push(r); return r; };
  const big = mk(W * 0.64, H * 0.6, 3, 'iridium', true);
  mk(W * 0.86, H * 0.78, 2, 'platinum', false); mk(W * 0.5, H * 0.86, 1, 'ice', false); mk(W * 0.92, H * 0.5, 1, 'he3', true); mk(W * 0.24, H * 0.92, 2, 'nickel', false); mk(W * 0.72, H * 0.14, 1, 'exotic', true);
  for (const r of rocks) drawRock(ctx, r, t, 3);
  const sx = W * 0.3, sy = H * 0.62;
  const ang = Math.atan2(big.y - sy, big.x - sx);
  // láser
  const col = laserColor(4), nx = sx + Math.cos(ang) * 90 * Math.min(1, W / 1024), ny = sy + Math.sin(ang) * 90 * Math.min(1, W / 1024);
  const hx = big.x - Math.cos(ang) * big.r * 0.8, hy = big.y - Math.sin(ang) * big.r * 0.8;
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = col; ctx.globalAlpha = 0.4; ctx.lineWidth = 16;
  ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.globalAlpha = 1; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  glow(ctx, hx, hy, 60, col, 1);
  const P = new Particles();
  for (let i = 0; i < 60; i++) { const a = ang + Math.PI + rand(-1.2, 1.2), v = rand(10, 80); P.add(hx + Math.cos(a) * v, hy + Math.sin(a) * v, 0, 0, rand(0.3, 1), Math.random() < 0.5 ? ITEMS.iridium.c : col, rand(1.5, 4)); }
  P.draw(ctx);
  for (let i = 0; i < 7; i++) drawOreChunk(ctx, { x: sx + 60 + i * 38 + rand(-10, 10), y: sy + 70 + Math.sin(i) * 26, ore: pick(['iridium', 'platinum', 'he3']), rot: i }, 0);
  // piratas a lo lejos
  drawEnemyShip(ctx, 'corsair', W * 0.95, H * 0.93, Math.PI * 1.1, 1.3, t);
  drawEnemyShip(ctx, 'raider', W * 0.88, H * 0.97, Math.PI * 1.05, 1.1, t);
  drawPlayerShip(ctx, S.lv, sx, sy, ang, 3.0 * Math.min(1, W / 1280 * 1.25), 1, t);
  // título
  if (kind !== 'clean') {
    const s = Math.min(W / 1280, H / 720);
    ctx.textAlign = 'left';
    ctx.font = `900 ${Math.round(92 * s)}px Orbitron, 'Arial Black', sans-serif`;
    ctx.shadowColor = '#3de8ff'; ctx.shadowBlur = 30 * s;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('SOLAR', 60 * s, 130 * s);
    ctx.fillStyle = '#3de8ff';
    ctx.fillText('PROSPECTOR', 60 * s, 225 * s);
    ctx.shadowBlur = 0;
    ctx.font = `600 ${Math.round(30 * s)}px Rajdhani, sans-serif`;
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('MINE · TRADE · RULE THE SOLAR SYSTEM', 64 * s, 275 * s);
  }
  document.body.dataset.ready = '1';
}

window.addEventListener('load', init);
</script>
