'use strict';
// ============ ESCENA: MINERÍA ============
const MW = 2100, MH = 2100;
const MineScene = {
  t: 0, loc: null, rocks: [], chunks: [], drones: [], parts: new Particles(), cam: { x: 0, y: 0 }, shake: 0,
  p: null, dayTimer: 0, ambush: null, laserOn: false, laserHit: null, fullWarn: 0, broken: 0, collected: {}, heatWarn: 0, floaters: [],
  enter(locId) {
    this.loc = LOC[locId || this.loc.id];
    if (locId) this.setup();
    showMineUI(true);
  },
  exit() { showMineUI(false); laserSound(false); },
  setup() {
    const f = this.loc.field;
    this.rocks = []; this.chunks = []; this.parts = new Particles(); this.floaters = [];
    this.p = { x: MW / 2, y: MH - 300, vx: 0, vy: -40, a: -Math.PI / 2, shield: ship.shieldMax, shT: 0 };
    this.cam = { x: this.p.x, y: this.p.y };
    this.dayTimer = 0; this.broken = 0; this.collected = {};
    const depl = S.depl[this.loc.id] || 0;
    const rich = S.events.some(e => e.rich === this.loc.id);
    const n = Math.round(f.count * (1 - depl * 0.55) * (rich ? 1.2 : 1));
    for (let i = 0; i < n; i++) {
      let x, y;
      if (i < 3) { const a = -Math.PI / 2 + (i - 1) * 0.7; x = this.p.x + Math.cos(a) * rand(260, 380); y = this.p.y + Math.sin(a) * rand(260, 380); }
      else do { x = rand(150, MW - 150); y = rand(150, MH - 150); } while (Math.hypot(x - this.p.x, y - this.p.y) < 300);
      this.spawnRock(x, y, pick([3, 3, 2, 2, 1]) === 1 ? 2 : 3, null, rich);
    }
    this.drones = [];
    for (let i = 0; i < ship.drones; i++) this.drones.push({ x: this.p.x, y: this.p.y, vx: 0, vy: 0, tgt: null, carry: null, a: i });
    // emboscada
    this.ambush = null;
    const dg = locDanger(this.loc.id) * (1 - ship.avoid);
    if (Math.random() < dg * 0.7) this.ambush = { at: rand(22, 55), warned: false };
    this.heatWarn = 0;
  },
  spawnRock(x, y, tier, ore, rich) {
    const f = this.loc.field;
    if (!ore) {
      const tot = Object.values(f.ores).reduce((a, b) => a + b, 0);
      let r = Math.random() * tot; ore = Object.keys(f.ores)[0];
      for (const k in f.ores) { r -= f.ores[k]; if (r <= 0) { ore = k; break; } }
    }
    const R = [0, 20, 34, 56][tier] * rand(0.9, 1.15);
    const isRich = Math.random() < (rich ? 0.3 : 0.1);
    const nv = 2 + Math.floor(tier * 1.5);
    const rock = {
      x, y, vx: rand(-18, 18), vy: rand(-18, 18), rot: rand(0, TAU), vr: rand(-0.4, 0.4), r: R, tier, ore, rich: isRich,
      hp: R * 0.7 * ITEMS[ore].h, maxhp: R * 0.7 * ITEMS[ore].h, hit: 0, cold: f.cold,
      shape: makeRockShape(9 + tier * 2, 0.22),
      veins: Array.from({ length: nv }, () => { const a = rand(0, TAU), d = rand(0, 0.6); return [Math.cos(a) * d, Math.sin(a) * d, rand(0.07, 0.16)]; }),
      craters: Array.from({ length: tier }, () => { const a = rand(0, TAU), d = rand(0, 0.5); return [Math.cos(a) * d, Math.sin(a) * d, rand(0.1, 0.2)]; }),
    };
    this.rocks.push(rock);
    return rock;
  },
  breakRock(r) {
    this.rocks = this.rocks.filter(x => x !== r);
    this.parts.burst(r.x, r.y, 14 + r.tier * 8, '#c9b8a6', 120 + r.tier * 40, 0.8, 2.5);
    this.parts.burst(r.x, r.y, 6 + r.tier * 3, ITEMS[r.ore].c, 90, 1, 2.5);
    sfx('break'); this.shake = Math.max(this.shake, r.tier * 3);
    if (r.tier > 1) {
      for (let i = 0; i < 2; i++) {
        const c = this.spawnRock(r.x + rand(-10, 10), r.y + rand(-10, 10), r.tier - 1, r.ore);
        const a = rand(0, TAU); c.vx = r.vx + Math.cos(a) * 50; c.vy = r.vy + Math.sin(a) * 50; c.rich = r.rich;
      }
      if (Math.random() < 0.5) this.dropChunk(r.x, r.y, r.ore);
    } else {
      const n = randi(1, 2) + (r.rich ? 2 : 0);
      for (let i = 0; i < n; i++) this.dropChunk(r.x, r.y, r.ore);
    }
    if (r.tier === 3) { this.broken++; S.depl[this.loc.id] = Math.min(1, (S.depl[this.loc.id] || 0) + 0.02); }
  },
  dropChunk(x, y, ore) {
    const a = rand(0, TAU), v = rand(20, 60);
    this.chunks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, ore, rot: rand(0, TAU), life: 45 });
  },
  collect(c) {
    if (cargoFree() <= 0) return false;
    addCargo(c.ore, 1); S.stats.mined++;
    this.collected[c.ore] = (this.collected[c.ore] || 0) + 1;
    this.floaters.push({ x: this.p.x, y: this.p.y - 20, txt: '+1 ' + ITEMS[c.ore].n, col: ITEMS[c.ore].c, life: 1.1 });
    sfx('pickup');
    checkTut();
    return true;
  },
  update(dt) {
    this.t += dt;
    const p = this.p;
    // --- entrada ---
    let ax = 0, ay = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp')) ay -= 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) ay += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) ax -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) ax += 1;
    if (joy.active) { ax = joy.dx; ay = joy.dy; }
    const al = Math.hypot(ax, ay);
    if (al > 1) { ax /= al; ay /= al; }
    const acc = 520 * ship.thrust / Math.pow(ship.mass, 0.35);
    p.vx += ax * acc * dt; p.vy += ay * acc * dt;
    const drag = Math.pow(0.4, dt);
    p.vx *= drag; p.vy *= drag;
    const maxV = 340 * ship.thrust;
    const v = Math.hypot(p.vx, p.vy);
    if (v > maxV) { p.vx *= maxV / v; p.vy *= maxV / v; }
    p.x = clamp(p.x + p.vx * dt, 40, MW - 40); p.y = clamp(p.y + p.vy * dt, 40, MH - 40);
    this.thrusting = Math.hypot(ax, ay);
    // --- apuntar / láser ---
    let aim = null;
    const wm = { x: mouse.x - W / 2 + this.cam.x, y: mouse.y - H / 2 + this.cam.y };
    let firing = false;
    if (touchFire) {
      let best = null, bd = ship.laserRange + 40;
      for (const r of this.rocks) { const d = Math.hypot(r.x - p.x, r.y - p.y) - r.r; if (d < bd) { bd = d; best = r; } }
      if (best) { aim = Math.atan2(best.y - p.y, best.x - p.x); firing = true; }
    } else if (mouse.down && !mouse.onUI) { aim = Math.atan2(wm.y - p.y, wm.x - p.x); firing = true; }
    if (keys.has('Space')) { firing = true; if (aim == null) aim = p.a; }
    const targetA = aim != null ? aim : (al > 0.1 ? Math.atan2(ay, ax) : p.a);
    let da = ((targetA - p.a + Math.PI) % TAU + TAU) % TAU - Math.PI;
    p.a += da * Math.min(1, dt * 10);
    this.laserHit = null;
    if (firing) {
      const dir = aim != null ? aim : p.a;
      const dx = Math.cos(dir), dy = Math.sin(dir);
      let best = null, bt = ship.laserRange;
      for (const r of this.rocks) {
        const ox = r.x - p.x, oy = r.y - p.y;
        const proj = ox * dx + oy * dy;
        if (proj < 0) continue;
        const perp2 = ox * ox + oy * oy - proj * proj;
        const rr = r.r * 0.9;
        if (perp2 > rr * rr) continue;
        const tHit = proj - Math.sqrt(rr * rr - perp2);
        if (tHit < bt) { bt = tHit; best = r; }
      }
      const hx = p.x + dx * bt, hy = p.y + dy * bt;
      this.laserHit = { x: hx, y: hy, dir, rock: best };
      if (best) {
        best.hp -= ship.laserDps * dt; best.hit = 0.05;
        if (Math.random() < dt * 30) this.parts.add(hx, hy, -dx * 80 + rand(-60, 60), -dy * 80 + rand(-60, 60), 0.4, Math.random() < 0.5 ? ITEMS[best.ore].c : laserColor(S.lv.laser), 2, true);
        if (best.hp <= 0) this.breakRock(best);
      }
    }
    if (firing !== this.laserOn) { this.laserOn = firing; laserSound(firing, S.lv.laser); }
    // --- rocas ---
    for (const r of this.rocks) {
      r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vr * dt; r.hit = Math.max(0, r.hit - dt);
      if (r.x < r.r || r.x > MW - r.r) r.vx *= -1;
      if (r.y < r.r || r.y > MH - r.r) r.vy *= -1;
      r.x = clamp(r.x, r.r, MW - r.r); r.y = clamp(r.y, r.r, MH - r.r);
      // colisión con nave
      const dx = p.x - r.x, dy = p.y - r.y, d = Math.hypot(dx, dy), md = r.r + 12;
      if (d < md && d > 0) {
        const nx = dx / d, ny = dy / d;
        p.x = r.x + nx * md; p.y = r.y + ny * md;
        const rel = (p.vx - r.vx) * nx + (p.vy - r.vy) * ny;
        if (rel < 0) {
          p.vx -= 1.6 * rel * nx; p.vy -= 1.6 * rel * ny;
          r.vx += rel * nx * 0.2 / r.tier; r.vy += rel * ny * 0.2 / r.tier;
          if (-rel > 140) { this.damage((-rel - 120) * 0.05); sfx('bump'); this.shake = 6; }
        }
      }
    }
    // --- fragmentos ---
    const cfree = cargoFree();
    for (const c of this.chunks) {
      c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= Math.pow(0.5, dt); c.vy *= Math.pow(0.5, dt); c.life -= dt;
      const dx = p.x - c.x, dy = p.y - c.y, d = Math.hypot(dx, dy);
      if (d < ship.magnet && cfree > 0) { const f = 600 * (1 - d / ship.magnet) + 120; c.vx += dx / d * f * dt; c.vy += dy / d * f * dt; }
      if (d < 22) { if (this.collect(c)) c.dead = true; else if (this.fullWarn <= 0) { this.fullWarn = 3; toast('¡Bodega llena! Vuelve a una estación a vender.', 'bad'); sfx('full'); } }
      if (c.life <= 0) c.dead = true;
    }
    this.fullWarn -= dt;
    this.chunks = this.chunks.filter(c => !c.dead);
    // --- drones recolectores ---
    for (const dr of this.drones) {
      if (dr.tgt && (dr.tgt.dead || !this.chunks.includes(dr.tgt))) dr.tgt = null;
      if (!dr.tgt && !dr.carry && cargoFree() > 0) {
        let best = null, bd = 900;
        for (const c of this.chunks) { if (this.drones.some(o => o !== dr && o.tgt === c)) continue; const d = Math.hypot(c.x - dr.x, c.y - dr.y); if (d < bd) { bd = d; best = c; } }
        dr.tgt = best;
      }
      let tx, ty;
      if (dr.carry) { tx = p.x; ty = p.y; }
      else if (dr.tgt) { tx = dr.tgt.x; ty = dr.tgt.y; }
      else { const a = this.t * 1.5 + dr.a * TAU / Math.max(1, this.drones.length); tx = p.x + Math.cos(a) * 45; ty = p.y + Math.sin(a) * 45; }
      const dx = tx - dr.x, dy = ty - dr.y, d = Math.hypot(dx, dy) || 1;
      const sp = 380;
      dr.vx = lerp(dr.vx, dx / d * Math.min(sp, d * 6), dt * 6); dr.vy = lerp(dr.vy, dy / d * Math.min(sp, d * 6), dt * 6);
      dr.x += dr.vx * dt; dr.y += dr.vy * dt;
      if (dr.tgt && d < 12) { dr.carry = dr.tgt; dr.tgt.dead = true; this.chunks = this.chunks.filter(c => c !== dr.carry); dr.tgt = null; }
      if (dr.carry && d < 20) { if (!this.collect(dr.carry)) this.chunks.push(Object.assign(dr.carry, { dead: false, x: dr.x, y: dr.y, vx: 0, vy: 0 })); dr.carry = null; }
    }
    // --- escudo + peligros ---
    p.shT -= dt;
    if (p.shT <= 0) p.shield = Math.min(ship.shieldMax, p.shield + (4 + S.lv.shield * 2) * dt);
    if (this.loc.field.hazard === 'heat') {
      this.damage(1.1 * dt, true);
      this.heatWarn += dt;
    }
    // --- emboscada ---
    if (this.ambush) {
      this.ambush.at -= dt;
      if (!this.ambush.warned && this.ambush.at < 4) { this.ambush.warned = true; toast('⚠ ¡Firmas hostiles acercándose!', 'bad'); sfx('alarm'); }
      if (this.ambush.at <= 0) {
        this.ambush = null; laserSound(false); this.laserOn = false; mouse.down = false; touchFire = false;
        pirateEncounter(locDanger(this.loc.id), () => {});
        return;
      }
    }
    // --- tiempo ---
    this.dayTimer += dt;
    if (this.dayTimer > 40) { this.dayTimer = 0; tickDay(); updateHUD(); }
    // respawn lento de rocas si quedan pocas
    if (this.rocks.length < 4 && Math.random() < dt * 0.1) {
      const a = rand(0, TAU); this.spawnRock(clamp(p.x + Math.cos(a) * 900, 150, MW - 150), clamp(p.y + Math.sin(a) * 900, 150, MH - 150), 3);
    }
    this.parts.update(dt);
    for (const f of this.floaters) { f.y -= 30 * dt; f.life -= dt; }
    this.floaters = this.floaters.filter(f => f.life > 0);
    // cámara
    const k = 1 - Math.pow(0.001, dt);
    this.cam.x = lerp(this.cam.x, p.x + p.vx * 0.3, k); this.cam.y = lerp(this.cam.y, p.y + p.vy * 0.3, k);
    this.shake = Math.max(0, this.shake - dt * 20);
    // estela
    if (this.thrusting > 0.1 && Math.random() < dt * 40) {
      const bx = p.x - Math.cos(p.a) * shipLen(S.lv) * 0.75, by = p.y - Math.sin(p.a) * shipLen(S.lv) * 0.75;
      this.parts.add(bx, by, -Math.cos(p.a) * 60 + rand(-15, 15), -Math.sin(p.a) * 60 + rand(-15, 15), 0.45, '#ff9b4a', 2.5);
    }
    updateMineHUD();
  },
  damage(n, heat) {
    const p = this.p;
    if (p.shield > 0) { const a = Math.min(p.shield, n); p.shield -= a; n -= a; if (!heat) p.shT = 2; }
    if (n > 0) {
      S.hull -= n;
      if (S.hull <= 0) {
        S.hull = 0; laserSound(false); this.laserOn = false;
        towShip('Tu casco colapsó en el campo minero.');
      }
    }
  },
  draw(ctx) {
    const t = this.t;
    const sx = (Math.random() - 0.5) * this.shake, sy = (Math.random() - 0.5) * this.shake;
    const cx = this.cam.x - W / 2 + sx, cy = this.cam.y - H / 2 + sy;
    drawSpaceBg(ctx, W, H, cx, cy, t, this.loc.cold ? '#0c1838' : this.loc.field.hazard === 'heat' ? '#2a1408' : null);
    // cuerpo celeste de fondo
    const bgLoc = this.loc.parent ? LOC[this.loc.parent] : this.loc.follow ? LOC[this.loc.follow] : this.loc;
    const bx = W * 0.78 - cx * 0.04, by = H * 0.3 - cy * 0.04;
    ctx.globalAlpha = 0.8; drawPlanet(ctx, bx, by, Math.min(W, H) * (bgLoc.size > 12 ? 0.26 : 0.15), bgLoc, Math.atan2(-by, -bx - W), t); ctx.globalAlpha = 1;
    if (this.loc.field.hazard === 'heat') drawSun(ctx, -cx * 0.02 - 40, H * 0.5 - cy * 0.02, 120, t);
    ctx.save();
    ctx.translate(-cx, -cy);
    // bordes del campo
    ctx.strokeStyle = 'rgba(61,232,255,0.15)'; ctx.setLineDash([10, 12]); ctx.lineWidth = 2;
    ctx.strokeRect(20, 20, MW - 40, MH - 40); ctx.setLineDash([]);
    // imán
    const p = this.p;
    if (cargoFree() > 0) {
      ctx.strokeStyle = 'rgba(61,232,255,0.07)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, ship.magnet, 0, TAU); ctx.stroke();
    }
    for (const r of this.rocks) if (r.x > cx - 100 && r.x < cx + W + 100 && r.y > cy - 100 && r.y < cy + H + 100) drawRock(ctx, r, t, S.lv.scanner);
    for (const c of this.chunks) drawOreChunk(ctx, c, t);
    // láser
    if (this.laserHit) {
      const L = this.laserHit, col = laserColor(S.lv.laser);
      const nx = p.x + Math.cos(L.dir) * shipLen(S.lv) * 0.9, ny = p.y + Math.sin(L.dir) * shipLen(S.lv) * 0.9;
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = col; ctx.globalAlpha = 0.35; ctx.lineWidth = 7 + S.lv.laser + Math.sin(t * 50) * 2;
      ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(L.x, L.y); ctx.stroke();
      ctx.globalAlpha = 1; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(L.x, L.y); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      glow(ctx, L.x, L.y, L.rock ? 26 : 10, col, 0.9);
    }
    // drones
    for (const dr of this.drones) {
      glow(ctx, dr.x, dr.y, 10, '#3de8ff88', 0.8);
      ctx.fillStyle = '#d4dcea'; ctx.beginPath(); ctx.arc(dr.x, dr.y, 4, 0, TAU); ctx.fill();
      ctx.fillStyle = '#3de8ff'; ctx.beginPath(); ctx.arc(dr.x, dr.y, 1.8, 0, TAU); ctx.fill();
      if (dr.carry) { ctx.fillStyle = ITEMS[dr.carry.ore].c; ctx.fillRect(dr.x - 2, dr.y + 4, 4, 4); }
    }
    this.parts.draw(ctx);
    drawPlayerShip(ctx, S.lv, p.x, p.y, p.a, 1, this.thrusting, t);
    if (ship.shieldMax > 0 && p.shT > 1.5) {
      ctx.strokeStyle = `rgba(61,232,255,${(p.shT - 1.5) * 1.5})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, shipLen(S.lv) + 8, 0, TAU); ctx.stroke();
    }
    // textos flotantes
    ctx.font = '600 13px Rajdhani, sans-serif'; ctx.textAlign = 'center';
    for (const f of this.floaters) { ctx.globalAlpha = Math.min(1, f.life * 2); ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y); }
    ctx.globalAlpha = 1;
    ctx.restore();
    // miras
    if (!isTouch && !mouse.onUI) {
      ctx.strokeStyle = 'rgba(61,232,255,0.8)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 9, 0, TAU);
      ctx.moveTo(mouse.x - 14, mouse.y); ctx.lineTo(mouse.x - 5, mouse.y); ctx.moveTo(mouse.x + 5, mouse.y); ctx.lineTo(mouse.x + 14, mouse.y);
      ctx.moveTo(mouse.x, mouse.y - 14); ctx.lineTo(mouse.x, mouse.y - 5); ctx.moveTo(mouse.x, mouse.y + 5); ctx.lineTo(mouse.x, mouse.y + 14);
      ctx.stroke();
    }
    // minimapa
    const mm = 110, mx = W - mm - 14, my = H - mm - (isTouch ? 205 : 40);
    ctx.fillStyle = 'rgba(8,14,34,0.75)'; ctx.strokeStyle = 'rgba(61,232,255,0.35)'; ctx.lineWidth = 1;
    ctx.fillRect(mx, my, mm, mm); ctx.strokeRect(mx, my, mm, mm);
    for (const r of this.rocks) { ctx.fillStyle = r.rich && S.lv.scanner >= 2 ? ITEMS[r.ore].c : 'rgba(200,190,170,0.7)'; ctx.fillRect(mx + r.x / MW * mm - 1, my + r.y / MH * mm - 1, r.tier + 0.5, r.tier + 0.5); }
    ctx.fillStyle = '#3de8ff'; ctx.fillRect(mx + p.x / MW * mm - 2, my + p.y / MH * mm - 2, 4, 4);
    if (this.loc.field.hazard === 'heat' && ship.shieldMax <= 0) {
      ctx.fillStyle = `rgba(255,120,40,${0.08 + 0.05 * Math.sin(t * 4)})`; ctx.fillRect(0, 0, W, H);
    }
  },
  leave() {
    laserSound(false);
    const got = Object.entries(this.collected);
    if (got.length) addNews('⛏️', `Extraído en ${this.loc.field.n}: ${got.map(([k, n]) => `${n} ${ITEMS[k].n}`).join(', ')}`, '#ffd24a');
    save();
    setScene(MapScene);
  },
};

function towShip(reason) {
  const lost = {};
  for (const k in S.cargo) { const n = Math.ceil(S.cargo[k] * 0.6); lost[k] = n; addCargo(k, -n); }
  const markets = NODES.filter(l => l.station && !l.black);
  let best = markets[0], bd = 1e9;
  for (const l of markets) { const d = locDist(S.loc, l.id, S.day); if (d < bd) { bd = d; best = l; } }
  const fee = Math.round(Math.min(S.credits, 200 + S.credits * 0.1));
  S.credits -= fee; S.loc = best.id; S.hull = Math.max(S.hull, Math.round(ship.hpMax * 0.25));
  S.fuel = Math.max(S.fuel, 10);
  for (let i = 0; i < 3; i++) tickDay();
  sfx('lose');
  showModal({ icon: '🚨', title: 'Remolcada', danger: true, html: `${reason}<br>Un remolcador te lleva a <b>${best.station}</b>. Perdiste parte de la carga y pagaste <b>${fmt(fee)} ₵</b> de rescate. Pasaron 3 días.`,
    buttons: [{ label: 'Continuar', cls: 'primary', fn: () => { save(); setScene(MapScene); } }] });
}

'use strict';
// ============ ESCENA: COMBATE AUTOMÁTICO ============
const BattleScene = {
  t: 0, parts: new Particles(), shots: [], ended: false, speed: 1, prev: null, done: null, log: [],
  start(fleet, enemyFirst, done) {
    this.prev = scene; this.done = done; this.t = 0; this.ended = false; this.speed = 1; this.shots = []; this.parts = new Particles(); this.log = [];
    this.fleetKeys = fleet;
    this.pl = { hp: S.hull, max: ship.hpMax, sp: ship.shieldMax, spMax: ship.shieldMax, dps: ship.weaponDps, cd: enemyFirst ? 1.2 : 0.4, shT: 0, x: 0, y: 0, hitT: 0, dead: false,
      guns: Math.max(1, S.lv.weapons), evade: 0.04 + S.lv.engine * 0.03, retreatT: 0 };
    this.en = fleet.map((k, i) => {
      const e = ENEMIES[k]; const sc = 1 + S.day / 400;
      return { k, n: e.n, hp: e.hp * sc, max: e.hp * sc, sp: e.sp * sc, spMax: e.sp * sc, dps: e.dps * sc, cd: enemyFirst ? rand(0.1, 0.5) : rand(0.6, 1.4), shT: 0, idx: i, hitT: 0, dead: false, bob: rand(0, TAU), evade: 0.06 };
    });
    this.drones = Array.from({ length: ship.drones }, (_, i) => ({ a: i * TAU / Math.max(1, ship.drones), cd: rand(0.3, 1) }));
    setScene(this);
  },
  enter() { showBattleUI(true); sfx('alarm'); },
  exit() { showBattleUI(false); },
  layout() {
    const pl = this.pl;
    pl.x = W * (W < 700 ? 0.22 : 0.26); pl.y = H * 0.52;
    const alive = this.en;
    alive.forEach((e, i) => {
      const n = alive.length;
      e.x = W * (W < 700 ? 0.75 : 0.72) + (i % 2) * 50 * (W < 700 ? 0.6 : 1);
      e.y = H * 0.52 + (i - (n - 1) / 2) * Math.min(95, H * 0.6 / n);
    });
  },
  fire(from, to, dmg, col, isPl) {
    const sx = from.x + (isPl ? 30 : -25), sy = from.y + rand(-6, 6);
    this.shots.push({ x: sx, y: sy, sx, sy, tx: to.x + rand(-8, 8), ty: to.y + rand(-8, 8), t: 0, dur: 0.35, dmg, col, to, isPl });
    sfx(isPl ? 'shoot' : 'eshoot');
  },
  applyHit(target, dmg, isPl) {
    if (target.dead) return;
    if (Math.random() < target.evade) { this.floatTxt(target.x, target.y - 30, 'ESQUIVA', '#9fb6ff'); return; }
    target.shT = 2.5;
    if (target.sp > 0) {
      const a = Math.min(target.sp, dmg); target.sp -= a; dmg -= a;
      this.parts.burst(target.x, target.y, 6, '#3de8ff', 80, 0.4, 2);
      target.shieldFlash = 0.3; sfx('shield');
    }
    if (dmg > 0) {
      target.hp -= dmg; target.hitT = 0.12;
      this.parts.burst(target.x + rand(-10, 10), target.y + rand(-8, 8), 8, isPl ? '#ffb347' : '#ff934a', 110, 0.5, 2.5);
      sfx('hit');
    }
    this.floatTxt(target.x, target.y - 30, Math.round(dmg > 0 ? dmg : 0) || 'escudo', dmg > 0 ? '#ffffff' : '#3de8ff');
    if (target.hp <= 0) {
      target.dead = true; target.hp = 0;
      this.parts.burst(target.x, target.y, 50, '#ffb347', 260, 1.1, 4);
      this.parts.burst(target.x, target.y, 25, '#ffffff', 180, 0.6, 3);
      sfx('boom'); this.shake = 10;
    }
  },
  floats: [],
  floatTxt(x, y, txt, col) { this.floats.push({ x: x + rand(-15, 15), y, txt, col, life: 0.9 }); },
  update(dt) {
    this.layout();
    this.t += dt;
    const sdt = dt * this.speed;
    this.parts.update(sdt);
    for (const f of this.floats) { f.y -= 40 * sdt; f.life -= sdt; }
    this.floats = this.floats.filter(f => f.life > 0);
    this.shake = Math.max(0, (this.shake || 0) - dt * 25);
    for (const s of this.shots) {
      s.t += sdt;
      const k = Math.min(1, s.t / s.dur);
      s.x = lerp(s.sx, s.tx, k); s.y = lerp(s.sy, s.ty, k);
      if (k >= 1 && !s.done) { s.done = true; this.applyHit(s.to, s.dmg, !s.isPl); }
    }
    this.shots = this.shots.filter(s => !s.done);
    if (this.ended) return;
    const pl = this.pl, alive = this.en.filter(e => !e.dead);
    if (!alive.length) return this.finish(true);
    if (pl.hp <= 0) { pl.dead = true; return this.finish(false); }
    // escudos
    for (const u of [pl, ...alive]) {
      u.shT -= sdt; u.hitT -= sdt; if (u.shieldFlash) u.shieldFlash -= sdt;
      if (u.shT <= 0 && u.spMax > 0) u.sp = Math.min(u.spMax, u.sp + u.spMax * 0.12 * sdt);
    }
    // jugador dispara al más débil
    pl.cd -= sdt;
    if (pl.cd <= 0) {
      const tgt = alive.reduce((a, b) => (b.hp + b.sp < a.hp + a.sp ? b : a));
      const period = 0.7;
      const per = UPG.weapons.dps[S.lv.weapons - 1] * period / pl.guns;
      for (let g = 0; g < pl.guns; g++) setTimeout(() => { if (!this.ended && !tgt.dead) this.fire(pl, tgt, per * rand(0.85, 1.15), '#3de8ff', true); }, g * 90 / this.speed);
      pl.cd = period;
    }
    // drones
    for (const d of this.drones) {
      d.a += sdt * 2; d.cd -= sdt;
      d.x = pl.x + Math.cos(d.a) * 48; d.y = pl.y + Math.sin(d.a) * 30;
      if (d.cd <= 0) { d.cd = 0.8; const tgt = pick(alive); this.fire(d, tgt, 2.5 * 0.8, '#6dffb0', true); }
    }
    // enemigos
    for (const e of alive) {
      e.cd -= sdt;
      if (e.cd <= 0) { const period = rand(0.8, 1.2); this.fire(e, pl, e.dps * period * rand(0.85, 1.15), '#ff4d6d', false); e.cd = period; }
    }
  },
  retreat() {
    if (this.ended) return;
    const chance = clamp(ship.flee * 0.8, 0.1, 0.8);
    if (Math.random() < chance) { toast('¡Retirada exitosa!', 'good'); sfx('warp'); this.finish(null); }
    else { toast('Retirada fallida', 'bad'); this.pl.cd += 1; document.getElementById('btnRetreat').disabled = true; setTimeout(() => { const b = document.getElementById('btnRetreat'); if (b) b.disabled = false; }, 2500); }
  },
  finish(win) {
    this.ended = true;
    S.hull = Math.max(0, Math.round(this.pl.hp));
    setTimeout(() => this.result(win), win === null ? 300 : 1200);
  },
  result(win) {
    const done = this.done;
    const back = () => { setScene(this.prev || MapScene); };
    if (win === true) {
      S.stats.won++;
      const loot = Math.round(this.fleetKeys.reduce((a, k) => a + ENEMIES[k].loot, 0) * rand(0.8, 1.2) * (1 + S.day / 300));
      S.credits += loot; S.stats.earned += loot;
      const military = this.fleetKeys.includes('patrol');
      let salv = '';
      if (!military) {
        const it = pick(['arms', 'tech', 'meds', 'luxury', 'platinum', 'he3']);
        const n = Math.min(cargoFree(), randi(1, 2 + this.fleetKeys.length * 2));
        if (n > 0) { addCargo(it, n); salv = `<br>Rescatas <b>${n} ${ITEMS[it].n}</b> de los restos.`; }
        repChange('piratas', -3, true);
        const near = LOC[S.loc].faction && LOC[S.loc].faction !== 'piratas' ? LOC[S.loc].faction : 'cinturon';
        repChange(near, 1 + this.fleetKeys.length, true);
        for (const c of S.active) if (c.type === 'bounty') { c.progress++; }
        for (const c of [...S.active]) if (c.type === 'bounty' && c.progress >= c.kills) completeContract(c);
      }
      sfx('win');
      addNews('🏆', `Victoria contra ${this.fleetKeys.length} nave${this.fleetKeys.length > 1 ? 's' : ''} ${military ? 'militar' : 'pirata'}${this.fleetKeys.length > 1 ? 'es' : ''}. Botín: ${fmt(loot)} ₵`, '#6dffb0');
      showModal({ icon: '🏆', title: '¡Victoria!', html: `Destruiste la flota enemiga.<br>Botín: <b class="cr">${fmt(loot)} ₵</b>${salv}<br>Casco: ${S.hull}/${ship.hpMax}`,
        buttons: [{ label: 'Continuar', cls: 'primary', fn: () => { back(); updateHUD(); done && done(); } }] });
    } else if (win === null) {
      back(); done && done();
    } else {
      S.stats.lost++;
      if (MapScene.travel) { MapScene.travel = null; document.getElementById('travelBanner').classList.add('hidden'); }
      setScene(MapScene);
      towShip('Tu nave quedó inutilizada en combate.');
    }
    save();
  },
  draw(ctx) {
    this.layout();
    const t = this.t;
    ctx.save();
    if (this.shake) ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
    drawSpaceBg(ctx, W, H, t * 40, 0, t, '#1c0b1e');
    const bl = LOC[(this.prev === MineScene && MineScene.loc) ? MineScene.loc.id : S.loc];
    const bgl = bl.parent ? LOC[bl.parent] : bl.follow ? LOC[bl.follow] : bl;
    if (bgl.id !== 'kuiper') { const pr = Math.min(W, H) * 0.55; drawPlanet(ctx, W * 0.5, H + pr * 0.55, pr, bgl, -Math.PI / 2, t); }
    // líneas de velocidad
    ctx.strokeStyle = 'rgba(160,190,255,0.15)'; ctx.lineWidth = 1;
    for (let i = 0; i < 30; i++) {
      const y = (i * 97.3) % H, x = W - ((t * 400 + i * 173) % (W + 200));
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 60, y); ctx.stroke();
    }
    const pl = this.pl;
    const sc = W < 700 ? 1 : 1.7;
    if (!pl.dead) {
      drawPlayerShip(ctx, S.lv, pl.x, pl.y + Math.sin(t * 2) * 4, 0, sc * (1.4 - S.lv.hull * 0.08), 0.7, t);
      if (pl.shieldFlash > 0) { ctx.strokeStyle = `rgba(61,232,255,${pl.shieldFlash * 3})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(pl.x, pl.y, 50 * sc, 0, TAU); ctx.stroke(); }
      this.bars(ctx, pl.x, pl.y - 62 * sc, pl);
    }
    for (const d of this.drones) if (d.x) { glow(ctx, d.x, d.y, 9, '#6dffb088', 0.8); ctx.fillStyle = '#d4dcea'; ctx.beginPath(); ctx.arc(d.x, d.y, 3.5, 0, TAU); ctx.fill(); }
    for (const e of this.en) {
      if (e.dead) continue;
      const y = e.y + Math.sin(t * 2 + e.bob) * 5;
      drawEnemyShip(ctx, e.k, e.x, y, Math.PI, sc, t);
      if (e.hitT > 0) glow(ctx, e.x, y, 30, '#ffffff', 0.4);
      if (e.shieldFlash > 0) { ctx.strokeStyle = `rgba(255,120,150,${e.shieldFlash * 3})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, y, 30 * sc * ENEMIES[e.k].size, 0, TAU); ctx.stroke(); }
      this.bars(ctx, e.x, y - 34 * sc * ENEMIES[e.k].size, e);
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const s of this.shots) {
      const a = Math.atan2(s.ty - s.sy, s.tx - s.sx);
      ctx.strokeStyle = s.col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - Math.cos(a) * 16, s.y - Math.sin(a) * 16); ctx.stroke();
      glow(ctx, s.x, s.y, 8, s.col, 0.8);
    }
    ctx.globalCompositeOperation = 'source-over';
    this.parts.draw(ctx);
    ctx.font = '700 15px Rajdhani, sans-serif'; ctx.textAlign = 'center';
    for (const f of this.floats) { ctx.globalAlpha = Math.min(1, f.life * 2); ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y); }
    ctx.globalAlpha = 1;
    ctx.restore();
  },
  bars(ctx, x, y, u) {
    const w = 60;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - w / 2 - 1, y - 1, w + 2, 10);
    ctx.fillStyle = u === this.pl ? '#6dffb0' : '#ff4d6d'; ctx.fillRect(x - w / 2, y, w * clamp(u.hp / u.max, 0, 1), 4);
    if (u.spMax > 0) { ctx.fillStyle = '#3de8ff'; ctx.fillRect(x - w / 2, y + 5, w * clamp(u.sp / u.spMax, 0, 1), 3); }
    if (u.n) { ctx.font = '600 11px Rajdhani, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,200,210,0.85)'; ctx.fillText(u.n, x, y - 4); }
  },
};
function startBattle(fleet, enemyFirst, done) { BattleScene.start(fleet, enemyFirst, done); }

// ---- ui.js ----
'use strict';
// ============ INTERFAZ (DOM) ============
const $ = id => document.getElementById(id);
let modalOpen = false;
let stationTab = 'market';

function toast(msg, cls) {
  const el = document.createElement('div');
  el.className = 'toast ' + (cls || '');
  el.innerHTML = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.classList.add('out'), 2600);
  setTimeout(() => el.remove(), 3100);
}

function showModal(o) {
  modalOpen = true;
  const m = $('modal');
  m.innerHTML = `<div class="mbox ${o.danger ? 'danger' : ''}">
    ${o.icon ? `<div class="micon">${o.icon}</div>` : ''}
    <h2>${o.title}</h2><div class="mbody">${o.html || ''}</div>
    <div class="mbtns"></div></div>`;
  const bx = m.querySelector('.mbtns');
  o.buttons.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls || '');
    el.innerHTML = b.label; el.disabled = !!b.disabled;
    el.onclick = () => { sfx('click'); closeModal(); b.fn && b.fn(); updateHUD(); };
    bx.appendChild(el);
  });
  m.classList.remove('hidden');
}
function closeModal() { modalOpen = false; $('modal').classList.add('hidden'); }

function showEventBanner(ev) {
  const b = $('eventBanner');
  b.innerHTML = `<span class="eicon">${ev.icon}</span><div><small>NOTICIAS DEL SISTEMA · DÍA ${S.day}</small><b>${ev.title}</b><p>${ev.text}</p></div>`;
  b.classList.add('show');
  sfx('event');
  clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('show'), 6500);
}

function updateTicker() {
  const el = $('tickerIn'); if (!el || !S) return;
  const items = S.news.slice(0, 8).map(n => `<span><i>DÍA ${n.day}</i> ${n.icon} ${n.html.replace(/<[^>]+>/g, '')}</span>`);
  el.innerHTML = items.join('<span class="sep">◆</span>');
}

// ---------- HUD ----------
function updateHUD() {
  if (!S) return;
  $('hCr').textContent = fmt(S.credits) + ' ₵';
  $('hDay').textContent = S.day;
  $('hFuel').style.width = (S.fuel / ship.fuelMax * 100) + '%';
  $('hFuelT').textContent = `${Math.floor(S.fuel)}/${ship.fuelMax}`;
  $('hHull').style.width = (S.hull / ship.hpMax * 100) + '%';
  $('hHullT').textContent = `${Math.ceil(S.hull)}/${ship.hpMax}`;
  $('hCargo').style.width = (cargoUsed() / ship.cargoMax * 100) + '%';
  $('hCargoT').textContent = `${cargoUsed()}/${ship.cargoMax}`;
  const inf = influence();
  $('hInfl').textContent = inf;
  $('hRank').textContent = rankName(inf);
  $('hFuel').parentElement.classList.toggle('low', S.fuel < ship.fuelMax * 0.2);
  $('hHull').parentElement.classList.toggle('low', S.hull < ship.hpMax * 0.3);
  $('hCargo').parentElement.classList.toggle('full', cargoFree() <= 0);
  const o = TUTORIAL[S.tut];
  $('objective').innerHTML = o && !S.won ? `<small>OBJETIVO ${S.tut + 1}/${TUTORIAL.length}</small><b>${o.t}</b><span>${o.d}</span>${o.r ? `<em>Recompensa: ${fmt(o.r)} ₵</em>` : `<em>Influencia: ${inf}/100</em>`}` : `<small>SOBERANÍA SOLAR</small><b>Influencia ${inf}</b><span>Sigue expandiendo tu imperio.</span>`;
  if (!S.won && inf >= 100) victory();
}
function checkTut() {
  if (!S) return;
  const c = [
    () => S.loc === 'luna',
    () => S.stats.mined >= 10,
    () => S.stats.traded > 0,
    () => Object.values(S.lv).reduce((a, b) => a + b, 0) > 8,
    () => S.active.length > 0 || S.stats.contracts > 0,
    () => S.loc === 'ceres',
    () => Object.keys(S.invest).length > 0,
    () => influence() >= 100,
  ][S.tut];
  if (c && c()) advanceTut();
}
function advanceTut() {
  const o = TUTORIAL[S.tut];
  if (!o) return;
  if (o.r) { S.credits += o.r; toast(`✔ Objetivo cumplido: ${o.t} (+${fmt(o.r)} ₵)`, 'good'); sfx('cash'); }
  S.tut++;
  const el = $('objective'); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  updateHUD();
  setTimeout(checkTut, 400);
}
function victory() {
  S.won = true; save();
  sfx('win');
  showModal({ icon: '👑', title: '¡Dominas el Sistema Solar!', html: `En <b>${S.day} días</b> pasaste de minar rocas en la Luna a ser la fuerza económica más influyente del sistema.<br><br>
    Mineral extraído: <b>${fmt(S.stats.mined)}</b><br>Ganancias totales: <b>${fmt(S.stats.earned)} ₵</b><br>Batallas ganadas: <b>${S.stats.won}</b><br>Contratos: <b>${S.stats.contracts}</b><br><br>Puedes seguir jugando y construir tu imperio.`,
    buttons: [{ label: 'Seguir jugando', cls: 'primary', fn: () => {} }] });
}

// ---------- Panel de ubicación (mapa) ----------
function selectLoc(id) {
  MapScene.sel = id;
  const l = LOC[id];
  const here = id === S.loc;
  const p = $('locPanel');
  const fac = l.faction ? `<span class="chip" style="--c:${FACTIONS[l.faction].c}">${FACTIONS[l.faction].n}</span>` : '<span class="chip">Sin gobierno</span>';
  const dg = locDanger(id);
  const dtxt = dg < 0.1 ? ['Seguro', 'good'] : dg < 0.3 ? ['Moderado', 'warn'] : dg < 0.5 ? ['Peligroso', 'bad'] : ['Mortal', 'bad'];
  const evs = S.events.filter(e => e.locs && e.locs.includes(id));
  let html = `<div class="lp-head"><div><h3>${l.n}</h3><small>${[l.station, l.field && l.field.n].filter(Boolean).join(' · ')}</small></div><button class="x" onclick="hideLocPanel()">✕</button></div>
    <div class="chips">${fac}<span class="chip ${dtxt[1]}">Riesgo: ${dtxt[0]}</span>${l.field ? '<span class="chip ore">⛏ Minería</span>' : ''}${l.station ? '<span class="chip">🛰 Estación</span>' : ''}${l.yard ? `<span class="chip">🔧 Astillero Nv.${l.yard}</span>` : ''}</div>
    <p class="desc">${l.desc}</p>`;
  if (evs.length) html += `<div class="evs">${evs.map(e => `<div class="ev">${e.icon} <b>${e.title}</b> <small>(${e.end - S.day} días)</small></div>`).join('')}</div>`;
  if (l.field) {
    const ores = Object.keys(l.field.ores).sort((a, b) => l.field.ores[b] - l.field.ores[a]);
    html += `<div class="sub">Minerales</div><div class="ores">${ores.map(o => `<span class="ore" style="--c:${ITEMS[o].c}">${ITEMS[o].n}</span>`).join('')}</div>`;
    if (l.field.hazard === 'heat') html += `<div class="warnline">🔥 Calor extremo: daña el casco sin escudos.</div>`;
  }
  if (l.market && !here) {
    let val = 0; for (const k in S.cargo) { const sp = sellPrice(id, k); if (sp) val += sp * S.cargo[k]; }
    const hot = Object.keys(l.market).map(k => ({ k, m: basePrice(id, k) / ITEMS[k].b })).filter(x => x.m >= 1.45).sort((a, b) => b.m - a.m).slice(0, 4);
    const cheap = Object.keys(l.market).filter(k => buyPrice(id, k) != null).map(k => ({ k, m: basePrice(id, k) / ITEMS[k].b })).sort((a, b) => a.m - b.m).slice(0, 3);
    if (cargoUsed()) html += `<div class="sub">Tu carga aquí vale ≈ <b class="cr">${fmt(val)} ₵</b></div>`;
    if (hot.length) html += `<div class="sub">Paga bien</div><div class="ores">${hot.map(x => `<span class="ore" style="--c:${ITEMS[x.k].c}">${ITEMS[x.k].n} <b>×${x.m.toFixed(1)}</b></span>`).join('')}</div>`;
    if (cheap.length) html += `<div class="sub">Vende barato</div><div class="ores">${cheap.map(x => `<span class="ore" style="--c:${ITEMS[x.k].c}">${ITEMS[x.k].n} <b>×${x.m.toFixed(1)}</b></span>`).join('')}</div>`;
  }
  const deliv = S.active.filter(c => c.type === 'deliver' && c.to === id);
  if (deliv.length) html += `<div class="sub">Contratos con destino aquí: ${deliv.length}</div>`;
  if (here) {
    html += `<div class="lp-actions">`;
    if (l.station) html += `<button class="btn primary big" onclick="openStation()">🛰 Atracar en ${l.station}</button>`;
    if (l.field) html += `<button class="btn ore big" onclick="enterMine()">⛏ Minar en ${l.field.n}</button>`;
    html += `</div><div class="here">📍 Estás aquí</div>`;
  } else {
    const info = travelInfo(id);
    const ok = info.fuel <= S.fuel;
    html += `<div class="travel">
      <div><small>Distancia</small><b>${(info.d / 100).toFixed(2)} UA</b></div>
      <div><small>Combustible</small><b class="${ok ? '' : 'badt'}">${info.fuel} / ${Math.floor(S.fuel)}</b></div>
      <div><small>Duración</small><b>${info.days} día${info.days > 1 ? 's' : ''}</b></div>
      <div><small>Emboscada</small><b class="${info.danger > 0.3 ? 'badt' : ''}">${Math.round(info.danger * 100)}%</b></div></div>
      <button class="btn primary big" ${ok ? '' : 'disabled'} onclick="MapScene.startTravel('${id}')">${ok ? '🚀 VIAJAR' : '⛽ Combustible insuficiente'}</button>`;
  }
  p.innerHTML = html;
  p.classList.remove('hidden');
}
function hideLocPanel() { $('locPanel').classList.add('hidden'); MapScene.sel = null; }
function enterMine() { sfx('click'); if (S.tut === 0) checkTut(); setScene(MineScene, S.loc); }

function showMapUI(on) {

function openSheet(title, html, cls) {
  modalOpen = true;
  const s = $('sheet');
  s.className = 'sheet ' + (cls || '');
  s.innerHTML = `<div class="sh-head"><h2>${title}</h2><button class="x" onclick="closeSheet()">✕</button></div><div class="sh-body">${html}</div>`;
  s.classList.remove('hidden');
}
function closeSheet() {
  $('sheet').classList.add('hidden'); modalOpen = false; save(); updateHUD();
  if (scene === MapScene && !MapScene.travel) selectLoc(S.loc);
}

// ---------- Estación ----------
function openStation(tab) {
  if (tab) stationTab = tab;
  const l = LOC[S.loc];
  sfx('click');
  const tabs = [['market', '📦 Mercado'], ['yard', '🔧 Astillero'], ['services', '⛽ Servicios'], ['contracts', '📜 Contratos'], ['invest', '🏛 Inversión']];
  const rep = l.faction ? S.rep[l.faction] : 0;
  const html = `<div class="st-head">
      <div class="st-fac" style="--c:${l.faction ? FACTIONS[l.faction].c : '#fff'}">${l.faction ? FACTIONS[l.faction].n : ''} · Reputación <b>${Math.round(rep)}</b></div>
      <div class="st-cr">${fmt(S.credits)} ₵ · Bodega ${cargoUsed()}/${ship.cargoMax}</div></div>
    <div class="tabs">${tabs.map(([k, n]) => `<button class="tab ${k === stationTab ? 'on' : ''}" onclick="openStation('${k}')">${n}${k === 'contracts' && S.active.some(canDeliver) ? ' <i class="dot"></i>' : ''}</button>`).join('')}</div>
    <div class="tabbody">${stationBody(stationTab)}</div>`;
  const keep = $('sheet').querySelector('.tabbody');
  const sc = keep ? keep.scrollTop : 0;
  openSheet(`🛰 ${l.station} <small>${l.n}</small>`, html, 'station');
  const nb = $('sheet').querySelector('.tabbody'); if (nb) nb.scrollTop = sc;
  if (stationTab === 'yard') setTimeout(drawYardPreview, 0);
  updateHUD();
}
function stationBody(tab) {
  const id = S.loc, l = LOC[id];
  if (tab === 'market') {
    if (marketClosed(id)) return `<div class="empty">✊ Mercado cerrado por huelga. Vuelve en unos días.</div>`;
    const keys = ITEM_KEYS.filter(k => l.market[k] != null || S.cargo[k]);
    const oreCargo = ORES.some(k => S.cargo[k] && sellPrice(id, k));
    let h = `<div class="mkt-actions"><button class="btn primary" ${oreCargo ? '' : 'disabled'} onclick="sellAllOre()">Vender todo el mineral</button><span class="hint">Vender muchas unidades baja el precio; se recupera con los días.</span></div>
      <div class="mkt"><div class="mrow mh"><span>Producto</span><span>Venta</span><span>Tienes</span><span></span><span>Compra</span><span></span></div>`;
    for (const k of keys) {
      const sp = sellPrice(id, k), bp = buyPrice(id, k), have = S.cargo[k] || 0;
      const ratio = sp ? sp / ITEMS[k].b : 0;
      const trend = !sp ? '' : ratio > 1.4 ? '<i class="up">▲▲</i>' : ratio > 1.1 ? '<i class="up">▲</i>' : ratio < 0.75 ? '<i class="dn">▼▼</i>' : ratio < 0.95 ? '<i class="dn">▼</i>' : '';
      const ev = eventPriceMult(id, k) !== 1 ? '<i class="evi">⚡</i>' : '';
      h += `<div class="mrow">
        <span class="mname c-n"><i class="sw" style="background:${ITEMS[k].c}"></i>${ITEMS[k].n}${ev}${ITEMS[k].ore ? '<small>mineral</small>' : ''}</span>
        <span class="price c-sp">${sp ? fmt(sp) + ' ₵ ' + trend : '<small class="dim">no compran</small>'}</span>
        <span class="have c-h">${have || '<small class="dim">0</small>'}</span>
        <span class="bb c-sb">${sp && have ? `<button onclick="mktSell('${k}',1)">1</button><button onclick="mktSell('${k}',10)">10</button><button class="all" onclick="mktSell('${k}',9999)">Todo</button>` : ''}</span>
        <span class="price c-bp">${bp ? fmt(bp) + ' ₵' : '<small class="dim">—</small>'}</span>
        <span class="bb c-bb">${bp ? `<button onclick="mktBuy('${k}',1)">1</button><button onclick="mktBuy('${k}',10)">10</button><button class="all" onclick="mktBuy('${k}',9999)">Máx</button>` : ''}</span></div>`;
    }
    return h + '</div>';
  }
  if (tab === 'yard') {
    if (!l.yard) return `<div class="empty">Esta estación no tiene astillero.</div>`;
    let h = `<div class="yard-top"><canvas id="yardShip" width="360" height="170"></canvas><div class="yard-stats">
      <h4>${S.shipName} <small>clase ${UPG.hull.names[S.lv.hull - 1]}</small></h4>
      <div>Bodega <b>${ship.cargoMax}</b> · Casco <b>${ship.hpMax}</b> · Tanque <b>${ship.fuelMax}</b></div>
      <div>Láser <b>${ship.laserDps}</b> dps · Armas <b>${ship.weaponDps.toFixed(0)}</b> dps · Escudo <b>${ship.shieldMax}</b></div>
      <div>Poder de combate <b>${ship.power.toFixed(1)}</b> · Astillero nivel máx. <b>${l.yard}</b></div></div></div><div class="upgs">`;
    for (const k of UPG_KEYS) {
      const u = UPG[k], lv = S.lv[k];
      const max = (l.yardMax && l.yardMax[k]) || l.yard;
      const next = lv < 5 ? lv + 1 : null;
      const cost = next ? u.cost[next - 1] : 0;
      const can = next && next <= max && S.credits >= cost;
      const stat = upgStat(k, next || lv);
      h += `<div class="upg ${lv >= 5 ? 'maxed' : ''}">
        <div class="uh"><span class="uicon">${u.icon}</span><b>${u.n}</b><span class="pips">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= lv ? 'on' : ''}"></i>`).join('')}</span></div>
        <div class="un">${u.names[lv - 1]}${next ? ` → <b>${u.names[next - 1]}</b>` : ' · MÁXIMO'}</div>
        <div class="ud">${stat}</div>
        ${next ? `<button class="btn ${can ? 'primary' : ''}" ${can ? '' : 'disabled'} onclick="buyUpg('${k}')">${next > max ? `Requiere astillero Nv.${next}` : `Mejorar · ${fmt(cost)} ₵`}</button>` : ''}
      </div>`;
    }
    return h + '</div>';
  }
  if (tab === 'services') {
    const fp = fuelPrice(id), need = Math.ceil(ship.fuelMax - S.fuel), fcost = Math.ceil(need * fp);
    const hneed = Math.ceil(ship.hpMax - S.hull), rp = l.repair, hcost = Math.ceil(hneed * rp);
    return `<div class="svc">
      <div class="svcard"><h4>⛽ Combustible</h4><div class="meter big"><i style="width:${S.fuel / ship.fuelMax * 100}%"></i></div>
        <p>${Math.floor(S.fuel)} / ${ship.fuelMax} · <b>${fp} ₵</b> por unidad</p>
        <button class="btn primary" ${need > 0 && S.credits >= 1 ? '' : 'disabled'} onclick="refuel(9999)">Llenar tanque (${fmt(Math.min(fcost, S.credits))} ₵)</button>
        <button class="btn" ${need > 0 ? '' : 'disabled'} onclick="refuel(10)">+10</button></div>
      <div class="svcard"><h4>🔧 Reparación</h4><div class="meter big hp"><i style="width:${S.hull / ship.hpMax * 100}%"></i></div>
        <p>${Math.ceil(S.hull)} / ${ship.hpMax} · <b>${rp} ₵</b> por punto</p>
        <button class="btn primary" ${hneed > 0 ? '' : 'disabled'} onclick="repair()">Reparar todo (${fmt(Math.min(hcost, S.credits))} ₵)</button></div>
    </div>`;
  }
  if (tab === 'contracts') {
    const avail = S.contracts[id] || [];
    let h = '<div class="sub">Tus contratos activos</div>';
    if (!S.active.length) h += '<div class="empty small">Ninguno. Acepta uno abajo.</div>';
    for (const c of S.active) {
      const dl = c.deadline - S.day;
      h += `<div class="contract ${canDeliver(c) ? 'ready' : ''}"><div>${c.urgent ? '<span class="chip bad">URGENTE</span> ' : ''}${contractText(c)}<small>Recompensa ${fmt(c.reward)} ₵ · +${c.rep} rep. · vence en ${dl} día${dl !== 1 ? 's' : ''}${c.type === 'deliver' ? ` · tienes ${S.cargo[c.item] || 0}/${c.qty}` : ''}</small></div>
        ${canDeliver(c) ? `<button class="btn primary" onclick="deliver('${c.id}')">Entregar</button>` : ''}</div>`;
    }
    h += `<div class="sub">Disponibles en ${l.station}</div>`;
    if (!avail.length) h += '<div class="empty small">No hay contratos nuevos. Vuelve en unos días.</div>';
    for (const c of avail) {
      h += `<div class="contract"><div>${c.urgent ? '<span class="chip bad">URGENTE</span> ' : ''}${contractText(c)}<small>Recompensa <b class="cr">${fmt(c.reward)} ₵</b> · +${c.rep} rep. ${c.faction ? FACTIONS[c.faction].n : ''} · plazo ${c.days} días</small></div>
        <button class="btn" onclick="acceptContract('${id}','${c.id}');openStation()">Aceptar</button></div>`;
    }
    return h;
  }
  if (tab === 'invest') {
    const lv = S.invest[id] || 0;
    const cost = investCost(id);
    const needRep = lv < 3 ? INVEST.rep[lv] : 0;
    const rep = l.faction ? S.rep[l.faction] : 0;
    const okRep = rep >= needRep;
    let h = `<div class="inv"><p>Invierte en la infraestructura de <b>${l.station}</b>. Cada nivel te da <b>ingresos diarios</b> e <b>influencia</b> permanente en el sistema.</p><div class="invlv">`;
    for (let i = 0; i < 3; i++) {
      h += `<div class="ivc ${i < lv ? 'own' : i === lv ? 'next' : ''}"><b>${INVEST.names[i]}</b><small>+${INVEST.income[i]} ₵/día</small><small>+${INVEST.infl[i]} influencia</small><small>Rep. ${INVEST.rep[i]}</small><em>${i < lv ? '✔ TUYO' : fmt(Math.round(INVEST.cost[i] * (l.black ? 1.3 : 1))) + ' ₵'}</em></div>`;
    }
    h += '</div>';
    if (cost != null) h += `<button class="btn primary big" ${S.credits >= cost && okRep ? '' : 'disabled'} onclick="buyInvest()">${okRep ? `Invertir · ${fmt(cost)} ₵` : `Requiere reputación ${needRep} con ${FACTIONS[l.faction].n} (tienes ${Math.round(rep)})`}</button>`;
    else h += '<div class="empty small">Controlas el consorcio de esta estación. 👑</div>';
    h += `<p class="hint">Ingresos totales: <b>${fmt(dailyIncome())} ₵/día</b>. Sube reputación con contratos, ayuda humanitaria en crisis y combatiendo piratas.</p></div>`;
    return h;
  }
  return '';
}
function upgStat(k, lv) {
  const u = UPG[k], i = lv - 1;
  switch (k) {
    case 'hull': return `Bodega ${u.cargo[i]} · Casco ${u.hp[i]} · Masa ×${u.mass[i]}`;
    case 'laser': return `${u.dps[i]} daño/s · alcance ${u.range[i]}`;
    case 'engine': return `Velocidad ×${u.speed[i]} · Eficiencia ×${u.eff[i]} · Huida ${Math.round(u.flee[i] * 100)}%`;
    case 'tank': return `${u.fuel[i]} unidades`;
    case 'shield': return u.sp[i] ? `${u.sp[i]} puntos de escudo` : 'Sin escudos';
    case 'weapons': return `${u.dps[i]} daño/s en combate`;
    case 'drones': return `Imán ${u.magnet[i]} · ${u.count[i]} drone${u.count[i] !== 1 ? 's' : ''} recolector${u.count[i] !== 1 ? 'es' : ''}`;
    case 'scanner': return `Evita emboscadas ${Math.round(u.avoid[i] * 100)}%${i >= 1 ? ' · revela vetas ricas' : ''}`;
  }
}
function drawYardPreview() {
  const c = $('yardShip'); if (!c) return;
  const x = c.getContext('2d');
  x.clearRect(0, 0, c.width, c.height);
  const g = x.createRadialGradient(180, 85, 10, 180, 85, 180);
  g.addColorStop(0, '#16224a'); g.addColorStop(1, '#070b1c');
  x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
  x.strokeStyle = 'rgba(61,232,255,0.12)';
  for (let i = 0; i < c.width; i += 20) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, c.height); x.stroke(); }
  for (let i = 0; i < c.height; i += 20) { x.beginPath(); x.moveTo(0, i); x.lineTo(c.width, i); x.stroke(); }
  drawPlayerShip(x, S.lv, 190, 85, 0, 2.6 - S.lv.hull * 0.28, 0.6, performance.now() / 1000);
}
function mktSell(k, n) { if (marketClosed(S.loc)) return; const got = doSell(S.loc, k, n); if (got) { sfx('cash'); toast(`+${fmt(got)} ₵`, 'good'); } checkTut(); openStation(); }
function mktBuy(k, n) { if (marketClosed(S.loc)) return; if (cargoFree() <= 0) { toast('Bodega llena', 'bad'); return; } const b = doBuy(S.loc, k, n); if (b) sfx('click'); else toast('Créditos insuficientes', 'bad'); openStation(); }
function sellAllOre() {
  let total = 0;
  for (const k of ORES) if (S.cargo[k] && sellPrice(S.loc, k)) total += doSell(S.loc, k, S.cargo[k]);
  if (total) { sfx('cash'); toast(`Vendiste mineral por ${fmt(total)} ₵`, 'good'); }
  checkTut(); openStation();
}
function buyUpg(k) {
  const lv = S.lv[k]; const cost = UPG[k].cost[lv];
  if (S.credits < cost) return;
  S.credits -= cost; S.lv[k]++;
  if (k === 'hull') S.hull = ship.hpMax;
  if (k === 'tank') S.fuel = Math.min(S.fuel, ship.fuelMax);
  sfx('upgrade');
  toast(`${UPG[k].n}: ${UPG[k].names[S.lv[k] - 1]} instalado`, 'good');
  addNews('🔧', `Mejora instalada: ${UPG[k].n} ${UPG[k].names[S.lv[k] - 1]}`, '#3de8ff');
  checkTut(); openStation();
}
function refuel(n) {
  const fp = fuelPrice(S.loc);
  const can = Math.min(n, ship.fuelMax - S.fuel, Math.floor(S.credits / fp));
  if (can <= 0) return;
  S.fuel += can; S.credits -= Math.ceil(can * fp);
  sfx('click'); openStation();
}
function repair() {
  const rp = LOC[S.loc].repair;
  const can = Math.min(ship.hpMax - S.hull, Math.floor(S.credits / rp));
  if (can <= 0) return;
  S.hull += can; S.credits -= Math.ceil(can * rp);
  sfx('upgrade'); openStation();
}
function deliver(cid) { const c = S.active.find(x => x.id === cid); if (c && canDeliver(c)) completeContract(c); checkTut(); openStation(); }
function buyInvest() {
  const id = S.loc, cost = investCost(id);
  if (cost == null || S.credits < cost) return;
  S.credits -= cost; S.invest[id] = (S.invest[id] || 0) + 1;
  const l = LOC[id]; if (l.faction) repChange(l.faction, 5);
  sfx('win');
  addNews('🏛️', `Adquieres ${INVEST.names[S.invest[id] - 1]} en ${l.station}. Tu influencia crece.`, '#ffc857');
  toast(`Inversión completada: +${INVEST.infl[S.invest[id] - 1]} influencia`, 'good');
  checkTut(); openStation();
}

function openHelp() {
  openSheet('📖 Cómo jugar', `<div class="help">
    <h4>🎯 Meta</h4><p>Empiezas con una nave pequeña y 600 créditos. Mina, comercia y combate para ganar <b>100 de influencia</b> y dominar el Sistema Solar.</p>

    <h4>⛏ Minería</h4><p><b>WASD / flechas</b> para moverte, <b>mantén el clic</b> para disparar el láser (o <b>Espacio</b>). Rompe asteroides grandes en pedazos y recoge el mineral. En móvil: joystick a la izquierda y botón LÁSER con autoapuntado. Las vetas brillantes dan doble mineral.</p>
    <h4>📦 Comercio</h4><p>Cada estación paga distinto. ▲ significa que el precio está alto. Compra barato en un lugar y vende caro en otro. Vender mucho satura el mercado.</p>
    <h4>☠ Piratas</h4><p>Las zonas lejanas son más ricas y más peligrosas. El combate es automático: depende de tu casco, escudos, armas y drones. Puedes huir, sobornar o pelear.</p>
    <h4>📰 Eventos</h4><p>Guerras, pandemias, hambrunas y booms cambian los precios. Aprovéchalos: llevar medicinas a una pandemia paga mucho y da reputación.</p>
    <h4>🏛 Influencia</h4><p>Invierte en estaciones (necesitas reputación con su facción) para ganar ingresos diarios e influencia.</p></div>`);
}

// ---- main.js ----
'use strict';
// ============ MOTOR PRINCIPAL ============
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let scene = null;
const keys = new Set();
const mouse = { x: 0, y: 0, down: false, onUI: false };
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
let touchFire = false;
const joy = { active: false, dx: 0, dy: 0, id: null, ox: 0, oy: 0 };

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
window.addEventListener('resize', resize);
resize();

function setScene(sc, arg) {
  if (scene && scene.exit) scene.exit();
  scene = sc;
  if (sc && sc.enter) sc.enter(arg);
  mouse.down = false; touchFire = false;
}

// ---------- entrada ----------
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  keys.add(e.code);
  audioInit();
  if (e.code === 'Space' && scene === MineScene) e.preventDefault();
  if (e.code === 'Escape') {
    if (!$('sheet').classList.contains('hidden')) closeSheet();
    else if (scene === MineScene && !modalOpen) MineScene.leave();
  }
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); mouse.down = false; });

canvas.addEventListener('mousedown', e => { audioInit(); mouse.down = true; mouse.onUI = false; mouse.x = e.clientX; mouse.y = e.clientY; if (scene && scene.onDown && !modalOpen) scene.onDown(e.clientX, e.clientY); });
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.onUI = e.target !== canvas; if (scene && scene.onMove && !modalOpen) scene.onMove(e.clientX, e.clientY, mouse.down); });
window.addEventListener('mouseup', e => { if (mouse.down && scene && scene.onUp && !modalOpen) scene.onUp(e.clientX, e.clientY); mouse.down = false; });
canvas.addEventListener('wheel', e => { e.preventDefault(); if (scene && scene.onWheel && !modalOpen) scene.onWheel(e.deltaY, e.clientX, e.clientY); }, { passive: false });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// táctil en canvas (mapa: arrastrar/pellizcar)
let pinch = null;
canvas.addEventListener('touchstart', e => {
  audioInit();
  if (scene === MineScene) return;
  e.preventDefault();
  if (e.touches.length === 2) {
    const [a, b] = e.touches;
    pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) };
    if (scene.drag) scene.drag.moved = true;
  } else if (e.touches.length === 1 && scene && scene.onDown && !modalOpen) {
    const t = e.touches[0]; mouse.down = true; scene.onDown(t.clientX, t.clientY);
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (scene === MineScene) return;
  e.preventDefault();
  if (e.touches.length === 2 && pinch && scene.onPinch) {
    const [a, b] = e.touches;
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    scene.onPinch(d / pinch.d, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
    pinch.d = d;
  } else if (e.touches.length === 1 && scene && scene.onMove) {
    const t = e.touches[0]; scene.onMove(t.clientX, t.clientY, true);
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  if (scene === MineScene) return;
  e.preventDefault();
  if (e.touches.length === 0) {
    const t = e.changedTouches[0];
    if (!pinch && scene && scene.onUp && !modalOpen) scene.onUp(t.clientX, t.clientY);
    pinch = null; mouse.down = false;
  }
}, { passive: false });

// joystick + botón láser (minería en móvil)
function setupTouchControls() {
  const zone = $('joyZone'), knob = $('joyKnob'), base = $('joyBase'), fire = $('fireBtn');
  zone.addEventListener('touchstart', e => {
    e.preventDefault(); audioInit();
    const t = e.changedTouches[0];
    joy.id = t.identifier; joy.active = true; joy.ox = t.clientX; joy.oy = t.clientY;
    base.style.left = (t.clientX - 55) + 'px'; base.style.top = (t.clientY - 55) + 'px'; base.classList.add('on');
    knob.style.transform = 'translate(0,0)';
  }, { passive: false });
  zone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === joy.id) {
      let dx = t.clientX - joy.ox, dy = t.clientY - joy.oy;
      const l = Math.hypot(dx, dy), m = 45;
      if (l > m) { dx *= m / l; dy *= m / l; }
      joy.dx = dx / m; joy.dy = dy / m;
      knob.style.transform = `translate(${dx}px,${dy}px)`;
    }
  }, { passive: false });
  const end = e => { for (const t of e.changedTouches) if (t.identifier === joy.id) { joy.active = false; joy.dx = joy.dy = 0; base.classList.remove('on'); } };
  zone.addEventListener('touchend', end); zone.addEventListener('touchcancel', end);
  fire.addEventListener('touchstart', e => { e.preventDefault(); touchFire = true; fire.classList.add('on'); }, { passive: false });
  const fe = e => { e.preventDefault(); touchFire = false; fire.classList.remove('on'); };
  fire.addEventListener('touchend', fe); fire.addEventListener('touchcancel', fe);
}

// ---------- bucle ----------
let last = performance.now(), hudT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (scene) {
    if (!modalOpen || scene === BattleScene || (scene === MapScene && !MapScene.travel)) {
      if (!(modalOpen && scene === MineScene)) scene.update(dt);
    } else if (scene === MapScene) MapScene.t += dt;
    scene.draw(ctx);
  }
  hudT += dt;
  if (hudT > 0.3 && S && scene !== TitleScene) { hudT = 0; updateHUD(); }
  requestAnimationFrame(frame);
}

// ---------- pantalla de título ----------
const TitleScene = {
  t: 0,
  enter() { $('title').classList.remove('hidden'); $('hud').classList.add('hidden'); $('cont').classList.toggle('hidden', !hasSave()); },
  exit() { $('title').classList.add('hidden'); $('hud').classList.remove('hidden'); },
  update(dt) { this.t += dt; },
  draw(ctx) {
    const t = this.t;
    drawSpaceBg(ctx, W, H, t * 8, t * 3, t);
    const cx = W * 0.5, cy = H * 0.55, z = Math.min(W, H) / 1250;
    drawSun(ctx, cx, cy, 16 * z * 2, t);
    const day = t * 6;
    for (const l of LOCS) {
      if (l.parent || l.follow) continue;
      ctx.strokeStyle = 'rgba(120,160,255,0.1)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(cx, cy, l.r * z * 1.7, l.r * z * 0.75, 0, 0, TAU); ctx.stroke();
      const a = l.a0 + day / l.period * TAU * 3;
      const px = cx + Math.cos(a) * l.r * z * 1.7, py = cy + Math.sin(a) * l.r * z * 0.75;
      if (l.id === 'kuiper') continue;
      drawPlanet(ctx, px, py, Math.max(3, l.size * z * 2.2), l, Math.atan2(cy - py, cx - px), t);
    }
    // nave que cruza
    const sx = ((t * 70) % (W + 400)) - 200, sy = H * 0.32 + Math.sin(t * 0.8) * 20;
    drawPlayerShip(ctx, { hull: 3, engine: 4, weapons: 2, laser: 3 }, sx, sy, 0.05, 1.3, 1, t);
  },
};

function startGame(cont) {
  audioInit();
  if (cont) S = loadSave();
  if (!S) { newGame(); save(); }
  setScene(MapScene);
  updateHUD(); updateTicker();
  if (!cont) setTimeout(() => showModal({ icon: '🚀', title: 'A bordo', html: `La <b>${S.shipName}</b> es tuya: una nave minera modesta con 600 créditos y un sueño.<br><br>
    <b>Mina</b> asteroides, <b>comercia</b> entre planetas, <b>sobrevive</b> a los piratas y aprovecha las crisis del sistema para <b>ganar influencia</b>.<br><br>Sigue los objetivos de la esquina superior izquierda.`,
    buttons: [{ label: '¡Vamos!', cls: 'primary', fn: () => selectLoc('luna') }, { label: 'Cómo jugar', fn: openHelp }] }), 300);
  checkTut();
}

// ---------- inicio ----------
function init() {
  setupTouchControls();
  $('bShip').onclick = openShip; $('bFac').onclick = openFactions; $('bNews').onclick = openNews; $('bMenu').onclick = openMenu;
  const snd = $('bSnd');
  snd.textContent = muted ? '🔇' : '🔊';
  snd.onclick = () => { audioInit(); setMuted(!muted); snd.textContent = muted ? '🔇' : '🔊'; };
  $('zIn').onclick = () => MapScene.onWheel(-300, W / 2, H / 2);
  $('zOut').onclick = () => MapScene.onWheel(300, W / 2, H / 2);
  $('zHome').onclick = () => MapScene.focus(S.loc);
  $('zAll').onclick = () => MapScene.zoomAll();
  $('btnLeave').onclick = () => MineScene.leave();
  $('btnSpeed').onclick = () => { BattleScene.speed = BattleScene.speed === 1 ? 2 : BattleScene.speed === 2 ? 4 : 1; $('btnSpeed').textContent = 'Velocidad ×' + BattleScene.speed; };
  $('btnRetreat').onclick = () => BattleScene.retreat();
  $('newg').onclick = () => { if (hasSave()) { showModal({ icon: '⚠️', title: '¿Nueva partida?', html: 'Se sobrescribirá tu partida guardada.', buttons: [{ label: 'Empezar de nuevo', cls: 'danger', fn: () => { S = null; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} startGame(false); } }, { label: 'Cancelar', fn: () => {} }] }); } else startGame(false); };
  $('cont').onclick = () => startGame(true);
  $('howto').onclick = () => { openHelp(); };
  for (const el of document.querySelectorAll('.ui')) {
    el.addEventListener('mouseenter', () => mouse.onUI = true);
    el.addEventListener('mouseleave', () => mouse.onUI = false);
  }
  const params = new URLSearchParams(location.search);
  if (params.has('thumb')) return thumbMode(params.get('thumb'));
  setScene(TitleScene);
  requestAnimationFrame(frame);
}

// ---------- modo miniatura (portada del juego) ----------
function thumbMode(kind) {
  document.body.classList.add('thumb');
  newGame();
  S.lv = { hull: 4, laser: 4, engine: 4, tank: 3, shield: 3, weapons: 3, drones: 3, scanner: 3 };
  $('title').classList.add('hidden'); $('hud').classList.add('hidden');
  const t = 12.3;
  drawSpaceBg(ctx, W, H, 120, 80, t, '#141a44');
  drawPlanet(ctx, W * 0.83, H * 0.26, H * 0.36, LOC.saturno, Math.PI * 0.85, t);
  drawSun(ctx, -W * 0.02, H * 0.95, 70, t);
  MineScene.loc = LOC.saturno;
  const rocks = [];
  const mk = (x, y, tier, ore, rich) => { const r = { x, y, r: [0, 20, 34, 56][tier] * 1.5, tier, ore, rich, rot: rand(0, TAU), hit: 0, shape: makeRockShape(9 + tier * 2, 0.22),
    veins: Array.from({ length: 3 + tier * 2 }, () => { const a = rand(0, TAU), d = rand(0, 0.6); return [Math.cos(a) * d, Math.sin(a) * d, rand(0.07, 0.16)]; }),
    craters: Array.from({ length: tier }, () => { const a = rand(0, TAU), d = rand(0, 0.5); return [Math.cos(a) * d, Math.sin(a) * d, rand(0.1, 0.2)]; }) }; rocks.push(r); return r; };
  const big = mk(W * 0.64, H * 0.6, 3, 'iridium', true);
  mk(W * 0.86, H * 0.78, 2, 'platinum', false); mk(W * 0.5, H * 0.86, 1, 'ice', false); mk(W * 0.92, H * 0.5, 1, 'he3', true); mk(W * 0.24, H * 0.92, 2, 'nickel', false); mk(W * 0.72, H * 0.14, 1, 'exotic', true);
  for (const r of rocks) drawRock(ctx, r, t, 3);
  const sx = W * 0.3, sy = H * 0.62;
  const ang = Math.atan2(big.y - sy, big.x - sx);
  // láser
  const col = laserColor(4), nx = sx + Math.cos(ang) * 90 * Math.min(1, W / 1024), ny = sy + Math.sin(ang) * 90 * Math.min(1, W / 1024);
  const hx = big.x - Math.cos(ang) * big.r * 0.8, hy = big.y - Math.sin(ang) * big.r * 0.8;
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = col; ctx.globalAlpha = 0.4; ctx.lineWidth = 16;
  ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.globalAlpha = 1; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  glow(ctx, hx, hy, 60, col, 1);
  const P = new Particles();
  for (let i = 0; i < 60; i++) { const a = ang + Math.PI + rand(-1.2, 1.2), v = rand(10, 80); P.add(hx + Math.cos(a) * v, hy + Math.sin(a) * v, 0, 0, rand(0.3, 1), Math.random() < 0.5 ? ITEMS.iridium.c : col, rand(1.5, 4)); }
  P.draw(ctx);
  for (let i = 0; i < 7; i++) drawOreChunk(ctx, { x: sx + 60 + i * 38 + rand(-10, 10), y: sy + 70 + Math.sin(i) * 26, ore: pick(['iridium', 'platinum', 'he3']), rot: i }, 0);
  // piratas a lo lejos
  drawEnemyShip(ctx, 'corsair', W * 0.95, H * 0.93, Math.PI * 1.1, 1.3, t);
  drawEnemyShip(ctx, 'raider', W * 0.88, H * 0.97, Math.PI * 1.05, 1.1, t);
  drawPlayerShip(ctx, S.lv, sx, sy, ang, 3.0 * Math.min(1, W / 1280 * 1.25), 1, t);
  // título
  if (kind !== 'clean') {
    const s = Math.min(W / 1280, H / 720);
    ctx.textAlign = 'left';
    ctx.font = `900 ${Math.round(92 * s)}px Orbitron, 'Arial Black', sans-serif`;
    ctx.shadowColor = '#3de8ff'; ctx.shadowBlur = 30 * s;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('SOLAR', 60 * s, 130 * s);
    ctx.fillStyle = '#3de8ff';
    ctx.fillText('PROSPECTOR', 60 * s, 225 * s);
    ctx.shadowBlur = 0;
    ctx.font = `600 ${Math.round(30 * s)}px Rajdhani, sans-serif`;
    ctx.fillStyle = '#ffd24a';
    ctx.fillText('MINA · COMERCIA · DOMINA EL SISTEMA SOLAR', 64 * s, 275 * s);
  }
  document.body.dataset.ready = '1';
}

window.addEventListener('load', init);
</script>
