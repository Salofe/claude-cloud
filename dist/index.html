<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Solar Prospector</title>
<meta name="description" content="Mine asteroids, upgrade your ship, trade between planets and rule the Solar System.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root {
  --bg: #070b1c; --panel: rgba(10, 17, 40, 0.92); --panel2: rgba(18, 28, 60, 0.9); --line: rgba(61, 232, 255, 0.22);
  --cyan: #3de8ff; --gold: #ffd24a; --good: #6dffb0; --bad: #ff4d6d; --warn: #ffb347; --txt: #dbe6ff; --dim: #8394bd;
  --ft: 'Rajdhani', 'Segoe UI', system-ui, sans-serif; --fh: 'Orbitron', 'Arial Black', sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--txt); font-family: var(--ft); font-size: 15px; user-select: none; -webkit-user-select: none; touch-action: none; }
canvas#c { position: fixed; inset: 0; display: block; }
.hidden { display: none !important; }
b { color: #fff; }
.cr { color: var(--gold) !important; }
.badt { color: var(--bad) !important; }
.dim { color: var(--dim); }
small { color: var(--dim); }
button { font-family: var(--ft); cursor: pointer; }

/* ---------- botones ---------- */
.btn { background: linear-gradient(180deg, #1b2a55, #111b3b); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: 15px; letter-spacing: .3px; transition: .12s; }
.btn:hover:not(:disabled) { border-color: var(--cyan); box-shadow: 0 0 12px rgba(61,232,255,.35); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, #25d3f0, #0e8fb8); color: #03121f; border-color: #7af2ff; }
.btn.danger { background: linear-gradient(180deg, #ff5d7a, #b82643); color: #fff; border-color: #ff9aab; }
.btn.ore { background: linear-gradient(180deg, #ffd24a, #c98a10); color: #231500; border-color: #ffe79a; }
.btn.big { padding: 12px 18px; font-size: 17px; width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: grayscale(.4); }
.x { background: none; border: 1px solid var(--line); color: var(--txt); border-radius: 8px; width: 34px; height: 34px; font-size: 16px; }
.x:hover { border-color: var(--cyan); }
.chip { display: inline-block; border: 1px solid var(--c, var(--line)); color: var(--c, var(--txt)); border-radius: 20px; padding: 2px 9px; font-size: 12px; font-weight: 700; margin: 2px 4px 2px 0; }
.chip.good { --c: var(--good); } .chip.warn { --c: var(--warn); } .chip.bad { --c: var(--bad); } .chip.ore { --c: var(--gold); }

/* ---------- título ---------- */
#title { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(7,11,28,0) 30%, rgba(7,11,28,.7)); }
.tbox { text-align: center; padding: 20px; max-width: 640px; width: 100%; }
#title h1 { font-family: var(--fh); font-weight: 900; font-size: clamp(30px, 7.5vw, 62px); line-height: 1; white-space: nowrap; margin: 0; color: var(--cyan); text-shadow: 0 0 30px rgba(61,232,255,.6), 0 0 2px #fff; letter-spacing: 2px; }
#title h1 span { display: block; color: #fff; }
.tag { font-size: clamp(15px, 3.5vw, 21px); color: var(--gold); letter-spacing: 3px; text-transform: uppercase; font-weight: 700; margin: 14px 0 30px; }
.tbox .tbtns { display: flex; flex-direction: column; gap: 10px; max-width: 320px; margin: 0 auto; }
.foot { color: var(--dim); font-size: 13px; margin-top: 26px; }

/* ---------- HUD ---------- */
.topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: linear-gradient(180deg, rgba(5,9,24,.95), rgba(5,9,24,.75)); border-bottom: 1px solid var(--line); z-index: 10; padding-top: max(8px, env(safe-area-inset-top)); }
.stat { display: flex; flex-direction: column; min-width: 0; }
.stat .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); white-space: nowrap; }
.stat .lbl em { font-style: normal; }
.stat .lbl .sh { display: none; }
.stat .lbl small { color: var(--txt); font-weight: 700; margin-left: 4px; text-transform: none; }
.stat b { font-size: 19px; font-family: var(--fh); font-weight: 600; letter-spacing: .5px; }
.stat.cr b { color: var(--gold); }
.stat.bar { width: 130px; }
.stat.infl b { color: #ffc857; }
.meter { height: 8px; background: rgba(255,255,255,.08); border-radius: 5px; overflow: hidden; margin-top: 4px; border: 1px solid rgba(255,255,255,.06); }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, #ffb347, #ffd24a); border-radius: 5px; transition: width .25s; }
.meter.hp i { background: linear-gradient(90deg, #36d17b, #6dffb0); }
.meter.cargo i { background: linear-gradient(90deg, #1c9fd6, #3de8ff); }
.meter.gold i { background: linear-gradient(90deg, #ff9d2a, #ffd24a); }
.meter.low i { background: linear-gradient(90deg, #b82643, #ff4d6d); animation: pulse 1s infinite; }
.meter.full i { background: linear-gradient(90deg, #ff9d2a, #ffd24a); }
.meter.big { height: 14px; }
@keyframes pulse { 50% { opacity: .5; } }
.topbar .tbtns { margin-left: auto; display: flex; gap: 6px; }
.topbar .tbtns button { background: rgba(255,255,255,.04); border: 1px solid var(--line); color: var(--txt); border-radius: 8px; padding: 6px 10px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
.topbar .tbtns button:hover { border-color: var(--cyan); }
#objective { position: fixed; top: 70px; left: 14px; width: 250px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 8px; padding: 9px 12px; z-index: 5; display: flex; flex-direction: column; gap: 1px; pointer-events: none; }
#objective small { font-size: 10px; letter-spacing: 1.5px; color: var(--gold); }
#objective b { font-size: 16px; }
#objective span { font-size: 13px; color: var(--dim); }
#objective em { font-size: 12px; color: var(--good); font-style: normal; font-weight: 700; }
#objective.flash { animation: flash .9s; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(255,210,74,.9); } 100% { box-shadow: 0 0 0 20px rgba(255,210,74,0); } }
#ticker { position: fixed; bottom: 0; left: 0; right: 0; height: 26px; background: rgba(5,9,24,.88); border-top: 1px solid var(--line); overflow: hidden; z-index: 5; font-size: 13px; line-height: 26px; white-space: nowrap; padding-bottom: env(safe-area-inset-bottom); }
#tickerIn { display: inline-block; padding-left: 100%; animation: tick 70s linear infinite; }
#tickerIn span { margin: 0 6px; }
#tickerIn i { color: var(--cyan); font-style: normal; font-weight: 700; font-size: 11px; }
#tickerIn .sep { color: var(--gold); }
@keyframes tick { to { transform: translateX(-100%); } }

/* ---------- mapa ---------- */
#mapTools { position: fixed; left: 14px; bottom: 40px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
#mapTools button { width: 40px; height: 40px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); color: var(--cyan); font-size: 19px; }
#mapTools button:hover { border-color: var(--cyan); }
.panel { position: fixed; right: 14px; top: 70px; width: 340px; max-height: calc(100% - 110px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; z-index: 6; box-shadow: 0 10px 40px rgba(0,0,0,.5); backdrop-filter: blur(6px); animation: slidein .2s ease-out; }
@keyframes slidein { from { transform: translateX(20px); opacity: 0; } }
.lp-head { display: flex; justify-content: space-between; align-items: flex-start; }
.lp-head h3 { margin: 0; font-family: var(--fh); font-size: 22px; letter-spacing: 1px; color: #fff; }
.chips { margin: 8px 0; }
.desc { color: #b8c6e8; margin: 6px 0 10px; line-height: 1.35; }
.sub { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--cyan); margin: 12px 0 6px; font-weight: 700; }
.ores { display: flex; flex-wrap: wrap; gap: 5px; }
.ore { border: 1px solid var(--c); color: var(--c); border-radius: 6px; padding: 2px 7px; font-size: 13px; font-weight: 700; background: rgba(0,0,0,.25); }
.ore b { color: #fff; }
.warnline { color: var(--warn); font-size: 13px; margin-top: 6px; }
.evs { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.ev { background: rgba(255,200,87,.08); border: 1px solid rgba(255,200,87,.3); border-radius: 8px; padding: 6px 9px; font-size: 14px; }
.travel { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 14px 0 10px; }
.travel div { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06); border-radius: 8px; padding: 6px 9px; display: flex; flex-direction: column; }
.travel small { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
.travel b { font-size: 17px; }
.lp-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.here { text-align: center; color: var(--cyan); font-weight: 700; margin-top: 8px; font-size: 13px; letter-spacing: 1px; }
#travelBanner { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--cyan); border-radius: 30px; padding: 8px 22px; font-size: 16px; z-index: 6; box-shadow: 0 0 20px rgba(61,232,255,.3); white-space: nowrap; }

/* ---------- minería ---------- */
.minebox { position: fixed; top: 70px; right: 14px; width: 210px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; z-index: 5; }
.minebox .mname { font-family: var(--fh); font-size: 14px; color: var(--gold); margin-bottom: 3px; }
#mineInfo { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
.crow { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.crow i { width: 9px; height: 9px; border-radius: 2px; transform: rotate(45deg); }
.crow b { margin-left: auto; }
.minebtns { position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; z-index: 5; }
.hint { font-size: 13px; color: var(--dim); }
#touchUI { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
#joyZone { position: absolute; left: 0; bottom: 0; width: 55%; height: 65%; pointer-events: auto; }
#joyBase { position: absolute; width: 110px; height: 110px; border-radius: 50%; border: 2px solid rgba(61,232,255,.35); background: rgba(61,232,255,.06); opacity: 0; pointer-events: none; }
#joyBase.on { opacity: 1; }
#joyKnob { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%; background: rgba(61,232,255,.5); box-shadow: 0 0 16px rgba(61,232,255,.6); }
#fireBtn { position: absolute; right: 26px; bottom: 90px; width: 96px; height: 96px; border-radius: 50%; background: radial-gradient(circle, rgba(255,210,74,.5), rgba(255,140,40,.25)); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-family: var(--fh); font-size: 13px; color: #fff; pointer-events: auto; text-shadow: 0 0 6px #000; }
#fireBtn.on { background: radial-gradient(circle, rgba(255,240,150,.8), rgba(255,160,40,.5)); transform: scale(.95); }

/* ---------- combate ---------- */
#battleUI { position: fixed; bottom: 40px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 5; pointer-events: none; }
#battleUI .bt-btns { display: flex; gap: 10px; pointer-events: auto; }
.bt-title { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); font-family: var(--fh); color: var(--bad); letter-spacing: 3px; font-size: 18px; text-shadow: 0 0 12px rgba(255,77,109,.7); animation: pulse 1.2s infinite; }

/* ---------- modal ---------- */
#modal { position: fixed; inset: 0; background: rgba(3,6,16,.6); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 16px; backdrop-filter: blur(3px); }
.mbox { background: var(--panel); border: 1px solid var(--cyan); border-radius: 14px; padding: 22px 24px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 0 40px rgba(61,232,255,.25); animation: pop .22s ease-out; max-height: 90vh; overflow-y: auto; }
.mbox.danger { border-color: var(--bad); box-shadow: 0 0 40px rgba(255,77,109,.3); }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }
.micon { font-size: 44px; line-height: 1; margin-bottom: 6px; }
.mbox h2 { font-family: var(--fh); margin: 4px 0 10px; font-size: 21px; color: #fff; letter-spacing: 1px; }
.mbody { color: #c4d0ee; line-height: 1.45; font-size: 16px; }
.mbtns { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.fleet { margin-bottom: 8px; }

/* ---------- hoja ---------- */
.sheet { position: fixed; inset: 60px 0 26px 0; margin: 0 auto; max-width: 900px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; z-index: 20; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.6); animation: pop .2s ease-out; backdrop-filter: blur(8px); }
.sh-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sh-head h2 { margin: 0; font-family: var(--fh); font-size: 19px; letter-spacing: 1px; }
.sh-head h2 small { font-family: var(--ft); font-size: 14px; margin-left: 6px; }
.sh-body { padding: 12px 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.sheet.dock .sh-body { overflow: hidden; }
.st-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-size: 14px; }
.st-fac { color: var(--c); font-weight: 700; }
.st-cr { color: var(--gold); font-weight: 700; }
.tabs { display: flex; gap: 4px; margin: 10px 0; overflow-x: auto; flex-shrink: 0; }
.tab { background: rgba(255,255,255,.04); border: 1px solid transparent; color: var(--dim); border-radius: 8px; padding: 7px 12px; font-size: 15px; font-weight: 700; white-space: nowrap; }
.tab.on { color: #fff; border-color: var(--cyan); background: rgba(61,232,255,.1); }
.tab .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
.tabbody { overflow-y: auto; flex: 1; min-height: 0; padding-right: 4px; }
.empty { text-align: center; color: var(--dim); padding: 30px 10px; }
.empty.small { padding: 8px; font-size: 14px; }

.mkt-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.mkt { display: flex; flex-direction: column; }
.mrow { display: grid; grid-template-columns: 1.6fr 1fr .6fr 1.3fr 1fr 1.3fr; align-items: center; gap: 6px; padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,.05); }
.mrow.two { grid-template-columns: 1fr auto auto; }
.mrow.mh { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
.mname { display: flex; align-items: center; gap: 7px; font-weight: 700; flex-wrap: wrap; }
.mname small { font-size: 11px; font-weight: 500; }
.sw { width: 10px; height: 10px; border-radius: 2px; transform: rotate(45deg); flex-shrink: 0; }
.price { font-weight: 700; }
.up { color: var(--good); font-style: normal; font-size: 11px; }
.dn { color: var(--bad); font-style: normal; font-size: 11px; }
.evi { font-style: normal; color: var(--gold); }
.bb { display: flex; gap: 3px; }
.bb button, .mini { background: rgba(61,232,255,.08); border: 1px solid var(--line); color: var(--txt); border-radius: 6px; padding: 4px 7px; font-size: 13px; font-weight: 700; min-width: 30px; }
.bb button:hover, .mini:hover { border-color: var(--cyan); background: rgba(61,232,255,.18); }
.bb button.all { color: var(--cyan); }

.yard-top { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
#yardShip { border-radius: 10px; border: 1px solid var(--line); max-width: 100%; }
.yard-stats { flex: 1; min-width: 220px; font-size: 14px; line-height: 1.6; }
.yard-stats h4 { margin: 0 0 4px; font-family: var(--fh); font-size: 16px; }
.upgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
.upg { background: var(--panel2); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.upg.maxed { border-color: rgba(255,210,74,.4); }
.uh { display: flex; align-items: center; gap: 7px; }
.uicon { color: var(--cyan); font-size: 16px; width: 20px; text-align: center; }
.pips { display: inline-flex; gap: 3px; margin-left: auto; }
.pips i { width: 12px; height: 5px; border-radius: 2px; background: rgba(255,255,255,.12); }
.pips i.on { background: var(--cyan); box-shadow: 0 0 5px var(--cyan); }
.un { font-size: 14px; color: var(--dim); }
.ud { font-size: 13px; color: #b8c6e8; min-height: 18px; }
.upg .btn { margin-top: 4px; padding: 6px 10px; font-size: 14px; }

.svc { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.svcard { background: var(--panel2); border-radius: 10px; padding: 14px; border: 1px solid rgba(255,255,255,.07); }
.svcard h4 { margin: 0 0 8px; font-size: 18px; }
.svcard .btn { margin: 4px 4px 0 0; }

.contract { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel2); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
.contract.ready { border-color: var(--good); box-shadow: 0 0 12px rgba(109,255,176,.2); }
.contract small { display: block; margin-top: 2px; }

.inv p { color: #c4d0ee; }
.invlv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.ivc { background: var(--panel2); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px; text-align: center; }
.ivc.own { border-color: var(--gold); background: rgba(255,210,74,.08); }
.ivc.next { border-color: var(--cyan); }
.ivc em { font-style: normal; font-weight: 700; color: var(--gold); margin-top: 4px; }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.srow { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 14px; }
.srow b { margin-left: auto; }
.srow .pips { margin-left: 8px; }
.inf-big { text-align: center; margin-bottom: 10px; }
.inf-big > div:first-child { display: flex; align-items: baseline; justify-content: center; gap: 8px; }
.inf-big b { font-family: var(--fh); font-size: 44px; color: var(--gold); }
.inf-big .rank { font-family: var(--fh); color: var(--cyan); margin-top: 6px; letter-spacing: 1px; }
.fac { display: grid; grid-template-columns: 180px 1fr 40px; gap: 10px; align-items: center; padding: 5px 0; font-weight: 700; }
.fac b { text-align: right; }
.repbar { height: 10px; background: rgba(255,255,255,.06); border-radius: 5px; position: relative; overflow: hidden; }
.repbar i { position: absolute; top: 0; bottom: 0; }
.repbar em { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.4); }
.news { display: grid; grid-template-columns: 58px 26px 1fr; gap: 6px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 14px; color: #c4d0ee; }
.news i { color: var(--cyan); font-style: normal; font-weight: 700; font-size: 12px; }
.menu { display: flex; flex-direction: column; gap: 10px; max-width: 340px; margin: 20px auto; width: 100%; }
.help h4 { margin: 14px 0 4px; color: var(--cyan); font-size: 17px; }
.help p { margin: 0; color: #c4d0ee; line-height: 1.45; }

/* ---------- banner de eventos y toasts ---------- */
#eventBanner { position: fixed; top: 64px; left: 50%; transform: translate(-50%, calc(-100% - 90px)); visibility: hidden; width: min(560px, calc(100% - 24px)); background: linear-gradient(180deg, rgba(40,28,6,.96), rgba(20,14,4,.96)); border: 1px solid var(--gold); border-radius: 12px; padding: 12px 16px; z-index: 25; display: flex; gap: 12px; align-items: center; transition: transform .45s cubic-bezier(.2,1.3,.4,1), visibility .45s; box-shadow: 0 0 30px rgba(255,210,74,.3); pointer-events: none; }
#eventBanner.show { transform: translate(-50%, 0); visibility: visible; }
#eventBanner .eicon { font-size: 36px; }
#eventBanner small { color: var(--gold); letter-spacing: 1.5px; font-size: 10px; font-weight: 700; }
#eventBanner b { display: block; font-size: 18px; font-family: var(--fh); font-weight: 600; }
#eventBanner p { margin: 2px 0 0; font-size: 14px; color: #e8dcc0; }
#toasts { position: fixed; bottom: 44px; right: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 40; pointer-events: none; align-items: flex-end; }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--cyan); border-radius: 8px; padding: 8px 14px; font-weight: 700; font-size: 15px; animation: slidein .2s ease-out; transition: opacity .4s, transform .4s; max-width: 320px; }
.toast.good { border-left-color: var(--good); }
.toast.bad { border-left-color: var(--bad); }
.toast.out { opacity: 0; transform: translateX(20px); }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .topbar { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 4px 10px; padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top)); }
  .topbar .tbtns { grid-column: 2 / 5; justify-content: flex-end; }

// ---------- noise ----------
function hash2(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y, s, P) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const m = k => ((k % P) + P) % P;
  const a = hash2(m(xi), yi, s), b = hash2(m(xi + 1), yi, s), c = hash2(m(xi), yi + 1, s), d = hash2(m(xi + 1), yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
// tileable horizontally with period P (in noise units at base frequency)
function fbm(x, y, s, P, oct) {
  let v = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < (oct || 4); i++) { v += amp * vnoise(x * f, y * f, s + i * 31, P * f); norm += amp; f *= 2; amp *= 0.5; }
  return v / norm;
}
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixc(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function ramp(stops, t) {
  t = clamp(t, 0, 1);
  for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) {
    const [t0, c0] = stops[i - 1], [t1, c1] = stops[i];
    return mixc(c0, c1, (t - t0) / (t1 - t0 || 1));
  }
  return stops[stops.length - 1][1];
}

// ---------- backdrop (pre-rendered, tileable nebula) ----------
const BD = 512;
let backdrop = null;
function makeBackdrop() {
  const c = document.createElement('canvas'); c.width = BD; c.height = BD;
  const x = c.getContext('2d');
  const img = x.createImageData(BD, BD);
  const P = 4;
  for (let j = 0; j < BD; j++) for (let i = 0; i < BD; i++) {
    const u = i / BD * P, v = j / BD * P;
    const n1 = fbm(u, v, 11, P, 5), n2 = fbm(u + 3.1, v + 1.7, 29, P, 4), n3 = fbm(u * 2, v * 2, 47, P * 2, 3);
    let col = [5, 8, 22];
    const purple = Math.pow(clamp((n1 - 0.45) * 2.6, 0, 1), 1.6);
    const teal = Math.pow(clamp((n2 - 0.5) * 2.8, 0, 1), 1.7);
    const pink = Math.pow(clamp((n3 - 0.58) * 3, 0, 1), 2);
    col = mixc(col, [58, 28, 110], purple * 0.85);
    col = mixc(col, [16, 78, 110], teal * 0.7);
    col = mixc(col, [120, 30, 90], pink * 0.5);
    const k = (j * BD + i) * 4;
    img.data[k] = col[0]; img.data[k + 1] = col[1]; img.data[k + 2] = col[2]; img.data[k + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  // faint dust stars baked in
  let s = 5; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 900; i++) {
    x.globalAlpha = 0.15 + r() * 0.45;
    x.fillStyle = r() > 0.8 ? '#ffe6c8' : r() > 0.6 ? '#bcd8ff' : '#ffffff';
    x.fillRect(r() * BD, r() * BD, 1, 1);
  }
  x.globalAlpha = 1;
  backdrop = c;
}
function makeStars(n, w, h, seed) {
  let s = seed || 1;
  const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const out = [];
  for (let i = 0; i < n; i++) out.push({ x: r() * w, y: r() * h, z: 0.25 + r() * 0.75, t: r() * TAU, c: r() });

}

function drawSpaceBg(ctx, W, H, camX, camY, t, tint) {
  if (!backdrop) makeBackdrop();
  const sc = 2.2, tw = BD * sc;
  const ox = -(((camX * 0.06) % tw) + tw) % tw, oy = -(((camY * 0.06) % tw) + tw) % tw;
  ctx.imageSmoothingEnabled = true;
  for (let x = ox; x < W; x += tw) for (let y = oy; y < H; y += tw) ctx.drawImage(backdrop, x, y, tw, tw);
  if (tint) { ctx.globalAlpha = 0.35; ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  // vignette
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,6,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    const px = ((s.x - camX * s.z * 0.25) % 2000 + 2000) % 2000;
    const py = ((s.y - camY * s.z * 0.25) % 2000 + 2000) % 2000;
    for (let ox2 = 0; ox2 < W; ox2 += 2000) for (let oy2 = 0; oy2 < H; oy2 += 2000) {
      const x = px + ox2, y = py + oy2;
      if (x > W || y > H) continue;
      const twk = 0.55 + 0.45 * Math.sin(t * 1.5 + s.t);

function glow(ctx, x, y, r, color, a) {
  if (!(r > 0)) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  const pa = ctx.globalAlpha;
  ctx.globalAlpha = pa * (a == null ? 1 : a);
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = pa;

    const n = fbm(u, v, seed, P, 5);

        const land = fbm(u * 4 / 6, v * 4 / 6, seed + 5, 4, 5);
        if (land > 0.575) col = ramp([[0, [78, 150, 70]], [0.5, [120, 150, 70]], [1, [170, 140, 95]]], (land - 0.575) * 4 + (n - 0.5));

        col = ramp([[0, [70, 70, 78]], [1, [215, 215, 220]]], n * 0.9 + 0.15);

      }
      case 'rock': col = mixc(D, L, clamp((n - 0.3) * 1.6, 0, 1)); break;
      case 'marsgreen': {

        if (land > 0.5) col = ramp([[0, [90, 140, 70]], [0.6, [170, 110, 70]], [1, [200, 120, 80]]], (land - 0.5) * 3 + (n - 0.5));

// ---------- particles ----------
class Particles {
  constructor() { this.list = []; }
  add(x, y, vx, vy, life, col, size, glowy) { this.list.push({ x, y, vx, vy, life, max: life, col, size, glowy }); }
  burst(x, y, n, col, spd, life, size) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, v = spd * (0.3 + Math.random() * 0.7);
      this.add(x, y, Math.cos(a) * v, Math.sin(a) * v, life * (0.5 + Math.random() * 0.5), col, size * (0.5 + Math.random()), true);
    }
  }
  update(dt) {
    for (const p of this.list) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy *= 0.98; p.life -= dt; }
    this.list = this.list.filter(p => p.life > 0);
    if (this.list.length > 900) this.list.splice(0, this.list.length - 900);
  }
  draw(ctx) {
    ctx.globalCompositeOperation = 'lighter';
    for (const p of this.list) {
      const k = p.life / p.max;
      ctx.globalAlpha = k;
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + k * 0.6), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
}

'use strict';

}
function hasSave() { return !!loadSave(); }
const has = stage => S && S.unlock >= stage;
const locOpen = id => has(LOC[id].tier || 0);
const upgOpen = k => has(UPG[k].stage);
const locZone = id => LOC[id].field ? LOC[id].field.z : (LOC[id].parent && LOC[LOC[id].parent].field ? LOC[LOC[id].parent].field.z : clamp((LOC[id].tier || 0) - 2, 0, 5));

// ---------- derived stats ----------
const ship = {
  get cargoMax() { return Math.floor(UPG.hull.cargo[S.lv.hull - 1] * (1 + 0.25 * (S.lv.cargo - 1))); },
  get hpMax() { return UPG.hull.hp[S.lv.hull - 1]; },
  get mass() { return UPG.hull.mass[S.lv.hull - 1]; },
  get fuelMax() { return Math.round(60 * Math.pow(1.22, S.lv.tank - 1)); },
  get laserDps() { return 12 * Math.pow(1.19, S.lv.laser - 1); },
  get laserRange() { return 190 + Math.min(190, (S.lv.laser - 1) * 6); },
  get thrust() { return Math.min(2.2, 1 + 0.06 * (S.lv.engine - 1)); },
  get speed() { return 1 + 0.12 * (S.lv.engine - 1); },
  get eff() { return 1 + 0.07 * (S.lv.engine - 1); },
  get warpTime() { return Math.max(1.5, 5 - 0.2 * (S.lv.engine - 1)); },
  get shieldMax() { return S.lv.shield > 1 ? Math.round(30 * Math.pow(1.24, S.lv.shield - 2)) : 0; },
  get weaponDps() { return 15 * Math.pow(1.19, S.lv.weapons - 1); },
  get magnet() { return 130 + Math.min(370, (S.lv.magnet - 1) * 16); },
  get drones() { return Math.min(6, Math.floor((S.lv.magnet - 1) / 3)); },
  get avoid() { return [0, 0.12, 0.22, 0.32, 0.42][S.lv.scanner - 1]; },
  get refinery() { return Math.pow(1.1, S.lv.refinery - 1); },
};
function incomeMult() {
  let inv = 0; for (const id in S.invest) inv += S.invest[id];
  return ship.refinery * (1 + INVEST.bonus * inv) * (built('dyson') ? 5 : 1);
}
function cargoUsed() { let n = 0; for (const k in S.cargo) n += S.cargo[k]; return n; }
function cargoFree() { return ship.cargoMax - cargoUsed(); }
function addCargo(k, n) { S.cargo[k] = (S.cargo[k] || 0) + n; if (S.cargo[k] <= 0) delete S.cargo[k]; }
function oreValueAt(locId) { let v = 0; for (const k of ORES) if (S.cargo[k]) v += (sellPrice(locId, k) || 0) * S.cargo[k]; return v; }
function oreValueBase(k) { return ITEMS[k].b * incomeMult(); }

// ---------- orbital positions ----------
function locPos(loc, day) {
  if (typeof loc === 'string') loc = LOC[loc];
  if (loc.follow) {
    const f = LOC[loc.follow];
    const a = f.a0 + day / f.period * TAU + loc.offset;
    return { x: Math.cos(a) * f.r, y: Math.sin(a) * f.r };
  }
  const a = loc.a0 + day / loc.period * TAU;
  if (loc.parent) {
    const p = locPos(LOC[loc.parent], day);
    return { x: p.x + Math.cos(a) * loc.r, y: p.y + Math.sin(a) * loc.r };
  }
  return { x: Math.cos(a) * loc.r, y: Math.sin(a) * loc.r };
}
function locDist(a, b, day) { const p = locPos(a, day), q = locPos(b, day); return Math.hypot(p.x - q.x, p.y - q.y); }
function travelInfo(to, from) {
  from = from || S.loc;
  const d = Math.max(8, locDist(from, to, S.day));
  let fuel = Math.ceil(d * 0.1 * ship.mass / ship.eff * fuelEventMult() * (built('beacons') ? 0.7 : 1));
  let days = Math.max(1, Math.round(d / (22 * ship.speed * (built('beacons') ? 1.5 : 1))));
  if (built('gates')) { fuel = 0; days = 1; }
  const danger = routeDanger(from, to);

}
function fuelEventMult() { let m = 1; for (const e of S.events) if (e.fuelCost) m *= e.fuelCost; return m; }
function locDanger(id) {

}
function routeDanger(a, b) {

  return clamp(base * (1 - ship.avoid), 0, 0.9);
}

// ---------- market ----------
function eventPriceMult(locId, item) {
  let m = 1;

  return m;
}
function basePrice(locId, item) {
  const l = LOC[locId];
  const mult = l.market && l.market[item];
  if (mult == null) return null;
  const b = ITEMS[item].ore ? ITEMS[item].b * incomeMult() * (built('elevator') ? 1.25 : 1) : itemBase(item);
  const pm = locId === 'marte' && built('terraform') ? 2 : 1;
  return b * mult * pm * (1 + (S.drift[locId][item] || 0)) * (S.sat[locId][item] || 1) * eventPriceMult(locId, item);
}
function priceRatio(locId, item) {
  const l = LOC[locId]; const m = l.market && l.market[item]; if (m == null) return 0;
  return m * (1 + (S.drift[locId][item] || 0)) * (S.sat[locId][item] || 1) * eventPriceMult(locId, item) * (locId === 'marte' && built('terraform') ? 2 : 1);
}
function sellPrice(locId, item) { const p = basePrice(locId, item); return p == null ? null : Math.max(1, Math.round(p * 0.95)); }
function buyPrice(locId, item) {
  const l = LOC[locId]; const mult = l.market && l.market[item];
  if (mult == null || mult > 1.0 || ITEMS[item].ore) return null;
  return Math.max(2, Math.round(basePrice(locId, item) * 1.07));
}
function fuelPrice(locId) {
  let p = (LOC[locId].fuel || 6) * (1 + S.unlock * 0.5); for (const e of S.events) if (e.fuelPrice) p *= e.fuelPrice; return Math.max(1, Math.round(p * 10) / 10);
}
function marketClosed(locId) { return S.events.some(e => e.closed && e.closed.includes(locId)); }

function earn(n) {
  S.credits += n; S.stats.earned += n;
  checkUnlocks();
}
function doSell(locId, item, n) {
  n = Math.min(n, S.cargo[item] || 0);
  let total = 0;
  for (let i = 0; i < n; i++) {
    total += sellPrice(locId, item);
    S.sat[locId][item] = Math.max(0.55, S.sat[locId][item] * (ITEMS[item].ore ? 0.9985 : 0.982));
  }
  addCargo(item, -n);
  S.stats.traded += n;
  const l = LOC[locId];
  if (n > 0 && l.faction) {

    for (const e of S.events) if (e.relief && e.relief.loc === locId && e.relief.item === item) gain += n * 0.35;
    if (item === 'arms') for (const e of S.events) if (e.war && e.war.includes(l.faction)) {

    }
    repChange(l.faction, gain, true);

}
function doBuy(locId, item, n) {
  n = Math.min(n, cargoFree());

  for (let i = 0; i < n; i++) {
    const p = buyPrice(locId, item);
    if (p == null || S.credits - total < p) break;
    total += p; bought++;

function repChange(f, d, silent) {

  if (!silent && Math.abs(d) >= 1) toast(`${FACTIONS[f].n}: ${d > 0 ? '+' : ''}${Math.round(d)} reputation`, d > 0 ? 'good' : 'bad');
  return S.rep[f] - before;
}

function sellAllOre(id, r) {
  r = r || { sold: [], total: 0 };

}
// Where else would this cargo sell for more? (open stations, best first)
function betterMarkets(id) {

    .map(l => ({ id: l.id, v: oreValueAt(l.id), fuel: travelInfo(l.id).fuel }))

function dockAtStation() {

function tickDay() {
  S.day++;
  for (const id in S.sat) for (const k in S.sat[id]) {
    S.sat[id][k] += (1 - S.sat[id][k]) * 0.08;
    S.drift[id][k] = clamp(S.drift[id][k] * 0.96 + rand(-0.035, 0.035), -0.25, 0.25);
  }

  if (has(U.TRADE)) {
    const ended = S.events.filter(e => e.end <= S.day);

    S.events = S.events.filter(e => e.end > S.day);
    if (S.day >= S.nextEvent) {
      if (S.events.length < 3) spawnEvent();
      S.nextEvent = S.day + randi(9, 17);
    }
    for (const id in S.nextContracts) if (S.day >= S.nextContracts[id]) genContracts(id);
    for (const c of [...S.active]) if (S.day > c.deadline) {

}

const MapScene = {

  },
  w2s(x, y) { return { x: (x - this.cam.x) * this.cam.z + W / 2, y: (y - this.cam.y) * this.cam.z + H / 2 }; },
  s2w(x, y) { return { x: (x - W / 2) / this.cam.z + this.cam.x, y: (y - H / 2) / this.cam.z + this.cam.y }; },
  pr(loc) { return loc.size * clamp(this.cam.z * 1.5, 1, 3.4); },
  spos(loc, day) {

    if (loc.parent) {
      const par = LOC[loc.parent];
      const pp = this.spos(par, day);
      const a = loc.a0 + day / loc.period * TAU;
      const d = Math.max(loc.r * this.cam.z, this.pr(par) + this.pr(loc) + 14);
      return { x: pp.x + Math.cos(a) * d, y: pp.y + Math.sin(a) * d };
    }
    const p = locPos(loc, day);
    return this.w2s(p.x, p.y);
  },
  routeCurve(a, b) {
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const sun = this.w2s(0, 0);
    let nx = -(b.y - a.y), ny = b.x - a.x; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
    if ((mx - sun.x) * nx + (my - sun.y) * ny < 0) { nx = -nx; ny = -ny; }
    const bend = Math.min(90, nl * 0.22);

      const p = clamp(tr.el / tr.dur, 0, 1);
      const dayNow = Math.floor(p * tr.days);
      while (tr.dayDone < dayNow) { tr.dayDone++; tickDay(); }
      tr.frac = p * tr.days - dayNow;
      if (tr.enc && !tr.encDone && p >= tr.enc.at) { tr.encDone = true; tr.paused = true; runEncounter(tr.enc, () => { tr.paused = false; }); }
      if (p >= 1 && !tr.paused) return this.arrive();
      // camera follows the ship
      if (tr.shipPos) {
        const w = this.s2w(tr.shipPos.x, tr.shipPos.y);
        const k = 1 - Math.pow(0.15, dt);
        this.cam.x = lerp(this.cam.x, w.x, k * 0.6); this.cam.y = lerp(this.cam.y, w.y, k * 0.6);
      }
    } else if (this.camT) {
      const k = 1 - Math.pow(0.02, dt);
      this.cam.x = lerp(this.cam.x, this.camT.x, k); this.cam.y = lerp(this.cam.y, this.camT.y, k); this.cam.z = lerp(this.cam.z, this.camT.z, k);
      if (Math.abs(this.cam.z - this.camT.z) < 0.001 && Math.abs(this.cam.x - this.camT.x) < 0.5) this.camT = null;
    }
  },
  startTravel(to) {
    const info = travelInfo(to);
    if (info.fuel > S.fuel) { toast('Not enough fuel', 'bad'); sfx('full'); return; }
    if (S.loc === to) return;
    S.fuel -= info.fuel;
    const dur = built('gates') ? 1.1 : clamp(1.2 + info.days * 0.3, 1.6, 6);
    let enc = null;
    if (Math.random() < info.danger) enc = { kind: 'hostile', at: rand(0.3, 0.7), danger: info.danger };
    else if (Math.random() < 0.22 + info.days * 0.01) enc = { kind: 'random', at: rand(0.25, 0.75), danger: info.danger };
    const war = S.events.find(e => e.war && (e.locs.includes(to) || e.locs.includes(S.loc)));
    if (war && !enc && Math.random() < 0.45) enc = { kind: 'patrol', at: rand(0.3, 0.7), war };
    const storm = S.events.find(e => e.storm && (e.storm.includes(to) || e.storm.includes(S.loc)));
    this.travel = { from: S.loc, to, days: info.days, dur, el: 0, dayDone: 0, frac: 0, enc, encDone: false, storm };
    S.stats.dist += info.d;
    sfx('warp');
    showMapUI(false); hideLocPanel();
    const tb = $('travelBanner');
    tb.classList.remove('hidden');
    tb.innerHTML = `Flying to <b>${LOC[to].n}</b> · ${info.days} day${info.days > 1 ? 's' : ''}`;
    const p = locPos(S.loc, S.day), q = locPos(to, S.day);
    const span = Math.max(Math.abs(p.x - q.x), Math.abs(p.y - q.y)) / 2 + 110;
    this.camT = null;
    this.zoomTarget = clamp(Math.min(W, H) / 2 / span, 0.45, 2.2);
    this.cam.z = lerp(this.cam.z, this.zoomTarget, 0.5);
  },
  arrive() {
    const tr = this.travel; this.travel = null;
    S.loc = tr.to;
    $('travelBanner').classList.add('hidden');
    if (tr.storm) {
      const dmg = Math.max(0, randi(8, 20) - ship.shieldMax * 0.15);
      S.hull = Math.max(1, S.hull - dmg);
      if (dmg) toast(`The solar storm damaged your hull (−${Math.round(dmg)})`, 'bad');
    }
    save();
    this.focus(S.loc);
    updateHUD();
    openDock();
  },
  draw(ctx) {
    const t = this.t;
    const tr = this.travel;
    if (tr && this.zoomTarget) this.cam.z = lerp(this.cam.z, this.zoomTarget, 0.03);
    drawSpaceBg(ctx, W, H, this.cam.x * this.cam.z, this.cam.y * this.cam.z, t);
    const z = this.cam.z;
    const sun = this.w2s(0, 0);
    const day = S.day + (tr ? tr.frac : 0);
    // orbits with bright trailing arc
    for (const l of LOCS) {
      if (l.parent || l.follow) continue;
      const R = l.r * z, open = locOpen(l.id);
      ctx.strokeStyle = open ? 'rgba(120,170,255,0.16)' : 'rgba(120,170,255,0.06)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(sun.x, sun.y, R, 0, TAU); ctx.stroke();
      if (open && l.id !== 'kuiper') {
        const a = l.a0 + day / l.period * TAU;
        for (let i = 0; i < 12; i++) {
          ctx.strokeStyle = `rgba(120,200,255,${0.32 * (1 - i / 12)})`; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(sun.x, sun.y, R, a - (i + 1) * 0.05, a - i * 0.05); ctx.stroke();
        }
      }
    }
    // belts
    const beltOpen = has(U.BELT), kOpen = has(U.FRONTIER);
    for (const b of BELT) { const a = b.a + day / 560 * TAU * b.sp; ctx.globalAlpha = beltOpen ? 0.75 : 0.3; ctx.fillStyle = b.c; ctx.fillRect(sun.x + Math.cos(a) * b.r * z, sun.y + Math.sin(a) * b.r * z, b.s, b.s); }
    for (const b of KUIPER) { const a = b.a + day / 3300 * TAU * b.sp; ctx.globalAlpha = kOpen ? 0.6 : 0.2; ctx.fillStyle = b.c; ctx.fillRect(sun.x + Math.cos(a) * b.r * z, sun.y + Math.sin(a) * b.r * z, b.s, b.s); }
    ctx.globalAlpha = 1;
    const tp = this.spos('troyanos', day);
    ctx.fillStyle = locOpen('troyanos') ? 'rgba(210,190,160,0.75)' : 'rgba(210,190,160,0.25)';
    for (let i = 0; i < 50; i++) { const a = i * 2.4 + t * 0.02, rr = (i % 9) * 2.6 * clamp(z, 0.8, 2.2); ctx.fillRect(tp.x + Math.cos(a) * rr, tp.y + Math.sin(a) * rr * 0.8, 1.6, 1.6); }
    drawSun(ctx, sun.x, sun.y, clamp(15 * z, 10, 36), t);
    if (built('dyson')) {
      const R = clamp(15 * z, 10, 36) * 2.6;
      ctx.strokeStyle = 'rgba(255,210,74,0.35)'; ctx.lineWidth = 1;
      for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.ellipse(sun.x, sun.y, R * (1 + k * 0.15), R * (0.35 + k * 0.1), k * 1.1 + t * 0.05, 0, TAU); ctx.stroke(); }
      ctx.fillStyle = '#ffe9a0';
      for (let i = 0; i < 140; i++) { const a = i * 2.39996 + t * (0.2 + (i % 5) * 0.05), rr = R * (0.8 + (i % 7) * 0.08); ctx.fillRect(sun.x + Math.cos(a) * rr, sun.y + Math.sin(a) * rr * (0.5 + (i % 3) * 0.2), 1.6, 1.6); }
    }
    if (built('beacons')) {
      for (const id of ['mercurio', 'venus', 'tierra', 'marte', 'ceres']) {
        const R = LOC[id].r * z;
        for (let i = 0; i < 8; i++) { const a = i * TAU / 8 + id.length; const on = Math.sin(t * 3 + i + id.length) > 0.3; ctx.fillStyle = on ? '#3de8ff' : 'rgba(61,232,255,0.3)'; ctx.fillRect(sun.x + Math.cos(a) * R - 1.5, sun.y + Math.sin(a) * R - 1.5, 3, 3); }
      }
    }
    // route preview
    const selId = this.sel;
    if (!tr && selId && selId !== S.loc && locOpen(selId)) {
      const q = this.routeCurve(this.spos(S.loc), this.spos(selId));
      const ok = travelInfo(selId).fuel <= S.fuel;
      ctx.setLineDash([7, 7]); ctx.lineDashOffset = -t * 24;
      ctx.strokeStyle = ok ? 'rgba(61,232,255,0.9)' : 'rgba(255,90,110,0.85)'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(q.a.x, q.a.y); ctx.quadraticCurveTo(q.c.x, q.c.y, q.b.x, q.b.y); ctx.stroke();
      ctx.setLineDash([]);
    }
    // bodies
    for (const l of LOCS) {
      if (l.id === 'troyanos') continue;
      const p = this.spos(l, day);
      const r = this.pr(l);
      const open = l.body ? locOpen(l.id) : locOpen(l.id);
      ctx.globalAlpha = open ? 1 : 0.35;
      const la = Math.atan2(sun.y - p.y, sun.x - p.x);
      if (l.id === 'kuiper') {
        glow(ctx, p.x, p.y, r * 2.5, '#9fb6ff66', 0.7);
        ctx.fillStyle = '#c9d6ff';
        for (let i = 0; i < 11; i++) { const a = i * 0.7 + t * 0.1; ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * r * (0.4 + (i % 3) * 0.45), p.y + Math.sin(a * 1.3) * r * 0.8, 1.7, 0, TAU); ctx.fill(); }
      } else drawPlanet(ctx, p.x, p.y, r, l, la, t);
      ctx.globalAlpha = 1;
    }
    this.drawProjects(ctx, t, day);
    // node markers & labels
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const l of NODES) {
      const p = this.spos(l, day);
      const open = locOpen(l.id);
      const r = this.pr(l) + (l.id === 'troyanos' ? 10 : 0);
      const isSel = l.id === selId, isHere = l.id === S.loc && !tr, isHov = l.id === this.hover;
      if (open && l.station) {
        const a = t * 0.6 + (l.r || 3);
        const sx = p.x + Math.cos(a) * (r + 8), sy = p.y + Math.sin(a) * (r + 8) * 0.6;
        drawStationIcon(ctx, sx, sy, 2.6, l.faction ? FACTIONS[l.faction].c : '#6dffb0', t);
      }
      if (isHere) {
        const pr = r + 10 + (t * 16 % 16);
        ctx.strokeStyle = `rgba(61,232,255,${0.7 * (1 - (t * 16 % 16) / 16)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, pr, 0, TAU); ctx.stroke();
      }
      if (isSel || isHov) {
        ctx.strokeStyle = isSel ? '#3de8ff' : 'rgba(61,232,255,0.5)'; ctx.lineWidth = 2;
        const rr = r + 8 + Math.sin(t * 4) * 1.5;
        for (let i = 0; i < 4; i++) { const a0 = i * TAU / 4 + t * 0.8; ctx.beginPath(); ctx.arc(p.x, p.y, rr, a0, a0 + 0.9); ctx.stroke(); }
      }
      // label pill
      const label = open ? l.n.toUpperCase() : '🔒 ' + l.n.toUpperCase();
      ctx.font = `700 ${isSel ? 12 : 11}px Rajdhani, sans-serif`;
      const tw = ctx.measureText(label).width + 14, ly = p.y + r + 14;
      ctx.globalAlpha = open ? 1 : 0.55;
      ctx.fillStyle = isSel ? 'rgba(61,232,255,0.22)' : 'rgba(6,12,30,0.72)';
      roundRect(ctx, p.x - tw / 2, ly - 8, tw, 16, 8); ctx.fill();
      ctx.strokeStyle = isSel ? '#3de8ff' : 'rgba(120,170,255,0.25)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = isSel ? '#ffffff' : '#cfe0ff';
      ctx.fillText(label, p.x, ly + 0.5);
      ctx.globalAlpha = 1;
      if (open) {
        let icons = '';
        if (l.field) icons += '⛏';
        const evs = S.events.filter(e => e.locs && e.locs.includes(l.id));
        for (const e of evs) icons += e.icon;
        const dg = locDanger(l.id);
        if (dg >= 0.2) icons += dg > 0.45 ? '☠☠' : '☠';
        if (S.active.some(c => c.type === 'deliver' && c.to === l.id)) icons += '📜';
        if (icons) { ctx.font = '12px sans-serif'; ctx.fillText(icons, p.x, p.y - r - 10); }
      }
    }
    ctx.textBaseline = 'alphabetic';
    // player ship
    if (tr) {
      const q = this.routeCurve(this.spos(tr.from), this.spos(tr.to));
      const p = clamp(tr.el / tr.dur, 0, 1), e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      const sp = this.bez(q, e), sp2 = this.bez(q, Math.min(1, e + 0.01));
      const ang = Math.atan2(sp2.y - sp.y, sp2.x - sp.x);
      tr.shipPos = sp;
      ctx.strokeStyle = 'rgba(61,232,255,0.25)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 6]);
      ctx.beginPath(); ctx.moveTo(q.a.x, q.a.y); ctx.quadraticCurveTo(q.c.x, q.c.y, q.b.x, q.b.y); ctx.stroke(); ctx.setLineDash([]);
      const ec = ENGINE_COL[shipLv().engine - 1];
      if (!tr.paused) for (let i = 0; i < 2; i++) this.trail.add(sp.x - Math.cos(ang) * 10 + rand(-2, 2), sp.y - Math.sin(ang) * 10 + rand(-2, 2), -Math.cos(ang) * 20 + rand(-8, 8), -Math.sin(ang) * 20 + rand(-8, 8), 0.8, ec, 2.2);
      this.trail.draw(ctx);
      drawPlayerShip(ctx, shipLv(), sp.x, sp.y, ang, 0.55, 1, t);
      if (built('fleet')) for (const o of [-1, 1]) drawPlayerShip(ctx, { hull: 1, engine: 3, weapons: 3, laser: 1 }, sp.x - Math.cos(ang) * 14 - Math.sin(ang) * o * 12, sp.y - Math.sin(ang) * 14 + Math.cos(ang) * o * 12, ang, 0.3, 1, t);
    } else {
      this.trail.draw(ctx);
      const p = this.spos(S.loc);
      const r = this.pr(LOC[S.loc]) + 16;
      const a = t * 0.7;
      drawPlayerShip(ctx, shipLv(), p.x + Math.cos(a) * r, p.y + Math.sin(a) * r, a + Math.PI / 2, 0.42, 0.5, t);
    }
  },
  drawProjects(ctx, t, day) {
    if (built('driver')) {
      const a = this.spos('luna', day), b = this.spos('tierra', day);
      ctx.strokeStyle = 'rgba(255,210,74,0.35)'; ctx.lineWidth = 1.5; ctx.setLineDash([2, 4]);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.setLineDash([]);
      for (let i = 0; i < 3; i++) { const k = (t * 0.8 + i / 3) % 1; glow(ctx, lerp(a.x, b.x, k), lerp(a.y, b.y, k), 5, '#ffd24a', 0.9); }
    }
    if (built('elevator')) {
      const e = this.spos('tierra', day), sun = this.w2s(0, 0), r = this.pr(LOC.tierra);
      const a = Math.atan2(e.y - sun.y, e.x - sun.x) + 2.2, L = r * 2.4;
      ctx.strokeStyle = 'rgba(220,235,255,0.8)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(e.x + Math.cos(a) * r, e.y + Math.sin(a) * r); ctx.lineTo(e.x + Math.cos(a) * L, e.y + Math.sin(a) * L); ctx.stroke();
      drawStationIcon(ctx, e.x + Math.cos(a) * L, e.y + Math.sin(a) * L, 2.4, '#ffd24a', t);
    }
    if (built('ringstation')) {
      const p = this.spos('saturno', day), r = this.pr(LOC.saturno);
      const a = t * 0.3;
      glow(ctx, p.x + Math.cos(a) * r * 1.9, p.y + Math.sin(a) * r * 0.55, 10, '#ffd24a', 0.9);
      drawStationIcon(ctx, p.x + Math.cos(a) * r * 1.9, p.y + Math.sin(a) * r * 0.55, 3, '#ffd24a', t);
    }
    if (built('gates')) {
      for (const l of NODES) if (l.station && locOpen(l.id)) {
        const p = this.spos(l, day), r = this.pr(l) + 20;
        ctx.strokeStyle = `rgba(180,120,255,${0.5 + 0.3 * Math.sin(t * 4 + (l.r || 3))})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(p.x - r, p.y, 3, 7, 0, 0, TAU); ctx.stroke();
        glow(ctx, p.x - r, p.y, 8, '#a07cff', 0.6);
      }
    }
  },
  pick(x, y) {
    let best = null, bd = 1e9;
    for (const l of NODES) {
      const p = this.spos(l);
      const d = Math.hypot(p.x - x, p.y - y);
      const hit = Math.max(22, this.pr(l) + 14);
      if (d < hit && d < bd) { bd = d; best = l.id; }
    }
    return best;
  },
  onDown(x, y) { this.drag = { x, y, cx: this.cam.x, cy: this.cam.y, moved: false }; },
  onMove(x, y, down) {
    if (down && this.drag) {
      const dx = x - this.drag.x, dy = y - this.drag.y;
      if (Math.hypot(dx, dy) > 6) this.drag.moved = true;
      if (this.drag.moved && !this.travel) { this.camT = null; this.cam.x = this.drag.cx - dx / this.cam.z; this.cam.y = this.drag.cy - dy / this.cam.z; }
    } else this.hover = this.travel ? null : this.pick(x, y);
    canvas.style.cursor = this.hover ? 'pointer' : 'default';
  },
  onUp(x, y) {
    if (this.drag && !this.drag.moved && !this.travel) {
      const id = this.pick(x, y);
      if (id) { selectLoc(id); sfx('click'); }
    }
    this.drag = null;
  },
  onWheel(dy, x, y) {
    if (this.travel) return;
    const before = this.s2w(x, y);
    this.camT = null;
    this.cam.z = clamp(this.cam.z * Math.pow(1.0015, -dy), 0.35, 3.5);
    const after = this.s2w(x, y);
    this.cam.x += before.x - after.x; this.cam.y += before.y - after.y;
  },
  onPinch(scale, x, y) { this.onWheel(-Math.log(scale) / Math.log(1.0015), x, y); },
};

// ============ TRAVEL ENCOUNTERS ============
function runEncounter(enc, done) {
  if (enc.kind === 'hostile') return pirateEncounter(enc.danger, done);
  if (enc.kind === 'patrol') return patrolEncounter(enc.war, done);
  const opts = ['derelict', 'comet', 'meteor', 'derelict', 'comet'];
  if (has(U.BELT)) opts.push('distress', 'distress');
  if (has(U.TRADE)) opts.push('trader');
  const k = pick(opts);
  const trap = has(U.BELT);
  if (k === 'derelict') {
    showModal({ icon: '🛰️', title: 'Drifting wreck', html: 'Your sensors spot an abandoned freighter. It might have cargo on board…' + (trap ? ' or it might be bait.' : ''),
      buttons: [
        { label: 'Salvage it', cls: 'primary', fn: () => {
          if (trap && Math.random() < 0.22 - ship.avoid * 0.3) { toast('It was a trap!', 'bad'); sfx('alarm'); return pirateEncounter(enc.danger + 0.1, done); }
          const pool = has(U.TRADE) ? ITEM_KEYS : ORES.slice(0, 5);
          const it = pick(pool); const n = Math.min(cargoFree(), randi(3, 6 + S.lv.hull * 3));
          if (n > 0) { addCargo(it, n); toast(`+${n} ${ITEMS[it].n}`, 'good'); sfx('pickup'); } else toast('Cargo hold full — nothing to take', 'bad');
          done();
        } },
        { label: 'Ignore', fn: done },
      ] });
  } else if (k === 'distress') {
    const fac = pick(['tierra', 'marte', 'cinturon', 'exterior']);
    showModal({ icon: '🆘', title: 'Distress signal', html: `A <b style="color:${FACTIONS[fac].c}">${FACTIONS[fac].n}</b> ship's life support is failing. Helping costs 5 fuel.`,
      buttons: [
        { label: 'Help (−5 ⛽)', cls: 'primary', disabled: S.fuel < 5, fn: () => {
          S.fuel -= 5;
          if (Math.random() < 0.18) { toast('Pirate ambush!', 'bad'); sfx('alarm'); return pirateEncounter(enc.danger + 0.15, done); }
          const cr = randi(150, 400) + S.day * 4; repChange(fac, 6); earn(cr);
          toast(`They pay you ${fmt(cr)} cr for the rescue`, 'good'); sfx('cash'); done();
        } },
        { label: 'Ignore', fn: () => { repChange(fac, -1, true); done(); } },
      ] });
  } else if (k === 'trader') {
    const items = Object.keys(S.cargo);
    if (!items.length) return done();
    const it = pick(items); const n = S.cargo[it]; const price = Math.round(ITEMS[it].b * rand(1.15, 1.45));
    showModal({ icon: '🧑‍🚀', title: 'Wandering trader', html: `An independent trader offers to buy your <b>${n} ${ITEMS[it].n}</b> for <b>${price} cr</b> each.`,
      buttons: [
        { label: `Sell (${fmt(n * price)} cr)`, cls: 'primary', fn: () => { addCargo(it, -n); earn(n * price); sfx('cash'); done(); } },
        { label: 'No thanks', fn: done },
      ] });
  } else if (k === 'meteor') {
    const dmg = Math.max(0, randi(4, 12) - ship.shieldMax * 0.2);
    S.hull = Math.max(1, S.hull - dmg);
    showModal({ icon: '☄️', title: 'Micrometeor shower', html: dmg > 0 ? `You fly through a dust cloud. Your hull takes <b>${Math.round(dmg)}</b> damage.` : 'Your shields deflect every impact. Not a scratch!',
      buttons: [{ label: 'Continue', cls: 'primary', fn: done }] });
    sfx('hit');
  } else {
    const n = Math.min(cargoFree(), randi(6, 14));
    showModal({ icon: '☄️', title: 'Comet on your path', html: `A small comet crosses your route. You can harvest <b>${n} Ice</b> for free.`,
      buttons: [
        { label: 'Harvest ice', cls: 'primary', disabled: n <= 0, fn: () => { addCargo('ice', n); toast(`+${n} Ice`, 'good'); sfx('pickup'); done(); } },
        { label: 'Keep flying', fn: done },
      ] });
  }
}

function travelZone() {
  const tr = MapScene.travel;
  const a = tr ? tr.from : S.loc, b = tr ? tr.to : S.loc;
  return clamp(Math.max(locZone(a), locZone(b)), 2, 5);
}
function startBattle(fleet, enemyFirst, done) {
  setScene(MineScene, { fleet, z: travelZone(), done });
  if (enemyFirst) MineScene.p.shield = 0;
}
function pirateEncounter(danger, done) {
  const fleet = buildFleet(danger);
  const z = travelZone();
  const bribe = Math.round(Math.max(50, fleet.reduce((a, k) => a + ENEMIES[k].loot, 0) * Z_LOOT[z] * 0.8 + S.credits * 0.03));
  const friendly = S.rep.piratas >= 35;
  const flee = clamp(0.25 + S.lv.engine * 0.03 - fleet.length * 0.04, 0.1, 0.85);
  const threat = fleetThreat(fleet, z);
  const tl = threat < 0.6 ? ['Low', '#6dffb0', 'Easy pickings — and nice loot.'] : threat < 1.2 ? ['Medium', '#ffc857', 'A fair fight. Keep moving!'] : threat < 2 ? ['High', '#ff934a', 'Dangerous. Upgrade guns & shields.'] : ['Extreme', '#ff4d6d', 'Run or pay!'];
  sfx('alarm');
  const btns = [];
  if (friendly) btns.push({ label: 'Hail the Syndicate', cls: 'primary', fn: () => { toast('They recognize you and let you pass', 'good'); done(); } });
  btns.push({ label: '⚔ Fight!', cls: friendly ? '' : 'danger', fn: () => startBattle(fleet, false, done) });
  btns.push({ label: `Run (${Math.round(flee * 100)}%)`, fn: () => {
    if (Math.random() < flee) { toast('You escaped!', 'good'); sfx('warp'); done(); }
    else { toast('Escape failed — they caught you!', 'bad'); startBattle(fleet, true, done); }
  } });
  btns.push({ label: `Pay them off (${fmt(bribe)} cr)`, disabled: S.credits < bribe, fn: () => { S.credits -= bribe; repChange('piratas', 2, true); toast('The pirates take your money', 'good'); done(); } });
  showModal({ icon: '☠️', title: 'Pirate ambush!', danger: true,
    html: `<div class="fleet">${fleet.map(k => `<span class="chip bad">${ENEMIES[k].n}</span>`).join('')}</div>
    <div class="threat">Threat: <b style="color:${tl[1]}">${tl[0]}</b> — ${tl[2]}</div>
    <small>You fly and shoot: <b>hold the mouse</b> (or FIRE) to fire your guns. Destroyed ships drop credits.</small>`,
    buttons: btns });
}

function patrolEncounter(war, done) {
  const fac = war.war.find(f => FACTIONS[f].locs.includes(MapScene.travel ? MapScene.travel.to : S.loc)) || war.war[0];
  const arms = S.cargo.arms || 0;
  sfx('alarm');
  if (!arms || S.rep[fac] >= 25) {
    showModal({ icon: '🛡️', title: 'Military patrol', html: `A <b style="color:${FACTIONS[fac].c}">${FACTIONS[fac].n}</b> patrol scans your ship and waves you through.`, buttons: [{ label: 'Continue', cls: 'primary', fn: done }] });
    return;
  }
  showModal({ icon: '🛡️', title: 'Military patrol', danger: true, html: `The <b style="color:${FACTIONS[fac].c}">${FACTIONS[fac].n}</b> finds <b>${arms} Weapons</b> in your hold and demands you hand them over.`,
    buttons: [
      { label: 'Hand them over', cls: 'primary', fn: () => { addCargo('arms', -arms); toast('Weapons confiscated', 'bad'); done(); } },
      { label: '⚔ Resist', cls: 'danger', fn: () => { repChange(fac, -12); startBattle(['patrol', 'patrol'], false, done); } },
    ] });
}

// ---- mining.js ----
'use strict';
// ============ SCENE: MINING FIELD / SPACE ARENA ============
// The station sits at the bottom. Fly back down into the docking zone to sell.
// The higher up (farther from the station) you go, the richer the rocks.
const MW = 1800, MH = 3400, DOCK_Y = MH - 240;
const Z_HP = [1, 5, 16, 60, 220, 800];
const mineScale = () => 1.35 - (S.lv.hull - 1) * 0.08;
const shipR = () => shipLen(S.lv) * mineScale();
const SPACE = { id: 'space', n: 'Deep Space', col: ['#6a7fb0', '#1b2340'], field: { n: 'Deep Space', z: 2, ores: { iron: 3, nickel: 1 }, count: 10 } };

const MineScene = {
  t: 0, loc: null, rocks: [], chunks: [], drones: [], odrones: [], enemies: [], bolts: [], parts: new Particles(), cam: { x: 0, y: 0 }, shake: 0,
  p: null, dayTimer: 0, ambush: null, laserOn: false, laserHit: null, collected: {}, floaters: [], space: null,
  enter(arg) {
    if (arg && typeof arg === 'object') { this.space = arg; this.loc = { ...SPACE, field: { ...SPACE.field, z: arg.z } }; this.setup(); }
    else if (arg) { this.space = null; this.loc = LOC[arg]; this.setup(); }
    showMineUI(true);
    $('travelBanner').classList.add('hidden');
  },
  exit() { showMineUI(false); laserSound(false); this.laserOn = false; },
  get z() { return this.loc.field.z; },
  setup() {
    const f = this.loc.field;
    this.rocks = []; this.chunks = []; this.parts = new Particles(); this.floaters = []; this.enemies = []; this.bolts = [];
    this.hadCombat = false; this.clearT = 0; this.warp = null; this.armed = false;
    if (this.space) this.p = { x: MW / 2, y: MH / 2, vx: 0, vy: 0, a: -Math.PI / 2, shield: ship.shieldMax, shT: 0, fireCd: 0 };
    else this.p = { x: MW / 2, y: DOCK_Y + 60, vx: 0, vy: -260, a: -Math.PI / 2, shield: ship.shieldMax, shT: 0, fireCd: 0 };
    this.cam = { x: this.p.x, y: this.p.y - 120 };
    this.dayTimer = 0; this.collected = {};
    const rich = S.events.some(e => e.rich === this.loc.id);
    this.target = Math.round(f.count * (rich ? 1.25 : 1));
    if (this.space) {
      for (let i = 0; i < f.count; i++) { let x, y; do { x = rand(100, MW - 100); y = rand(100, MH - 100); } while (Math.hypot(x - this.p.x, y - this.p.y) < 300); this.spawnRock(x, y, pick([1, 2, 2, 3])); }
      Combat.spawn(this, this.space.fleet, this.space.z, false);
    } else {
      for (let i = 0; i < this.target; i++) {
        let x, y;
        if (i < 3) { x = MW / 2 + (i - 1) * 260 + rand(-40, 40); y = DOCK_Y - rand(380, 520); }
        else { x = rand(120, MW - 120); y = rand(120, DOCK_Y - 380); }
        this.spawnRock(x, y, i < 3 ? 3 : pick([3, 3, 2, 2, 1]), null, rich);
      }
    }
    this.escorts = built('fleet') ? [0, 1].map(i => ({ i, x: 0, y: 0, a: 0, gcd: rand(0, 1) })) : [];
    this.drones = [];
    for (let i = 0; i < ship.drones; i++) this.drones.push({ x: this.p.x, y: this.p.y, vx: 0, vy: 0, tgt: null, carry: null, a: i });
    this.odrones = [];
    const o = !this.space && S.outposts[this.loc.id];
    if (o) for (let i = 0; i < Math.min(16, o.n); i++) this.odrones.push({ x: 220 + rand(-30, 30), y: MH - 140, st: 'out', tgt: null, t: rand(0, 3) });
    this.ambush = null;
    if (!this.space) {
      const dg = locDanger(this.loc.id) * (1 - ship.avoid);
      if (Math.random() < dg * 0.9) this.ambush = { at: rand(20, 45), warned: false };
    }
  },
  depthOf(y) { return clamp(1 - y / (DOCK_Y - 300), 0, 1); },
  pickOre(depth) {
    const f = this.loc.field;
    const keys = Object.keys(f.ores).sort((a, b) => ITEMS[a].b - ITEMS[b].b);
    const ws = keys.map((k, i) => f.ores[k] * (1 + depth * 4 * (i / Math.max(1, keys.length - 1))));
    let r = Math.random() * ws.reduce((a, b) => a + b, 0);
    for (let i = 0; i < keys.length; i++) { r -= ws[i]; if (r <= 0) return keys[i]; }
    return keys[0];
  },
  spawnRock(x, y, tier, ore, rich) {
    const depth = this.space ? 0.3 : this.depthOf(y);
    if (!ore) ore = this.pickOre(depth);
    const R = [0, 20, 34, 56][tier] * rand(0.9, 1.15);
    const isRich = Math.random() < (rich ? 0.3 : 0.06) + depth * 0.2;
    const gold = !this.space && Math.random() < 0.006 + depth * 0.02;
    const nv = 2 + Math.floor(tier * 1.5);
    const hp = R * 0.7 * ITEMS[ore].h * Z_HP[this.z] * (gold ? 2 : 1);
    const rock = {
      x, y, vx: rand(-14, 14), vy: rand(-14, 14), rot: rand(0, TAU), vr: rand(-0.4, 0.4), r: R, tier, ore, rich: isRich, gold,
      hp, maxhp: hp, hit: 0, cold: this.loc.field.cold,
      shape: makeRockShape(9 + tier * 2, 0.22),
      veins: Array.from({ length: nv }, () => { const a = rand(0, TAU), d = rand(0, 0.6); return [Math.cos(a) * d, Math.sin(a) * d, rand(0.07, 0.16)]; }),
      craters: Array.from({ length: tier }, () => { const a = rand(0, TAU), d = rand(0, 0.5); return [Math.cos(a) * d, Math.sin(a) * d, rand(0.1, 0.2)]; }),
    };
    this.rocks.push(rock);
    return rock;
  },
  breakRock(r) {
    this.rocks = this.rocks.filter(x => x !== r);
    this.parts.burst(r.x, r.y, 14 + r.tier * 8, r.gold ? '#ffd24a' : '#c9b8a6', 120 + r.tier * 40, 0.8, 2.5);
    this.parts.burst(r.x, r.y, 6 + r.tier * 3, ITEMS[r.ore].c, 90, 1, 2.5);
    sfx('break'); this.shake = Math.max(this.shake, r.tier * 3);
    S.hints.laser = 1;
    if (r.gold) {
      const v = ITEMS[r.ore].b * incomeMult() * 30 * r.tier;
      for (let i = 0; i < 6; i++) { const a = rand(0, TAU), s = rand(40, 120); this.chunks.push({ x: r.x, y: r.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, cr: v / 6, gold: 1, rot: rand(0, TAU), life: 60 }); }
      this.floaters.push({ x: r.x, y: r.y - 30, txt: 'JACKPOT!', col: '#ffd24a', life: 2, big: 1 });
      S.stats.jackpots++; sfx('win');
    }
    if (r.tier > 1) {
      for (let i = 0; i < 2; i++) {
        const c = this.spawnRock(r.x + rand(-10, 10), r.y + rand(-10, 10), r.tier - 1, r.ore);
        const a = rand(0, TAU); c.vx = r.vx + Math.cos(a) * 50; c.vy = r.vy + Math.sin(a) * 50; c.rich = r.rich; c.gold = false; c.hp = c.maxhp = c.maxhp;
      }
      if (Math.random() < 0.5) this.dropChunk(r.x, r.y, r.ore);
    } else {
      const n = randi(1, 2) + (r.rich ? 2 : 0);
      for (let i = 0; i < n; i++) this.dropChunk(r.x, r.y, r.ore);
    }
  },
  dropChunk(x, y, ore) {
    const a = rand(0, TAU), v = rand(20, 60);
    this.chunks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, ore, rot: rand(0, TAU), life: 45 });
  },
  collect(c) {
    if (c.cr) {
      earn(c.cr);
      this.floaters.push({ x: this.p.x + rand(-20, 20), y: this.p.y - 26, txt: '+' + fmt(c.cr) + ' cr', col: '#ffd24a', life: 1.2 });
      sfx('cash');
      return true;
    }
    if (cargoFree() <= 0) return false;
    addCargo(c.ore, 1); S.stats.mined++;
    this.collected[c.ore] = (this.collected[c.ore] || 0) + 1;
    this.floaters.push({ x: this.p.x, y: this.p.y - 22, txt: '+1 ' + ITEMS[c.ore].n, col: ITEMS[c.ore].c, life: 1.1 });
    sfx('pickup');
    return true;
  },
  get inCombat() { return this.enemies.length > 0; },
  update(dt) {
    this.t += dt;
    const p = this.p;
    // --- movement ---
    let ax = 0, ay = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp')) ay -= 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) ay += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) ax -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) ax += 1;
    if (joy.active) { ax = joy.dx; ay = joy.dy; }
    const al = Math.hypot(ax, ay);
    if (al > 1) { ax /= al; ay /= al; }
    const acc = 560 * ship.thrust / Math.pow(ship.mass, 0.3);
    p.vx += ax * acc * dt; p.vy += ay * acc * dt;
    const drag = Math.pow(0.4, dt);
    p.vx *= drag; p.vy *= drag;
    const maxV = 360 * ship.thrust;
    const v = Math.hypot(p.vx, p.vy);
    if (v > maxV) { p.vx *= maxV / v; p.vy *= maxV / v; }
    p.x = clamp(p.x + p.vx * dt, 40, MW - 40); p.y = clamp(p.y + p.vy * dt, 40, MH - 40);
    this.thrusting = Math.hypot(ax, ay);
    if (!S.hints.move) { this.moved = (this.moved || 0) + v * dt; if (this.moved > 160) S.hints.move = 1; }
    // --- aim & fire ---
    let aim = null, firing = false;
    const wm = { x: mouse.x - W / 2 + this.cam.x, y: mouse.y - H / 2 + this.cam.y };
    const combat = this.inCombat;
    if (touchFire) {
      let best = null, bd = 1e9;
      const list = combat ? this.enemies : this.rocks;
      for (const r of list) { const d = Math.hypot(r.x - p.x, r.y - p.y) - (r.r || 0); if (d < bd) { bd = d; best = r; } }
      if (best && (combat || bd < ship.laserRange + 40)) { aim = Math.atan2(best.y - p.y, best.x - p.x); firing = true; }
    } else if (mouse.down && !mouse.onUI) { aim = Math.atan2(wm.y - p.y, wm.x - p.x); firing = true; }
    if (keys.has('Space')) { firing = true; if (aim == null) aim = p.a; }
    const targetA = aim != null ? aim : (al > 0.1 ? Math.atan2(ay, ax) : p.a);
    const da = ((targetA - p.a + Math.PI) % TAU + TAU) % TAU - Math.PI;
    p.a += da * Math.min(1, dt * 10);
    this.laserHit = null;
    p.fireCd -= dt;
    if (firing && combat) {
      S.hints.guns = 1;
      if (p.fireCd <= 0) { Combat.firePlayer(this, aim != null ? aim : p.a); p.fireCd = 0.25; }
    } else if (firing) {
      const dir = aim != null ? aim : p.a;
      const dx = Math.cos(dir), dy = Math.sin(dir);
      let best = null, bt = ship.laserRange;
      for (const r of this.rocks) {
        const ox = r.x - p.x, oy = r.y - p.y;
        const proj = ox * dx + oy * dy;
        if (proj < 0) continue;
        const perp2 = ox * ox + oy * oy - proj * proj;
        const rr = r.r * 0.9;
        if (perp2 > rr * rr) continue;
        const tHit = proj - Math.sqrt(rr * rr - perp2);
        if (tHit < bt) { bt = tHit; best = r; }
      }
      const hx = p.x + dx * bt, hy = p.y + dy * bt;
      this.laserHit = { x: hx, y: hy, dir, rock: best };
      if (best) {
        best.hp -= ship.laserDps * dt; best.hit = 0.05;
        if (Math.random() < dt * 30) this.parts.add(hx, hy, -dx * 80 + rand(-60, 60), -dy * 80 + rand(-60, 60), 0.4, Math.random() < 0.5 ? ITEMS[best.ore].c : laserColor(laserTier()), 2, true);
        if (best.hp <= 0) this.breakRock(best);
      }
    }
    const lOn = firing && !combat;
    if (lOn !== this.laserOn) { this.laserOn = lOn; laserSound(lOn, laserTier()); }
    // --- rocks ---
    for (const r of this.rocks) {
      r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vr * dt; r.hit = Math.max(0, r.hit - dt);
      const maxY = this.space ? MH - r.r : DOCK_Y - 120;
      if (r.x < r.r || r.x > MW - r.r) r.vx *= -1;
      if (r.y < r.r || r.y > maxY) r.vy *= -1;
      r.x = clamp(r.x, r.r, MW - r.r); r.y = clamp(r.y, r.r, maxY);
      const dx = p.x - r.x, dy = p.y - r.y, d = Math.hypot(dx, dy), md = r.r + shipR() * 0.4;
      if (d < md && d > 0) {
        const nx = dx / d, ny = dy / d;
        p.x = r.x + nx * md; p.y = r.y + ny * md;
        const rel = (p.vx - r.vx) * nx + (p.vy - r.vy) * ny;
        if (rel < 0) {
          p.vx -= 1.6 * rel * nx; p.vy -= 1.6 * rel * ny;
          r.vx += rel * nx * 0.2 / r.tier; r.vy += rel * ny * 0.2 / r.tier;
          if (-rel > 150) { this.damage((-rel - 130) * 0.04 * (1 + this.z)); sfx('bump'); this.shake = 6; }
        }
      }
    }
    // --- chunks & loot ---
    const cfree = cargoFree();
    for (const c of this.chunks) {
      c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= Math.pow(0.5, dt); c.vy *= Math.pow(0.5, dt); c.life -= dt;
      const dx = p.x - c.x, dy = p.y - c.y, d = Math.hypot(dx, dy);
      const mag = c.cr ? ship.magnet * 1.5 : ship.magnet;
      if (d < mag && (cfree > 0 || c.cr)) { const f = 650 * (1 - d / mag) + 140; c.vx += dx / d * f * dt; c.vy += dy / d * f * dt; }
      if (d < 24 && this.collect(c)) c.dead = true;
      if (c.life <= 0) c.dead = true;
    }
    this.chunks = this.chunks.filter(c => !c.dead);
    // --- collector drones ---
    for (const dr of this.drones) {
      if (dr.tgt && (dr.tgt.dead || !this.chunks.includes(dr.tgt))) dr.tgt = null;
      if (!dr.tgt && !dr.carry && cargoFree() > 0) {
        let best = null, bd = 900;
        for (const c of this.chunks) { if (this.drones.some(o => o !== dr && o.tgt === c)) continue; const d = Math.hypot(c.x - dr.x, c.y - dr.y); if (d < bd) { bd = d; best = c; } }
        dr.tgt = best;
      }
      let tx, ty;
      if (dr.carry) { tx = p.x; ty = p.y; }
      else if (dr.tgt) { tx = dr.tgt.x; ty = dr.tgt.y; }
      else { const a = this.t * 1.5 + dr.a * TAU / Math.max(1, this.drones.length); tx = p.x + Math.cos(a) * 50; ty = p.y + Math.sin(a) * 50; }
      const dx = tx - dr.x, dy = ty - dr.y, d = Math.hypot(dx, dy) || 1;
      dr.vx = lerp(dr.vx, dx / d * Math.min(420, d * 6), dt * 6); dr.vy = lerp(dr.vy, dy / d * Math.min(420, d * 6), dt * 6);
      dr.x += dr.vx * dt; dr.y += dr.vy * dt;
      if (dr.tgt && d < 12) { dr.carry = dr.tgt; dr.tgt.dead = true; this.chunks = this.chunks.filter(c => c !== dr.carry); dr.tgt = null; }
      if (dr.carry && d < 20) { if (!this.collect(dr.carry)) this.chunks.push(Object.assign(dr.carry, { dead: false, x: dr.x, y: dr.y, vx: 0, vy: 0 })); dr.carry = null; }
    }
    // --- outpost drones (cosmetic) ---
    for (const od of this.odrones) {
      od.t -= dt;
      if (od.st === 'out') {
        if (!od.tgt || !this.rocks.includes(od.tgt)) od.tgt = pick(this.rocks.filter(r => r.y < DOCK_Y - 150)) || null;
        if (od.tgt) {
          const tx = od.tgt.x + Math.cos(od.t) * (od.tgt.r + 16), ty = od.tgt.y + Math.sin(od.t) * (od.tgt.r + 16);
          od.x = lerp(od.x, tx, dt * 1.8); od.y = lerp(od.y, ty, dt * 1.8);
          if (Math.hypot(tx - od.x, ty - od.y) < 30 && od.t < -2) { od.st = 'home'; }
        }
      } else {
        od.x = lerp(od.x, 220, dt * 1.2); od.y = lerp(od.y, MH - 150, dt * 1.2);
        if (Math.hypot(220 - od.x, MH - 150 - od.y) < 20) { od.st = 'out'; od.t = rand(2, 4); od.tgt = null; }
      }
    }
    // --- combat ---
    Combat.update(this, dt);
    if (this.clearT > 0) { this.clearT -= dt; if (this.clearT <= 0) this.finishSpace(true); }
    if (this.warp) {
      this.warp.t += dt;
      if (this.warp.t >= ship.warpTime) { sfx('warp'); toast('Warped out!', 'good'); this.finishSpace(false); return; }
    }
    // --- shields & hazards ---
    p.shT -= dt;
    if (p.shT <= 0) p.shield = Math.min(ship.shieldMax, p.shield + (4 + ship.shieldMax * 0.08) * dt);
    if (this.loc.field.hazard === 'heat') this.damage(1.2 * dt * (1 + this.z), true);
    // --- ambush ---
    if (this.ambush) {
      this.ambush.at -= dt;
      if (!this.ambush.warned && this.ambush.at < 3) { this.ambush.warned = true; toast('⚠ Pirates incoming!', 'bad'); sfx('alarm'); }
      if (this.ambush.at <= 0) {
        const fleet = buildFleet(locDanger(this.loc.id));
        this.ambush = null;
        if (S.rep.piratas >= 35) toast('Pirates recognize your ship and leave you alone', 'good');
        else Combat.spawn(this, fleet, this.z, true);
      }
    }
    // --- docking zone ---
    if (!this.space) {
      if (p.y < DOCK_Y - 250) this.armed = true;
      if (this.armed && p.y > DOCK_Y) { this.leave(); return; }
    }
    // --- time ---
    this.dayTimer += dt;
    if (this.dayTimer > 40 && has(U.MAP)) { this.dayTimer = 0; tickDay(); }
    if (!this.space && this.rocks.length < this.target * 0.5 && Math.random() < dt * 0.4) {
      const x = rand(120, MW - 120), y = rand(120, Math.min(DOCK_Y - 400, p.y - 500));
      if (y > 100) this.spawnRock(x, y, 3);
    }
    this.parts.update(dt);
    for (const f of this.floaters) { f.y -= 30 * dt; f.life -= dt; }
    this.floaters = this.floaters.filter(f => f.life > 0);
    const k = 1 - Math.pow(0.001, dt);
    this.cam.x = lerp(this.cam.x, p.x + p.vx * 0.3, k); this.cam.y = lerp(this.cam.y, p.y + p.vy * 0.3 - 60, k);
    this.shake = Math.max(0, this.shake - dt * 20);
    if (this.thrusting > 0.1 && Math.random() < dt * 40) {
      const bx = p.x - Math.cos(p.a) * shipR() * 0.75, by = p.y - Math.sin(p.a) * shipR() * 0.75;
      this.parts.add(bx, by, -Math.cos(p.a) * 60 + rand(-15, 15), -Math.sin(p.a) * 60 + rand(-15, 15), 0.45, ENGINE_COL[Math.min(4, Math.floor((S.lv.engine - 1) / 4))], 2.5);
    }
    this.coach();
    updateMineHUD();
  },
  coach() {
    const h = S.hints;
    let msg = '';
    if (this.inCombat && !h.guns) msg = isTouch ? 'Hold <b>FIRE</b> to shoot the pirates!' : 'Pirates! <b>Hold the mouse</b> to shoot your guns';
    else if (!h.move) msg = isTouch ? 'Drag anywhere on the left side to fly' : 'Fly with <b>WASD</b> or the <b>arrow keys</b>';
    else if (!h.laser) msg = isTouch ? 'Hold <b>LASER</b> — it aims at the nearest rock' : 'Hold the <b>mouse button</b> to fire your mining laser at a rock';
    else if (S.stats.mined < 4) msg = 'Fly close to the glowing crystals to scoop them up';
    else if (!this.space && cargoFree() <= 0) msg = '📦 Cargo full! Fly back <b>down</b> to the station ⬇';

function buildFleet(danger) {
  let budget = (1 + danger * 7) * rand(0.7, 1.25);
  const fleet = [];
  const order = ['carrier', 'frigate', 'corsair', 'raider'];
  while (budget > 0.8 && fleet.length < 6) {
    const opts = order.filter(k => ENEMIES[k].pow <= budget);
    if (!opts.length) break;
    const k = Math.random() < 0.5 ? opts[0] : pick(opts);
    fleet.push(k); budget -= ENEMIES[k].pow;
  }
  if (!fleet.length) fleet.push('raider');

}

        if (e.burstLeft > 0) { e.burstT -= dt; if (e.burstT <= 0) { this.fireEnemy(sc, e); e.burstLeft--; e.burstT = 0.12; } }
      }
      if (Math.random() < dt * 20) sc.parts.add(e.x - Math.cos(e.a) * 16 * e.size, e.y - Math.sin(e.a) * 16 * e.size, rand(-20, 20), rand(-20, 20), 0.3, e.military ? '#9fe0ff' : '#ff6a3a', 2);
    }
    // escort gunships (Private Security Fleet)
    for (const es of sc.escorts || []) {
      const ang = sc.t * 0.9 + es.i * Math.PI;
      const tx = p.x + Math.cos(ang) * 110, ty = p.y + Math.sin(ang) * 110;
      es.x = lerp(es.x || tx, tx, dt * 3); es.y = lerp(es.y || ty, ty, dt * 3);
      const tgt = sc.enemies.filter(e => !e.dead).sort((a, b) => Math.hypot(a.x - es.x, a.y - es.y) - Math.hypot(b.x - es.x, b.y - es.y))[0];
      es.a = tgt ? Math.atan2(tgt.y - es.y, tgt.x - es.x) : p.a;
      es.gcd -= dt;
      if (tgt && es.gcd <= 0 && Math.hypot(tgt.x - es.x, tgt.y - es.y) < 650) {
        es.gcd = 0.35;
        sc.bolts.push({ x: es.x, y: es.y, vx: Math.cos(es.a) * 800, vy: Math.sin(es.a) * 800, life: 1, dmg: ship.weaponDps * 0.12, foe: 0, col: '#ffd24a' });
      }
    }
    // ship drones shoot too
    if (sc.enemies.some(e => !e.dead)) for (const dr of sc.drones) {
      dr.gcd = (dr.gcd || rand(0, 0.8)) - dt;
      if (dr.gcd <= 0) {
        dr.gcd = 0.8;
        const tgt = sc.enemies.filter(e => !e.dead).sort((a, b) => Math.hypot(a.x - dr.x, a.y - dr.y) - Math.hypot(b.x - dr.x, b.y - dr.y))[0];
        if (tgt && Math.hypot(tgt.x - dr.x, tgt.y - dr.y) < 550) {
          const a = Math.atan2(tgt.y - dr.y, tgt.x - dr.x);
          sc.bolts.push({ x: dr.x, y: dr.y, vx: Math.cos(a) * 700, vy: Math.sin(a) * 700, life: 1, dmg: ship.weaponDps * 0.12, foe: 0, col: '#6dffb0' });
        }
      }
    }
    // bolts
    const pr = shipR() * 0.55;
    for (const b of sc.bolts) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0) { b.dead = true; continue; }
      if (b.foe) {
        if (Math.hypot(b.x - p.x, b.y - p.y) < pr + 4) { b.dead = true; sc.damage(b.dmg); sc.parts.burst(b.x, b.y, 8, p.shield > 0 ? '#3de8ff' : '#ffb347', 90, 0.35, 2); sfx(p.shield > 0 ? 'shield' : 'hit'); sc.shake = Math.max(sc.shake, 4); continue; }
      } else {
        for (const e of sc.enemies) if (!e.dead && Math.hypot(b.x - e.x, b.y - e.y) < 18 * e.size + 3) {
          b.dead = true; this.hitEnemy(sc, e, b.dmg);
          sc.parts.burst(b.x, b.y, 5, e.sp > 0 ? '#ff8fb0' : '#ffd24a', 80, 0.3, 2);
          break;
        }
        if (b.dead) continue;
      }
      for (const r of sc.rocks) if (Math.hypot(b.x - r.x, b.y - r.y) < r.r * 0.85) {
        b.dead = true;
        sc.parts.burst(b.x, b.y, 4, '#c9b8a6', 60, 0.3, 2);
        if (!b.foe) { r.hp -= b.dmg * 0.5; r.hit = 0.05; if (r.hp <= 0) sc.breakRock(r); }
        break;
      }
    }
    sc.bolts = sc.bolts.filter(b => !b.dead);
    const before = sc.enemies.length;
    sc.enemies = sc.enemies.filter(e => !e.dead);
    if (before && !sc.enemies.length && sc.hadCombat) sc.onVictory();
  },
  draw(sc, ctx, t) {
    ctx.globalCompositeOperation = 'lighter';
    for (const b of sc.bolts) {
      const a = Math.atan2(b.vy, b.vx);
      ctx.strokeStyle = b.col; ctx.lineWidth = b.foe ? 3.5 : 3;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - Math.cos(a) * 16, b.y - Math.sin(a) * 16); ctx.stroke();
      glow(ctx, b.x, b.y, b.foe ? 10 : 8, b.col, 0.8);
    }
    ctx.globalCompositeOperation = 'source-over';
    for (const es of sc.escorts || []) if (es.x) drawPlayerShip(ctx, { hull: 1, engine: 3, weapons: 3, laser: 1 }, es.x, es.y, es.a, 0.8, 0.6, t);
    for (const e of sc.enemies) {
      drawEnemyShip(ctx, e.k, e.x, e.y, e.a, 1.3, t);
      if (e.hitT > 0) glow(ctx, e.x, e.y, 30 * e.size, '#ffffff', 0.6);
      if (e.shieldFlash > 0) { ctx.strokeStyle = `rgba(255,120,160,${e.shieldFlash * 3})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, 30 * e.size, 0, TAU); ctx.stroke(); }
      const w = 50 * e.size, y = e.y - 32 * e.size - 8;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(e.x - w / 2 - 1, y - 1, w + 2, e.spMax ? 9 : 6);
      ctx.fillStyle = '#ff4d6d'; ctx.fillRect(e.x - w / 2, y, w * clamp(e.hp / e.max, 0, 1), 4);
      if (e.spMax) { ctx.fillStyle = '#ff9ec0'; ctx.fillRect(e.x - w / 2, y + 5, w * clamp(e.sp / e.spMax, 0, 1), 3); }
    }
  },
};

'use strict';
// ============ INTERFACE (DOM) ============
const $ = id => document.getElementById(id);
const isBlocking = () => !$('modal').classList.contains('hidden') || !$('sheet').classList.contains('hidden');
let dockTab = 'upg', lastDock = null, shownCredits = 0;

function toast(msg, cls) {
  const el = document.createElement('div');
  el.className = 'toast ' + (cls || '');
  el.innerHTML = msg;
  $('toasts').appendChild(el);
  setTimeout(() => el.classList.add('out'), 2600);
  setTimeout(() => el.remove(), 3100);
}
function coach(msg) {
  const el = $('coach');
  if (!msg) { el.classList.remove('show'); return; }
  if (el._m !== msg) { el.innerHTML = msg; el._m = msg; }
  el.classList.add('show');
}

function showModal(o) {
  const m = $('modal');
  m.innerHTML = `<div class="mbox ${o.danger ? 'danger' : ''} ${o.cls || ''}">
    ${o.icon ? `<div class="micon">${o.icon}</div>` : ''}
    <h2>${o.title}</h2><div class="mbody">${o.html || ''}</div>
    <div class="mbtns"></div></div>`;
  const bx = m.querySelector('.mbtns');
  o.buttons.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls || '');
    el.innerHTML = b.label; el.disabled = !!b.disabled;
    el.onclick = () => { sfx('click'); closeModal(); b.fn && b.fn(); updateHUD(); };
    bx.appendChild(el);
  });

}
function closeModal() { $('modal').classList.add('hidden'); }

function showEventBanner(ev) {
  const b = $('eventBanner');

}
function updateTicker() {
